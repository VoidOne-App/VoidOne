name: VoidOne Enterprise CodeQL

# Keep generated/build trees out of the database while analyzing the real
# compiled C/C++ source graph.
paths:
  - src

paths-ignore:
  - build
  - build-*
  - cmake-build-*
  - out
  - dist
  - package
  - website
  - docs
  - '**/generated/**'

# Focus CodeQL on security-relevant findings. The broader quality suite can
# produce low-value notes for generated/framework-heavy C++ patterns.
queries:
  - uses: security-extended
