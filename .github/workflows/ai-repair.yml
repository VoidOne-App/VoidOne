name: VoidOne Autonomous AI CI Repair Engine

on:
  workflow_run:
    workflows:
      - "VoidOne CI/CD"
    types:
      - completed

  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Failed GitHub Actions Run ID"
        required: false
        type: string

      force_repair:
        description: "Run repair even if the selected workflow was successful"
        required: false
        type: boolean
        default: false


# ---------------------------------------------------------------------------
# Global permissions
# ---------------------------------------------------------------------------

permissions:
  actions: read
  contents: write
  pull-requests: write


# ---------------------------------------------------------------------------
# Concurrency
# ---------------------------------------------------------------------------

concurrency:
  group: voidone-ai-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false


jobs:

  # =========================================================================
  # AI REPAIR
  # =========================================================================

  ai-repair:

    name: Autonomous AI Repair

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'VoidOne CI/CD' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:

      # ---------------------------------------------------------------------
      # Resolve failed workflow
      # ---------------------------------------------------------------------

      - name: Resolve Target Workflow Run
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          EVENT_NAME: ${{ github.event_name }}

          INPUT_RUN_ID: ${{ inputs.failed_run_id }}

          INPUT_FORCE_REPAIR: ${{ inputs.force_repair }}

          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}

          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}

        run: |

          set -euo pipefail

          TARGET_WORKFLOW="VoidOne CI/CD"

          RUN_ID=""
          HEAD_SHA=""
          RUN_BRANCH=""
          RUN_CONCLUSION=""
          RUN_WORKFLOW_NAME=""

          # =================================================================
          # workflow_run
          # =================================================================

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then

            RUN_ID="$WORKFLOW_RUN_ID"
            HEAD_SHA="$WORKFLOW_HEAD_SHA"
            RUN_BRANCH="$WORKFLOW_HEAD_BRANCH"
            RUN_WORKFLOW_NAME="$WORKFLOW_NAME"

            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              echo "::error::Unable to resolve workflow run ID."
              exit 1
            fi

            if [[ -z "$HEAD_SHA" || "$HEAD_SHA" == "null" ]]; then
              echo "::error::Unable to resolve workflow head SHA."
              exit 1
            fi

            if [[ "$RUN_WORKFLOW_NAME" != "$TARGET_WORKFLOW" ]]; then
              echo "::error::Unexpected workflow:"
              echo "::error::$RUN_WORKFLOW_NAME"
              echo "::error::Expected: $TARGET_WORKFLOW"
              exit 1
            fi

            if [[ "$RUN_BRANCH" != "main" ]]; then
              echo "::error::Failed workflow is not from main."
              echo "::error::Branch: $RUN_BRANCH"
              exit 1
            fi

          # =================================================================
          # workflow_dispatch
          # =================================================================

          else

            if [[ -n "$INPUT_RUN_ID" ]]; then

              RUN_ID="$INPUT_RUN_ID"

            elif [[ "$INPUT_FORCE_REPAIR" == "true" ]]; then

              RUN_ID="$(
                gh run list \
                  --workflow "$TARGET_WORKFLOW" \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // empty'
              )"

            else

              RUN_ID="$(
                gh run list \
                  --workflow "$TARGET_WORKFLOW" \
                  --status failure \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // empty'
              )"

            fi

            if [[ -z "$RUN_ID" ]]; then
              echo "::error::Unable to find a target '$TARGET_WORKFLOW' run."
              exit 1
            fi

            RUN_INFO="$(
              gh run view "$RUN_ID" \
                --json \
                  databaseId \
                  workflowName \
                  conclusion \
                  headBranch \
                  headSha
            )"

            RUN_WORKFLOW_NAME="$(
              jq -r '.workflowName // empty' <<< "$RUN_INFO"
            )"

            RUN_CONCLUSION="$(
              jq -r '.conclusion // empty' <<< "$RUN_INFO"
            )"

            RUN_BRANCH="$(
              jq -r '.headBranch // empty' <<< "$RUN_INFO"
            )"

            HEAD_SHA="$(
              jq -r '.headSha // empty' <<< "$RUN_INFO"
            )"

            if [[ "$RUN_WORKFLOW_NAME" != "$TARGET_WORKFLOW" ]]; then
              echo "::error::Selected run does not belong to '$TARGET_WORKFLOW'."
              echo "::error::Actual workflow: '$RUN_WORKFLOW_NAME'"
              exit 1
            fi

            if [[ -z "$HEAD_SHA" ]]; then
              echo "::error::Selected run does not contain a valid head SHA."
              exit 1
            fi

            if [[ "$INPUT_FORCE_REPAIR" != "true" ]]; then

              if [[ "$RUN_CONCLUSION" != "failure" ]]; then
                echo "::error::Selected workflow run is not failed."
                echo "::error::Conclusion: $RUN_CONCLUSION"
                echo "::error::Use force_repair=true to repair a successful run."
                exit 1
              fi

              if [[ "$RUN_BRANCH" != "main" ]]; then
                echo "::error::Selected failed run is not from main."
                echo "::error::Branch: $RUN_BRANCH"
                exit 1
              fi

            fi

          fi

          # =================================================================
          # Final validation
          # =================================================================

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "::error::Final run ID is invalid."
            exit 1
          fi

          if [[ -z "$HEAD_SHA" || "$HEAD_SHA" == "null" ]]; then
            echo "::error::Final head SHA is invalid."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$RUN_BRANCH" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎯 Target CI Run"
            echo ""
            echo "- Workflow: \`$TARGET_WORKFLOW\`"
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Branch: \`$RUN_BRANCH\`"
            echo "- Commit: \`$HEAD_SHA\`"
            echo "- Conclusion: \`${RUN_CONCLUSION:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"


      # ---------------------------------------------------------------------
      # Checkout exact broken commit
      # ---------------------------------------------------------------------

      - name: Checkout Failed Commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive


      # ---------------------------------------------------------------------
      # Fetch CI logs
      # ---------------------------------------------------------------------

      - name: Download Failed CI Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          FORCE_REPAIR: ${{ inputs.force_repair }}
        shell: bash
        run: |

          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then

            gh run view "$RUN_ID" \
              --log-failed \
              > ci-failure.log

          elif [[ "$FORCE_REPAIR" == "true" ]]; then

            gh run view "$RUN_ID" \
              --log \
              > ci-failure.log

          else

            gh run view "$RUN_ID" \
              --log-failed \
              > ci-failure.log

          fi

          if [[ ! -s ci-failure.log ]]; then
            echo "::error::CI log is empty."
            exit 1
          fi

          tail -n 4000 ci-failure.log \
            > ci-failure-tail.log

          {
            echo "### 📋 CI Failure Log"
            echo ""
            echo '```text'
            tail -n 80 ci-failure-tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ---------------------------------------------------------------------
      # Toolchain
      # ---------------------------------------------------------------------

      - name: Install Build Toolchain
        shell: bash
        run: |

          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            clang-tidy \
            ccache \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libgl1-mesa-dev


      # ---------------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"


      # ---------------------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------------------

      - name: Install AI Dependencies
        shell: bash
        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f scripts/requirements-ai-repair.txt ]]; then

            python -m pip install \
              -r scripts/requirements-ai-repair.txt

          else

            python -m pip install \
              requests

          fi


      # ---------------------------------------------------------------------
      # Ollama
      # ---------------------------------------------------------------------

      - name: Install Ollama
        shell: bash
        run: |

          set -euo pipefail

          if ! command -v ollama >/dev/null 2>&1; then

            curl -fsSL \
              https://ollama.com/install.sh \
              | sh

          fi

          command -v ollama


      - name: Start Ollama
        shell: bash
        run: |

          set -euo pipefail

          nohup ollama serve \
            > ollama.log 2>&1 &

          for i in {1..30}; do

            if curl -sf \
              http://127.0.0.1:11434/api/tags \
              >/dev/null; then

              echo "Ollama is ready."
              exit 0

            fi

            sleep 2

          done

          echo "::error::Ollama failed to start."

          if [[ -f ollama.log ]]; then
            cat ollama.log
          fi

          exit 1


      # ---------------------------------------------------------------------
      # Pull local model
      # ---------------------------------------------------------------------

      - name: Prepare Local AI Model
        id: model
        shell: bash
        run: |

          set -euo pipefail

          MODEL="qwen2.5-coder:1.5b"

          if ollama pull "$MODEL"; then

            echo "model=$MODEL" >> "$GITHUB_OUTPUT"

          else

            echo "::warning::qwen2.5-coder:1.5b unavailable."

            MODEL="qwen2.5-coder:7b"

            if ! ollama pull "$MODEL"; then
              echo "::error::Unable to pull fallback local model."
              exit 1
            fi

            echo "model=$MODEL" >> "$GITHUB_OUTPUT"

          fi


      # ---------------------------------------------------------------------
      # Verify repository state
      # ---------------------------------------------------------------------

      - name: Verify Clean Repository
        shell: bash
        run: |

          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Repository is not clean before AI repair."

            git status --short

            exit 1

          fi


      # ---------------------------------------------------------------------
      # Run AI repair
      # ---------------------------------------------------------------------

      - name: Execute AI Repair Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-pro"

          LOCAL_MODEL_URL: "http://127.0.0.1:11434/v1"
          LOCAL_MODEL_NAME: ${{ steps.model.outputs.model }}

          AI_REPAIR_BUILD_TIMEOUT: "900"
          AI_REPAIR_TEST_TIMEOUT: "600"

        shell: bash
        run: |

          set -euo pipefail

          python3 \
            scripts/ai_repair.py \
            --repo . \
            --log-file ci-failure-tail.log


      # ---------------------------------------------------------------------
      # Generate repair report
      # ---------------------------------------------------------------------

      - name: Generate Repair Report
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          {
            echo "### 🤖 VoidOne AI Repair"
            echo ""
            echo "AI-generated repair successfully passed:"
            echo ""
            echo "- 🛡️ Patch security validation"
            echo "- 🔧 CMake configuration"
            echo "- 🏗️ C++ build"
            echo "- 🧪 CTest"
            echo "- 🧠 Local AI review"
          } >> "$GITHUB_STEP_SUMMARY"


      # ---------------------------------------------------------------------
      # Create branch
      # ---------------------------------------------------------------------

      - name: Create AI Repair Branch
        if: success()
        id: branch
        shell: bash
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |

          set -euo pipefail

          BRANCH="ai-repair/${RUN_ID}"

          git config user.name \
            "VoidOne AI Engine"

          git config user.email \
            "ai-repair@voidone.internal"

          if git show-ref \
            --verify \
            --quiet \
            "refs/heads/$BRANCH"; then

            git branch -D "$BRANCH"

          fi

          git checkout -b "$BRANCH"

          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------------------
      # Commit
      # ---------------------------------------------------------------------

      - name: Commit AI Repair
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then

            echo "::warning::AI produced no repository changes."

            exit 1

          fi

          git add -A

          git commit \
            -m "fix: automated CI repair [ai-repair]"


      # ---------------------------------------------------------------------
      # Push branch
      # ---------------------------------------------------------------------

      - name: Push Repair Branch
        if: success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |

          set -euo pipefail

          git push \
            --force-with-lease \
            origin \
            "$BRANCH"


      # ---------------------------------------------------------------------
      # Create Draft PR
      # ---------------------------------------------------------------------

      - name: Create Draft Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          BRANCH: ${{ steps.branch.outputs.name }}

          RUN_ID: ${{ steps.target.outputs.run_id }}

          HEAD_SHA: ${{ steps.target.outputs.head_sha }}

        shell: bash
        run: |

          set -euo pipefail

          EXISTING_PR="$(
            gh pr list \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$EXISTING_PR" ]]; then

            echo "PR #$EXISTING_PR already exists."

            exit 0

          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title \
              "fix(ci): Autonomous AI repair for Run #${RUN_ID}" \
            --body \
              "## 🤖 VoidOne Autonomous AI Repair

          The VoidOne AI Repair Engine detected a CI failure and generated a candidate remediation.

          ### Target

          - **Workflow Run:** #${RUN_ID}
          - **Broken Commit:** \`${HEAD_SHA}\`
          - **Repair Branch:** \`${BRANCH}\`

          ### Validation

          - 🛡️ Patch security validation
          - 🔧 CMake configuration
          - 🏗️ Release build
          - 🧪 CTest
          - 🧠 Local Qwen review

          ### Review

          The repair was generated and validated automatically.

          Human review is required before merge.

          > VoidOne AI Repair Engine — Diagnose. Repair. Validate. Review."


      # ---------------------------------------------------------------------
      # Failure report
      # ---------------------------------------------------------------------

      - name: Repair Failure Report
        if: failure()
        shell: bash
        run: |

          {
            echo "### ❌ VoidOne AI Repair Failed"
            echo ""
            echo "The engine failed closed."
            echo ""
            echo "No automatic merge was performed."
          } >> "$GITHUB_STEP_SUMMARY"