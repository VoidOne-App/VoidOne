name: VoidOne AI Repair

on:
  workflow_run:
    workflows:
      - "VoidOne CI/CD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write

concurrency:
  group: voidone-ai-repair
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-3.1-pro-preview

jobs:
  repair:
    name: AI CI Repair

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # =====================================================
      # PYTHON DEPENDENCIES
      # =====================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir requests

          python - <<'PY'
          import requests
          print("requests:", requests.__version__)
          PY

      # =====================================================
      # COLLECT REAL CI LOG
      # =====================================================

      - name: Collect failed CI log
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > ci-failure.log || true

          if [ ! -s ci-failure.log ]; then
            echo "No failed log was returned." > ci-failure.log
          fi

          tail -n 1600 ci-failure.log > ci-failure-tail.log

          echo "========================================"
          echo "FAILED CI LOG"
          echo "========================================"

          cat ci-failure-tail.log

      # =====================================================
      # MANUAL RUN
      # =====================================================

      - name: Create manual diagnostic context
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat > ci-failure-tail.log <<'EOF'
          Manual AI repair run.

          No GitHub Actions failure log was supplied.

          The agent must inspect the repository and determine
          whether a safe repair can be identified.
          EOF

      # =====================================================
      # BUILD DEPENDENCIES
      # =====================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            ccache \
            clang \
            clang-tidy \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      # =====================================================
      # QT
      # =====================================================

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: voidone-qt

      # =====================================================
      # GIT IDENTITY
      # =====================================================

      - name: Configure Git
        run: |
          git config user.name "VoidOne AI Repair"
          git config user.email "voidone-ai-repair@users.noreply.github.com"

      # =====================================================
      # ISOLATED REPAIR BRANCH
      # =====================================================

      - name: Create repair branch
        id: branch
        run: |
          BRANCH="ai-repair/${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          echo "Repair branch:"
          echo "$BRANCH"

      # =====================================================
      # GEMINI AI REPAIR
      # =====================================================

      - name: Run Gemini repair agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: |
          python scripts/ai_repair.py

      # =====================================================
      # VERIFY AI CHANGES
      # =====================================================

      - name: Verify AI changes
        run: |
          echo "========================================"
          echo "AI GENERATED CHANGES"
          echo "========================================"

          git status --short

          if git diff --quiet; then
            echo "AI did not modify the repository."
            exit 1
          fi

          echo ""
          echo "Checking whitespace..."

          git diff --check

          echo ""
          echo "Change summary:"

          git diff --stat

      # =====================================================
      # RELEASE CONFIGURATION
      # =====================================================

      - name: Configure Release
        run: |
          cmake \
            -S . \
            -B build-ai-repair \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # =====================================================
      # RELEASE BUILD
      # =====================================================

      - name: Build Release
        run: |
          cmake \
            --build build-ai-repair \
            --parallel

      # =====================================================
      # TEST CONFIGURATION
      # =====================================================

      - name: Configure tests
        run: |
          if cmake -S . -B build-ai-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVOIDONE_BUILD_TESTS=ON; then

            echo "Test configuration succeeded."

          else

            echo "Test configuration failed."
            exit 1

          fi

      # =====================================================
      # TEST BUILD
      # =====================================================

      - name: Build tests
        run: |
          cmake \
            --build build-ai-tests \
            --parallel

      # =====================================================
      # RUN TESTS
      # =====================================================

      - name: Run tests
        run: |
          ctest \
            --test-dir build-ai-tests \
            --output-on-failure \
            --parallel 2

      # =====================================================
      # STATIC ANALYSIS
      # =====================================================

      - name: Configure clang-tidy
        run: |
          cmake \
            -S . \
            -B build-ai-analysis \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Run static analysis build
        run: |
          cmake \
            --build build-ai-analysis \
            --parallel

      # =====================================================
      # SANITIZERS
      # =====================================================

      - name: Configure sanitizer build
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          cmake \
            -S . \
            -B build-ai-sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build with sanitizers
        run: |
          cmake \
            --build build-ai-sanitize \
            --parallel

      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit repaired code
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "No changes are staged."
            exit 1
          fi

          git commit \
            -m "fix: AI repair CI failure [ai-repair]"

      # =====================================================
      # PUSH REPAIR BRANCH
      # =====================================================

      - name: Push repair branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      # =====================================================
      # CREATE DRAFT PR
      # =====================================================

      - name: Create Draft Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "fix: AI repair CI failure" \
            --body "$(cat <<'EOF'
          ## 🤖 VoidOne AI Repair

          Automatically generated repair for a failed CI run.

          ### Model

          Gemini 3.1 Pro Preview

          ### Validation

          - Real CI failure log analyzed
          - AI-generated minimal patch
          - Patch safety validation
          - CMake Release build
          - Unit tests
          - clang-tidy build
          - Sanitizer build
          - Final GitHub CI

          ### Safety

          - Never pushes directly to main
          - Uses an isolated repair branch
          - Human review is required
          - AI repair agent and GitHub workflows are protected

          **Please review the changes before merging.**
          EOF
          )")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Draft PR:"
          echo "$PR_URL"

      # =====================================================
      # WAIT FOR GITHUB CI
      # =====================================================

      - name: Wait for GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          echo "Waiting for GitHub CI..."

          for attempt in $(seq 1 30); do

            echo ""
            echo "========================================"
            echo "CI CHECK $attempt / 30"
            echo "========================================"

            if gh pr checks "$PR_URL" --watch --fail-fast; then
              echo ""
              echo "All GitHub checks passed."
              exit 0
            fi

            echo "Checks are not green yet."

            sleep 30

          done

          echo ""
          echo "GitHub CI did not become green."
          exit 1

      # =====================================================
      # READY FOR HUMAN REVIEW
      # =====================================================

      - name: Mark PR ready for review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr ready "$PR_URL"

          echo ""
          echo "========================================"
          echo "🤖 VOIDONE AI REPAIR PASSED"
          echo "========================================"
          echo ""
          echo "Release build       : PASS"
          echo "Tests                : PASS"
          echo "Static analysis      : PASS"
          echo "Sanitizer build      : PASS"
          echo "GitHub CI            : PASS"
          echo ""
          echo "PR is ready for human review."
