name: VoidOne Autonomous AI CI Repair

on:
  workflow_run:
    workflows: ['VoidOne CI/CD']
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed VoidOne CI/CD run ID (optional)
        required: false
        type: string
      force_repair:
        description: Run against the latest run even when it was successful
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: voidone-ai-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    name: Diagnose / Repair / Validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_WORKFLOW: VoidOne CI/CD
      AI_REPAIR_MAX_ATTEMPTS: '2'
      AI_REPAIR_TEMP_DIR: ${{ runner.temp }}/voidone-ai-repair
      GEMINI_MODEL: gemini-2.5-pro
      GEMINI_REVIEW_MODEL: gemini-2.5-pro
    steps:
      - name: Resolve target run
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          FORCE_REPAIR: ${{ inputs.force_repair }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${EVENT_RUN_ID:-}"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ -n "$INPUT_RUN_ID" ]]; then
              run_id="$INPUT_RUN_ID"
            elif [[ "$FORCE_REPAIR" == 'true' ]]; then
              run_id="$(gh run list --workflow "$TARGET_WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId')"
            else
              run_id="$(gh run list --workflow "$TARGET_WORKFLOW" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')"
            fi
          fi
          [[ -n "$run_id" && "$run_id" != 'null' ]] || { echo '::error::No target CI run found'; exit 1; }
          info="$(gh run view "$run_id" --json workflowName,conclusion,headBranch,headSha)"
          workflow="$(jq -r .workflowName <<< "$info")"
          conclusion="$(jq -r .conclusion <<< "$info")"
          branch="$(jq -r .headBranch <<< "$info")"
          sha="$(jq -r .headSha <<< "$info")"
          [[ "$workflow" == "$TARGET_WORKFLOW" ]] || { echo '::error::Wrong workflow'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            [[ "$conclusion" == 'failure' && "$branch" == 'main' ]] || { echo '::error::Automatic repair target rejected'; exit 1; }
          elif [[ "$FORCE_REPAIR" != 'true' ]]; then
            [[ "$conclusion" == 'failure' ]] || { echo '::error::Selected run is not failed'; exit 1; }
            [[ "$branch" == 'main' ]] || { echo '::error::Selected run is not on main'; exit 1; }
          fi
          printf 'run_id=%s\nsha=%s\nbranch=%s\n' "$run_id" "$sha" "$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Download CI failure log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AI_REPAIR_TEMP_DIR"
          gh run view "$RUN_ID" --log-failed > "$AI_REPAIR_TEMP_DIR/ci-failure.log"
          test -s "$AI_REPAIR_TEMP_DIR/ci-failure.log"
          tail -n 5000 "$AI_REPAIR_TEMP_DIR/ci-failure.log" > "$AI_REPAIR_TEMP_DIR/ci-failure-tail.log"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install AI runtime
        run: python -m pip install --upgrade pip requests
      - name: Run modular AI repair engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai/dispatcher.py \
            --repo . \
            --log-file "$AI_REPAIR_TEMP_DIR/ci-failure-tail.log"
      - name: Inspect candidate
        if: always()
        shell: bash
        run: |
          git status --short || true
          git diff --stat || true
      - name: Validate final candidate state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git diff --check
      - name: Create repair branch
        if: success()
        id: branch
        shell: bash
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          set -euo pipefail
          branch="ai-repair/${RUN_ID}-${GITHUB_RUN_ID}"
          git config user.name 'VoidOne AI Repair Engine'
          git config user.email 'ai-repair@voidone.invalid'
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Commit repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'fix(ci): autonomous workflow and package repair'
      - name: Push repair branch
        if: success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --set-upstream origin "$BRANCH"
      - name: Open draft PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then exit 0; fi
          gh pr create --base main --head "$BRANCH" --draft \
            --title "fix(ci): autonomous repair for Run #${RUN_ID}" \
            --body "## VoidOne Autonomous CI Repair\n\nTarget run: #${RUN_ID}\nBroken commit: ${SHA}\n\nThe candidate was generated, policy-checked, applied, workflow/package contracts validated, CMake-configured, independently reviewed, and left as a draft PR. No automatic merge is performed."
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidone-ai-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/voidone-ai-repair/
          if-no-files-found: ignore
          retention-days: 14
