name: VoidOne Autonomous AI CI Repair Engine

on:
  workflow_run:
    workflows: ["Voidone CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "GitHub Actions run ID to repair"
        required: false
        type: string
      force_repair:
        description: "Allow repair of a successful run"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: voidone-ai-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  TARGET_WORKFLOW: "Voidone CI/CD"
  AI_REPAIR_REPORT_DIR: ${{ runner.temp }}/voidone-ai-repair

jobs:
  ai-repair:
    name: Autonomous AI Repair
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Initialize isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$AI_REPAIR_REPORT_DIR"
          mkdir -p "$AI_REPAIR_REPORT_DIR"

      - name: Resolve target run
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          INPUT_FORCE_REPAIR: ${{ inputs.force_repair }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$EVENT_RUN_ID"; HEAD_SHA="$EVENT_SHA"; BRANCH="$EVENT_BRANCH"; WORKFLOW="$EVENT_WORKFLOW"; CONCLUSION="$EVENT_CONCLUSION"
          else
            if [[ -n "$INPUT_RUN_ID" ]]; then
              RUN_ID="$INPUT_RUN_ID"
            elif [[ "$INPUT_FORCE_REPAIR" == "true" ]]; then
              RUN_ID="$(gh run list --workflow "$TARGET_WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId')"
            else
              RUN_ID="$(gh run list --workflow "$TARGET_WORKFLOW" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')"
            fi
            [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]] || { echo "::error::No target run found"; exit 1; }
            INFO="$(gh run view "$RUN_ID" --json workflowName,conclusion,headBranch,headSha)"
            WORKFLOW="$(jq -r '.workflowName' <<< "$INFO")"; CONCLUSION="$(jq -r '.conclusion' <<< "$INFO")"; BRANCH="$(jq -r '.headBranch' <<< "$INFO")"; HEAD_SHA="$(jq -r '.headSha' <<< "$INFO")"
          fi
          [[ "$WORKFLOW" == "$TARGET_WORKFLOW" ]] || { echo "::error::Unexpected workflow: $WORKFLOW"; exit 1; }
          [[ -n "$HEAD_SHA" && "$HEAD_SHA" != "null" ]] || { echo "::error::Invalid target SHA"; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_run" || "$INPUT_FORCE_REPAIR" != "true" ]]; then
            [[ "$CONCLUSION" == "failure" ]] || { echo "::error::Target run is not failed"; exit 1; }
            [[ "$BRANCH" == "main" ]] || { echo "::error::Target run is not from main"; exit 1; }
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout exact failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Assert clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { git status --short; exit 1; }

      - name: Capture target CI logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > "$AI_REPAIR_REPORT_DIR/ci-failure.log"
          [[ -s "$AI_REPAIR_REPORT_DIR/ci-failure.log" ]] || { echo "::error::Target CI log is empty"; exit 1; }
          tail -n 5000 "$AI_REPAIR_REPORT_DIR/ci-failure.log" > "$AI_REPAIR_REPORT_DIR/ci-failure-tail.log"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install AI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-ai-repair.txt

      - name: Install local AI reviewer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "$AI_REPAIR_REPORT_DIR/ollama.log" 2>&1 &
          echo "$!" > "$AI_REPAIR_REPORT_DIR/ollama.pid"
          for _ in {1..45}; do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && exit 0; sleep 2; done
          cat "$AI_REPAIR_REPORT_DIR/ollama.log" || true
          exit 1

      - name: Prepare reviewer model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          if ollama pull qwen2.5-coder:1.5b; then MODEL=qwen2.5-coder:1.5b; else ollama pull qwen2.5-coder:7b; MODEL=qwen2.5-coder:7b; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Static-check modular AI engine
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ai/*.py scripts/validation/*.py scripts/reporting/*.py

      - name: Run modular AI repair engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-pro"
          GEMINI_REVIEW_MODEL: "gemini-2.5-pro"
          LOCAL_MODEL_URL: "http://127.0.0.1:11434/v1"
          LOCAL_MODEL_NAME: ${{ steps.model.outputs.model }}
          AI_REPAIR_REPORT_DIR: ${{ runner.temp }}/voidone-ai-repair
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ai.dispatcher \
            --repo . \
            --log-file "$AI_REPAIR_REPORT_DIR/ci-failure-tail.log"

      - name: Verify candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          [[ -n "$(git status --porcelain --untracked-files=all)" ]] || { echo "::error::No candidate changes"; exit 1; }
          if git status --porcelain | grep -Eq '(^| )(.github/workflows/ai-repair\.yml|\.ai/|scripts/ai/|scripts/validation/|scripts/reporting/)'; then
            echo "::error::Protected AI infrastructure was modified"; exit 1
          fi

      - name: Create candidate branch
        id: branch
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="ai-repair/${RUN_ID}-${GITHUB_RUN_ID}"
          git config user.name "VoidOne AI Engine"
          git config user.email "ai-repair@voidone.internal"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): automated candidate repair [ai-repair]"

      - name: Push candidate branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: git push --set-upstream origin "$BRANCH"

      - name: Create draft pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          NUMBER="$(gh pr create --base main --head "$BRANCH" --draft --title "fix(ci): autonomous repair for Run #${RUN_ID}" --body "## VoidOne Autonomous CI Repair\n\nCandidate generated from failed Run #${RUN_ID}.\n\nThe modular engine performed policy validation and independent review. The authoritative Windows/Qt/MSVC CI remains the final validation gate.\n\nNo automatic merge is performed.")"
          echo "number=${NUMBER##*/}" >> "$GITHUB_OUTPUT"

      - name: Wait for authoritative VoidOne CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          RUN=""
          for _ in {1..60}; do
            RUN="$(gh run list --workflow "$TARGET_WORKFLOW" --branch "$BRANCH" --limit 1 --json databaseId,status --jq '.[0] | select(.status != "queued") | .databaseId' || true)"
            [[ -n "$RUN" ]] && break
            sleep 10
          done
          [[ -n "$RUN" ]] || { echo "::error::Timed out waiting for candidate CI"; exit 1; }
          gh run watch "$RUN" --exit-status

      - name: Mark PR ready after authoritative CI
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr ready "$PR"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidone-ai-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/voidone-ai-repair/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Ollama
        if: always()
        shell: bash
        run: |
          set +e
          [[ -f "$AI_REPAIR_REPORT_DIR/ollama.pid" ]] && kill "$(cat "$AI_REPAIR_REPORT_DIR/ollama.pid")" 2>/dev/null || true
