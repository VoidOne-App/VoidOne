name: VoidOne Autonomous AI CI Repair Engine

on:
  workflow_run:
    workflows: ["VoidOne CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Target Failed Workflow Run ID (Leave empty to test current commit)"
        required: false
        type: string

jobs:
  ai-repair:
    name: Execute AI Repair Loop
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Resolve Target Commit SHA
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.failed_run_id }}" ]; then
              RUN_ID="${{ inputs.failed_run_id }}"
              HEAD_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
            else
              RUN_ID="${{ github.run_id }}"
              HEAD_SHA="${{ github.sha }}"
            fi
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Exact Broken Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Install C++/Qt6 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-tidy \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-ai-repair.txt ]; then
            python -m pip install -r scripts/requirements-ai-repair.txt
          else
            python -m pip install google-genai requests
          fi

      - name: Setup Local Model via Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          # استفاده از مدل سبک‌تر برای جلوگیری از OOM و کندی روی CPU رانر
          ollama pull qwen2.5-coder:1.5b || ollama pull qwen2.5-coder:7b

      - name: Fetch CI Failure Logs
        run: |
          gh run view "$RUN_ID" --log-failed > ci-failure.log || echo "Failed to fetch logs" > ci-failure.log
          tail -n 1000 ci-failure.log > ci-failure-tail.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run AI Repair Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-pro"
          LOCAL_MODEL_URL: "http://127.0.0.1:11434/v1"
          LOCAL_MODEL_NAME: "qwen2.5-coder:1.5b"
        run: |
          python3 scripts/ai_repair.py --log-file ci-failure-tail.log

      - name: Push Branch and Open Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # بررسی اینکه آیا تغییراتی توسط هوش مصنوعی ایجاد شده است یا خیر
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes were made by the AI Repair Engine. Skipping PR creation."
            exit 0
          fi

          REPAIR_BRANCH="ai-repair/${{ env.RUN_ID }}"
          git config user.name "VoidOne AI Engine"
          git config user.email "ai-repair@voidone.internal"
          
          git checkout -b "$REPAIR_BRANCH"
          git add -A
          git commit -m "fix: resolve VoidOne CI build failure [ai-repair]"
          git push origin "$REPAIR_BRANCH" --force

          # ایجاد PR در صورت عدم وجود PR قبلی
          if ! gh pr view "$REPAIR_BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$REPAIR_BRANCH" \
              --title "fix(ci): Automated AI Repair for Run #${{ env.RUN_ID }}" \
              --body "## 🤖 VoidOne Autonomous Repair Engine Report

            The AI Repair Engine has analyzed the build failure and applied auto-remediation.
            - **Lead Engineer**: Gemini 2.5 Pro
            - **Code Reviewer**: Qwen2.5-Coder (Local)
            - **Validation**: Passed Local C++/Qt6 Inspection" \
              --draft
          else
            echo "PR already exists for branch $REPAIR_BRANCH."
          fi
