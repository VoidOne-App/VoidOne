name: VoidOne AI Repair

on:
  workflow_run:
    workflows: ["VoidOne CI/CD"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: voidone-ai-repair
  cancel-in-progress: true

jobs:
  repair:
    name: AI Build Repair
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Collect failed CI log
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > ci-failure.log || true

          if [ ! -s ci-failure.log ]; then
            echo "No failed log was returned." > ci-failure.log
          fi

          tail -n 1200 ci-failure.log > ci-failure-tail.log

      - name: Create manual diagnostic context
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual AI repair run." > ci-failure-tail.log

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: voidone-qt

      - name: Run AI repair agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python3 scripts/ai_repair.py

      - name: Verify repaired project
        run: |
          cmake \
            -S . \
            -B build-ai-repair \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build build-ai-repair \
            --parallel

      - name: Commit repaired code
        if: success()
        run: |
          git config user.name "VoidOne AI Repair"
          git config user.email "voidone-ai-repair@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No changes were made."
            exit 0
          fi

          git commit -m "fix: AI repair CI failure [ai-repair]"
          git push origin HEAD:main
