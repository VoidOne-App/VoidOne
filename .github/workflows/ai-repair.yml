name: VoidOne AI Repair

on:
  workflow_run:
    workflows: ["VoidOne CI/CD"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write
  checks: read

concurrency:
  group: voidone-ai-repair
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-3.1-pro-preview
  MAX_REPAIR_ATTEMPTS: "3"

jobs:
  repair:
    name: AI CI Repair

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # =====================================================
      # COLLECT FAILED CI LOG
      # =====================================================

      - name: Collect failed CI log
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > ci-failure.log || true

          if [ ! -s ci-failure.log ]; then
            echo "No failed log was returned." > ci-failure.log
          fi

          tail -n 1600 ci-failure.log > ci-failure-tail.log

          echo "========================================"
          echo "FAILED CI LOG"
          echo "========================================"

          cat ci-failure-tail.log

      # =====================================================
      # MANUAL RUN
      # =====================================================

      - name: Create manual diagnostic context
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual AI repair run." > ci-failure-tail.log

      # =====================================================
      # LINUX BUILD DEPENDENCIES
      # =====================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            ccache \
            clang \
            clang-tidy \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      # =====================================================
      # QT
      # =====================================================

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: voidone-qt

      # =====================================================
      # GIT
      # =====================================================

      - name: Configure Git
        run: |
          git config user.name "VoidOne AI Repair"
          git config user.email "voidone-ai-repair@users.noreply.github.com"

      # =====================================================
      # CREATE ISOLATED BRANCH
      # =====================================================

      - name: Create repair branch
        id: branch
        run: |
          BRANCH="ai-repair/${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # =====================================================
      # GEMINI AI REPAIR
      # =====================================================

      - name: Run Gemini repair agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: |
          python scripts/ai_repair.py

      # =====================================================
      # VALIDATE AI CHANGES
      # =====================================================

      - name: Validate AI changes
        run: |
          if git diff --quiet; then
            echo "AI did not modify the repository."
            exit 1
          fi

          echo "Checking patch..."

          git diff --check

          echo ""
          echo "========================================"
          echo "AI CHANGES"
          echo "========================================"

          git diff --stat

          echo ""
          git diff --cached --stat || true

      # =====================================================
      # CMAKE RELEASE CONFIGURATION
      # =====================================================

      - name: Configure Release
        run: |
          cmake \
            -S . \
            -B build-ai-repair \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # =====================================================
      # RELEASE BUILD
      # =====================================================

      - name: Build Release
        run: |
          cmake \
            --build build-ai-repair \
            --parallel

      # =====================================================
      # TESTS
      # =====================================================

      - name: Run tests
        run: |
          if [ -d "tests" ]; then

            ctest \
              --test-dir build-ai-repair \
              --output-on-failure \
              --parallel 2

          else

            echo "No tests directory found."
            echo "Skipping explicit test execution."

          fi

      # =====================================================
      # STATIC ANALYSIS
      # =====================================================

      - name: Configure static analysis
        run: |
          cmake \
            -S . \
            -B build-ai-analysis \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Run static analysis build
        run: |
          cmake \
            --build build-ai-analysis \
            --parallel

      # =====================================================
      # SANITIZER BUILD
      # =====================================================

      - name: Configure sanitizer build
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          cmake \
            -S . \
            -B build-ai-sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build with sanitizers
        run: |
          cmake \
            --build build-ai-sanitize \
            --parallel

      # =====================================================
      # COMMIT REPAIR
      # =====================================================

      - name: Commit repaired code
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "No changes were made."
            exit 1
          fi

          git commit \
            -m "fix: AI repair CI failure [ai-repair]"

      # =====================================================
      # PUSH REPAIR BRANCH
      # NEVER PUSH MAIN
      # =====================================================

      - name: Push repair branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      # =====================================================
      # CREATE DRAFT PULL REQUEST
      # =====================================================

      - name: Create Draft Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "fix: AI repair CI failure" \
            --body "$(cat <<'EOF'
          ## 🤖 VoidOne AI Repair

          This Pull Request was automatically generated by the
          VoidOne AI Repair Agent.

          ### AI Model

          Gemini 3.1 Pro Preview

          ### Validation performed

          - Real GitHub Actions failure log analyzed
          - Minimal AI-generated patch
          - Git diff validation
          - CMake Release configuration
          - Release build
          - Unit tests when available
          - clang-tidy/static analysis
          - AddressSanitizer/UndefinedBehaviorSanitizer build

          ### Safety

          - No direct push to main
          - Repair is isolated in a dedicated branch
          - Human review is required before merging

          **DO NOT MERGE WITHOUT REVIEW.**
          EOF
          )")

          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "DRAFT PR CREATED"
          echo "========================================"
          echo "$PR_URL"

      # =====================================================
      # WAIT FOR REAL GITHUB CI
      # =====================================================

      - name: Wait for GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.PR_URL }}
        run: |
          echo "Waiting for GitHub CI..."

          for i in $(seq 1 30); do

            echo ""
            echo "Checking CI..."
            echo "Attempt $i / 30"

            if gh pr checks "$PR_URL" --watch --fail-fast; then

              echo ""
              echo "========================================"
              echo "ALL GITHUB CHECKS PASSED"
              echo "========================================"

              exit 0

            fi

            sleep 30

          done

          echo ""
          echo "GitHub CI did not become green."

          exit 1

      # =====================================================
      # MARK PR READY
      # =====================================================

      - name: Mark PR ready for review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.PR_URL }}
        run: |
          gh pr ready "$PR_URL"

          echo ""
          echo "========================================"
          echo "🤖 VOIDONE AI REPAIR SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "The repair passed:"
          echo "  ✓ AI patch validation"
          echo "  ✓ Release build"
          echo "  ✓ Tests"
          echo "  ✓ Static analysis"
          echo "  ✓ Sanitizer build"
          echo "  ✓ GitHub CI"
          echo ""
          echo "PR is ready for human review."