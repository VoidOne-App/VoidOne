  qml:
    name: QML Integrity QA
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan QML
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files =
            Get-ChildItem `
              src\ui\qml `
              -Recurse `
              -Filter *.qml

          if (-not $files) {
            throw "No QML files found."
          }

          foreach ($file in $files) {

            $text =
              Get-Content `
                $file.FullName `
                -Raw

            if ([string]::IsNullOrWhiteSpace($text)) {
              throw "Empty QML file: $($file.FullName)"
            }

            $opens =
              ([regex]::Matches(
                $text,
                "\{"
              )).Count

            $closes =
              ([regex]::Matches(
                $text,
                "\}"
              )).Count

            if ($opens -ne $closes) {
              throw `
                "Unbalanced braces in $($file.FullName): $opens vs $closes"
            }
          }

