name: VoidOne Full System QA - Torture Lab

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.2'
  QT_ARCH: win64_msvc2022_64
  CMAKE_VERSION: '4.4.3'
  BUILD_TYPE: Release

jobs:
  discover:
    name: System Discovery
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Collect runner inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force qa\artifacts | Out-Null
          systeminfo | Out-File qa\artifacts\systeminfo.txt -Encoding utf8
          Get-ComputerInfo | Out-File qa\artifacts\computerinfo.txt -Encoding utf8
          Get-CimInstance Win32_Processor | Format-List * | Out-File qa\artifacts\cpu.txt -Encoding utf8
          Get-CimInstance Win32_PhysicalMemory | Format-List * | Out-File qa\artifacts\ram.txt -Encoding utf8
          Get-CimInstance Win32_VideoController | Format-List * | Out-File qa\artifacts\gpu.txt -Encoding utf8
          Get-CimInstance Win32_LogicalDisk | Format-List * | Out-File qa\artifacts\disks.txt -Encoding utf8
          dxdiag /t "$PWD\qa\artifacts\dxdiag.txt"
      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: system-discovery-${{ github.run_id }}
          path: qa/artifacts
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build + Unit/DB Tests + Canonical Package
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Visual Studio 2026 Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://aka.ms/vs/stable/vs_buildtools.exe' -OutFile $installer
          $args = @('--quiet','--wait','--norestart','--nocache','--add','Microsoft.VisualStudio.Workload.VCTools','--includeRecommended')
          $p = Start-Process $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "Visual Studio installation failed: $($p.ExitCode)" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw 'MSVC installation was not found.' }
          "VOIDONE_VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsDevCmd = Join-Path $env:VOIDONE_VS_PATH 'Common7\Tools\VsDevCmd.bat'
          $output = & cmd.exe /d /s /c "`"$vsDevCmd`" -arch=amd64 && set" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed: $LASTEXITCODE" }
          foreach ($line in $output) {
            $text = [string]$line
            $i = $text.IndexOf('=')
            if ($i -le 0) { continue }
            $name = $text.Substring(0,$i)
            if ($name -in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCToolsVersion','VCToolsRedistDir','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion','VSCMD_ARG_TGT_ARCH')) {
              "$name=$($text.Substring($i + 1))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $pathLine = $output | Where-Object { $_ -like 'PATH=*' } | Select-Object -First 1
          if ($pathLine) { ($pathLine -replace '^PATH=','') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Verify MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cl = (& cl 2>&1) -join "`n"
          $cl | Write-Host
          if ($cl -notmatch 'Version 19\.51\.') { throw "Expected MSVC 14.51 / compiler 19.51.x, found: $cl" }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'MSVC target architecture is not x64.' }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'

      - name: Install exact CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CMAKE_VERSION
          $archive = "cmake-$version-windows-x86_64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Kitware/CMake/releases/download/v$version/$archive" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "cmake-$version-windows-x86_64\bin"
          if (-not (Test-Path "$bin\cmake.exe")) { throw 'Pinned CMake installation failed.' }
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = (cmake --version | Out-String)
          if ($cmake -notmatch '4\.4\.3') { throw "Expected CMake 4.4.3, found: $cmake" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOIDONE_BUILD_TESTS=ON -DVOIDONE_GENERATE_INSTALLER=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Deploy Qt runtime for tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = Get-ChildItem build -Recurse -Filter 'voidone_*_tests.exe' -File | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' }
          if (-not $tests) { throw 'No test executables were produced.' }
          foreach ($test in $tests) {
            windeployqt --release --no-translations --no-compiler-runtime $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $($test.Name)." }
          }

      - name: Run CTest / database QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_PLUGIN_PATH = "$env:GITHUB_WORKSPACE\build;$env:QT_ROOT_DIR\plugins"
          ctest --test-dir build -C Release --output-on-failure --timeout 300 --verbose
          if ($LASTEXITCODE -ne 0) { throw "CTest failed: $LASTEXITCODE" }

      - name: Stage canonical runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item qa\package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force qa\package | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter VoidOne.exe -File | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Select-Object -First 1
          if (-not $exe) { throw 'VoidOne.exe was not produced.' }
          Copy-Item $exe.FullName qa\package\VoidOne.exe
          $qml = Join-Path $env:GITHUB_WORKSPACE 'src\ui\qml'
          if (Test-Path $qml) { windeployqt --release --compiler-runtime --no-translations --qmldir $qml qa\package\VoidOne.exe }
          else { windeployqt --release --compiler-runtime --no-translations qa\package\VoidOne.exe }
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed for canonical runtime.' }

      - name: Force bundle x64 VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-ChildItem $env:VCToolsRedistDir -Recurse -Filter msvcp140.dll -File |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC[^\\]*\.CRT\\msvcp140\.dll$' } |
            Select-Object -First 1
          if (-not $runtime) { throw "Could not locate x64 VC++ runtime under $env:VCToolsRedistDir" }
          Get-ChildItem $runtime.Directory.FullName -Filter '*.dll' -File | ForEach-Object { Copy-Item $_.FullName qa\package\ -Force }

      - name: Validate canonical runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('VoidOne.exe','Qt6Core.dll','Qt6Gui.dll','Qt6Qml.dll','Qt6Quick.dll','platforms\qwindows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            if (-not (Test-Path "qa\package\$file" -PathType Leaf)) { throw "Missing runtime file: $file" }
          }
          Get-ChildItem qa\package -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 | Export-Csv qa\package\SHA256SUMS.csv -NoTypeInformation

      - name: Upload canonical runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
          if-no-files-found: error
          retention-days: 14

  filesystem:
    name: Filesystem QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Exercise paths and file operations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'VoidOne-FS-QA'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          1..500 | ForEach-Object { "VoidOne test $_" | Set-Content "$root\file-$_.txt" -Encoding utf8 }
          $unicode = Join-Path $root 'فارسی-日本語-中文-한국어'
          New-Item -ItemType Directory -Force $unicode | Out-Null
          'Unicode' | Set-Content "$unicode\تست.txt" -Encoding utf8
          $deep = $root
          1..25 | ForEach-Object { $deep = Join-Path $deep "level-$($_)"; New-Item -ItemType Directory -Force $deep | Out-Null }
          'Deep path' | Set-Content "$deep\deep.txt" -Encoding utf8
          Copy-Item $root "$root-copy" -Recurse
          if (-not (Test-Path "$root-copy\file-500.txt")) { throw 'Recursive copy failed.' }
          Move-Item "$root-copy\file-500.txt" "$root-copy\moved.txt"
          Remove-Item "$root-copy\moved.txt" -Force
          if (Test-Path "$root-copy\moved.txt") { throw 'Delete failed.' }
          Remove-Item $root,"$root-copy" -Recurse -Force

  stress:
    name: CPU + Memory Stress
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: CPU stress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobs = 1..8 | ForEach-Object { Start-Job { $x=0; for ($j=0; $j -lt 3000000; $j++) { $x=(($x+$j)*17)%1000003 }; $x } }
          Wait-Job $jobs | Out-Null
          if ($jobs.State -contains 'Failed') { throw 'CPU stress worker failed.' }
          Receive-Job $jobs | Out-Null
          Remove-Job $jobs -Force
      - name: Memory integrity stress
        shell: pwsh
        run: |
          $buffers = New-Object System.Collections.Generic.List[byte[]]
          try {
            1..64 | ForEach-Object { $b=New-Object byte[] (1MB); $b[0]=0x55; $b[$b.Length-1]=0xAA; $buffers.Add($b) }
            foreach ($b in $buffers) { if ($b[0] -ne 0x55 -or $b[$b.Length-1] -ne 0xAA) { throw 'Memory integrity check failed.' } }
          } finally { $buffers.Clear(); [GC]::Collect(); [GC]::WaitForPendingFinalizers() }

  runtime:
    name: Startup / Crash Diagnostics
    needs: build
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Repeated isolated startup
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: '1'
          QT_DEBUG_PLUGINS: '1'
          QML_IMPORT_TRACE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:GITHUB_WORKSPACE\qa\package\VoidOne.exe"
          New-Item -ItemType Directory -Force qa\artifacts | Out-Null
          1..10 | ForEach-Object {
            $n = $_
            $root = Join-Path $env:RUNNER_TEMP "VoidOne-Startup-$n"
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$root\Roaming","$root\Local" | Out-Null
            $e = @{ APPDATA="$root\Roaming"; LOCALAPPDATA="$root\Local"; QT_LOGGING_TO_CONSOLE='1'; QT_DEBUG_PLUGINS='1'; QML_IMPORT_TRACE='1' }
            $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru -Environment $e
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) {
              $crash = Join-Path $env:TEMP 'VoidOne-crash.log'
              if (Test-Path $crash) { Copy-Item $crash "qa\artifacts\crash-$n.log" -Force }
              throw "Startup iteration $n exited early with code $($p.ExitCode)."
            }
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $p.Id -Timeout 5 -ErrorAction SilentlyContinue
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: startup-diagnostics-${{ github.run_id }}
          path: qa/artifacts
          if-no-files-found: warn
          retention-days: 30

  graphics:
    name: Qt Quick Backend QA (${{ matrix.backend }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [default, software, d3d11, opengl]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Set graphics backend
        shell: pwsh
        run: |
          switch ('${{ matrix.backend }}') {
            'software' { 'QT_QUICK_BACKEND=software' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
            'd3d11' { 'QSG_RHI_BACKEND=d3d11' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
            'opengl' { 'QSG_RHI_BACKEND=opengl' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
            default { Write-Host 'Using default Qt Quick RHI backend.' }
          }
      - name: Startup backend
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: '1'
          QT_DEBUG_PLUGINS: '1'
          QML_IMPORT_TRACE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "VoidOne-Gfx-${{ matrix.backend }}"
          New-Item -ItemType Directory -Force "$root\Roaming","$root\Local" | Out-Null
          $e = @{ APPDATA="$root\Roaming"; LOCALAPPDATA="$root\Local"; QT_LOGGING_TO_CONSOLE='1'; QT_DEBUG_PLUGINS='1'; QML_IMPORT_TRACE='1' }
          $p = Start-Process "$env:GITHUB_WORKSPACE\qa\package\VoidOne.exe" -WorkingDirectory "$env:GITHUB_WORKSPACE\qa\package" -PassThru -Environment $e
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "Graphics backend '${{ matrix.backend }}' failed startup with code $($p.ExitCode)." }
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue

  package:
    name: Package Integrity QA
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Validate canonical package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('VoidOne.exe','Qt6Core.dll','Qt6Gui.dll','Qt6Qml.dll','Qt6Quick.dll','platforms\qwindows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','SHA256SUMS.csv')) {
            if (-not (Test-Path "qa\package\$file" -PathType Leaf)) { throw "Missing package file: $file" }
          }
          $zip = Join-Path $env:RUNNER_TEMP 'VoidOne-Portable-QA.zip'
          Compress-Archive -Path qa\package\* -DestinationPath $zip -CompressionLevel Optimal -Force
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\VoidOne-Portable-QA" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\VoidOne-Portable-QA\VoidOne.exe")) { throw 'Portable archive round-trip failed.' }

  qa-gate:
    name: QA Gate
    needs: [discover, build, filesystem, stress, runtime, graphics, package]
    if: always()
    runs-on: windows-2025
    steps:
      - name: Enforce required QA jobs
        shell: pwsh
        run: |
          $results = @{
            discover='${{ needs.discover.result }}'
            build='${{ needs.build.result }}'
            filesystem='${{ needs.filesystem.result }}'
            stress='${{ needs.stress.result }}'
            runtime='${{ needs.runtime.result }}'
            graphics='${{ needs.graphics.result }}'
            package='${{ needs.package.result }}'
          }
          $results.GetEnumerator() | Sort-Object Name | ForEach-Object { Write-Host ("{0}: {1}" -f $_.Key,$_.Value) }
          $failed = $results.GetEnumerator() | Where-Object { $_.Value -ne 'success' }
          if ($failed) { throw ("QA gate failed: " + (($failed | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', ')) }
          Write-Host 'VoidOne Full System QA gate passed.'
