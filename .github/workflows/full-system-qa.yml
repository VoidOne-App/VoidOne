name: VoidOne Full System QA - Torture Lab

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: VoidOne
  QT_VERSION: "6.11.2"
  QT_ARCH: win64_msvc2022_64

jobs:
  discover:
    name: System Discovery
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Create QA workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\qa\artifacts" | Out-Null
      - name: Inventory hardware and OS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          systeminfo | Out-File qa\artifacts\systeminfo.txt -Encoding utf8
          Get-ComputerInfo | Out-File qa\artifacts\computerinfo.txt -Encoding utf8
          Get-CimInstance Win32_Processor | Format-List * | Out-File qa\artifacts\cpu.txt -Encoding utf8
          Get-CimInstance Win32_PhysicalMemory | Format-List * | Out-File qa\artifacts\ram.txt -Encoding utf8
          Get-CimInstance Win32_DiskDrive | Format-List * | Out-File qa\artifacts\disks.txt -Encoding utf8
          Get-CimInstance Win32_LogicalDisk | Format-List * | Out-File qa\artifacts\logical-disks.txt -Encoding utf8
          Get-CimInstance Win32_VideoController | Format-List * | Out-File qa\artifacts\gpu.txt -Encoding utf8
          Get-CimInstance Win32_NetworkAdapter | Format-List * | Out-File qa\artifacts\network.txt -Encoding utf8
          Get-CimInstance Win32_SoundDevice | Format-List * | Out-File qa\artifacts\audio.txt -Encoding utf8
          Get-CimInstance Win32_PnPEntity | Format-List Name,Status,PNPDeviceID | Out-File qa\artifacts\devices.txt -Encoding utf8
          dxdiag /t "$PWD\qa\artifacts\dxdiag.txt"
      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: system-discovery-${{ github.run_id }}
          path: qa/artifacts
          retention-days: 14

  build:
    name: Build VoidOne
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\vs_buildtools.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/stable/vs_buildtools.exe" -OutFile $installer
          $args = @("--quiet","--wait","--norestart","--nocache","--add","Microsoft.VisualStudio.Workload.VCTools","--includeRecommended")
          $p = Start-Process $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "Visual Studio installation failed: $($p.ExitCode)" }

      - name: Initialize MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) { throw "MSVC installation was not found." }
          $vsDevCmd = Join-Path $installPath.Trim() "Common7\Tools\VsDevCmd.bat"
          $output = & cmd.exe /d /s /c "`"$vsDevCmd`" -arch=amd64 && set"
          foreach ($line in $output) {
            if ($line -match "^([^=]+)=(.*)$") {
              $name = $matches[1]; $value = $matches[2]
              if ($name -in @("PATH","INCLUDE","LIB","LIBPATH","VCToolsInstallDir","VCToolsVersion","VCToolsRedistDir","WindowsSdkDir","WindowsSDKVersion","UniversalCRTSdkDir")) {
                "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }
          cl 2>&1 | Select-Object -First 2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git"

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          ninja --version
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "MSVC cl.exe is unavailable." }
          if (-not $env:Qt6_DIR -and -not $env:QT_ROOT_DIR) { Write-Warning "Qt environment variable is not exposed; install-qt-action still controls CMake discovery." }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOIDONE_BUILD_TESTS=ON -DVOIDONE_GENERATE_INSTALLER=OFF

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel

      - name: CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build -C Release --output-on-failure --timeout 300 --verbose

      - name: Stage application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item qa\package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force qa\package | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter VoidOne.exe -File | Where-Object { $_.FullName -notmatch "\\CMakeFiles\\" } | Select-Object -First 1
          if (-not $exe) { throw "VoidOne.exe was not produced." }
          Copy-Item $exe.FullName qa\package\VoidOne.exe
          windeployqt --release --compiler-runtime --no-translations --qmldir src\ui\qml qa\package\VoidOne.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed." }

      - name: Force bundle VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:GITHUB_WORKSPACE "qa\package"
          $required = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          $roots = @()
          if ($env:VCToolsRedistDir) { $roots += $env:VCToolsRedistDir }
          $roots += @("$env:ProgramFiles\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio")
          foreach ($dll in $required) {
            $found = $null
            foreach ($root in ($roots | Where-Object { $_ -and (Test-Path $_) })) {
              $found = Get-ChildItem $root -Recurse -Filter $dll -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
              if ($found) { break }
            }
            if (-not $found) { throw "Could not locate x64 VC++ runtime DLL: $dll" }
            Copy-Item $found.FullName (Join-Path $destination $dll) -Force
            Write-Host "Bundled $dll from $($found.FullName)"
          }
          foreach ($dll in $required) {
            if (-not (Test-Path (Join-Path $destination $dll))) { throw "VC++ runtime bundling failed: $dll" }
          }

      - name: Validate staged runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("VoidOne.exe","Qt6Core.dll","Qt6Gui.dll","Qt6Qml.dll","Qt6Quick.dll","platforms\qwindows.dll","msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          foreach ($file in $required) {
            $path = Join-Path "$env:GITHUB_WORKSPACE\qa\package" $file
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing staged runtime file: $file" }
          }

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
          retention-days: 14

  filesystem:
    name: Filesystem Torture
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Filesystem matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "VoidOne-FS-QA"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          1..500 | ForEach-Object { "VoidOne test $_" | Set-Content "$root\file-$_.txt" -Encoding utf8 }
          $unicode = Join-Path $root "فارسی-日本語-中文-한국어"
          New-Item -ItemType Directory -Force $unicode | Out-Null
          "Unicode" | Set-Content "$unicode\تست.txt" -Encoding utf8
          $current = $root
          1..25 | ForEach-Object { $current = Join-Path $current "level-$($_)"; New-Item -ItemType Directory -Force $current | Out-Null }
          "Deep path" | Set-Content "$current\deep.txt" -Encoding utf8
          Copy-Item $root "$root-copy" -Recurse
          if (-not (Test-Path "$root-copy\file-500.txt")) { throw "Recursive copy failed." }
          Move-Item "$root-copy\file-500.txt" "$root-copy\moved.txt"
          if (-not (Test-Path "$root-copy\moved.txt")) { throw "Move failed." }
          Remove-Item "$root-copy\moved.txt" -Force
          if (Test-Path "$root-copy\moved.txt") { throw "Delete failed." }
          Remove-Item $root -Recurse -Force
          Remove-Item "$root-copy" -Recurse -Force

  stress:
    name: CPU Memory Stress
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: CPU stress
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jobs = @()
          for ($i=0; $i -lt 8; $i++) { $jobs += Start-Job { $x=0; for ($j=0; $j -lt 5000000; $j++) { $x=(($x+$j)*17)%1000003 }; $x } }
          Wait-Job $jobs | Out-Null
          foreach ($job in $jobs) { if ($job.State -ne "Completed") { throw "CPU stress worker failed." } }
          Receive-Job $jobs | Out-Null
          Remove-Job $jobs -Force
      - name: Memory stress
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buffers = New-Object System.Collections.Generic.List[byte[]]
          try {
            1..64 | ForEach-Object { $b=New-Object byte[] (1MB); $b[0]=0x55; $b[$b.Length-1]=0xAA; $buffers.Add($b) }
            foreach ($b in $buffers) { if ($b[0] -ne 0x55 -or $b[$b.Length-1] -ne 0xAA) { throw "Memory integrity check failed." } }
          } finally { $buffers.Clear(); [GC]::Collect(); [GC]::WaitForPendingFinalizers() }

  runtime:
    name: Application Stability
    needs: build
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Repeated isolated startup
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: "1"
          QT_DEBUG_PLUGINS: "1"
          QML_IMPORT_TRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:GITHUB_WORKSPACE\qa\package\VoidOne.exe"
          New-Item -ItemType Directory -Force qa\artifacts | Out-Null
          1..10 | ForEach-Object {
            $iteration = $_
            $root = Join-Path $env:RUNNER_TEMP "VoidOne-Startup-$iteration"
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$root\AppData\Roaming","$root\AppData\Local" | Out-Null
            $envs = @{ APPDATA="$root\AppData\Roaming"; LOCALAPPDATA="$root\AppData\Local"; QT_LOGGING_TO_CONSOLE="1"; QT_DEBUG_PLUGINS="1"; QML_IMPORT_TRACE="1" }
            $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru -Environment $envs
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) {
              $crash = Join-Path $env:TEMP "VoidOne-crash.log"
              if (Test-Path $crash) { Copy-Item $crash "qa\artifacts\crash-$iteration.log" -Force }
              throw "VoidOne failed startup iteration $iteration with exit code $($p.ExitCode)."
            }
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $p.Id -Timeout 5 -ErrorAction SilentlyContinue
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: startup-diagnostics-${{ github.run_id }}
          path: qa/artifacts
          if-no-files-found: warn
          retention-days: 30

  graphics:
    name: Graphics QA (${{ matrix.backend }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [default, software, d3d11, opengl]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Configure backend
        shell: pwsh
        run: |
          switch ("${{ matrix.backend }}") {
            "software" { "QT_QUICK_BACKEND=software" | Out-File $env:GITHUB_ENV -Append }
            "d3d11" { "QSG_RHI_BACKEND=d3d11" | Out-File $env:GITHUB_ENV -Append }
            "opengl" { "QSG_RHI_BACKEND=opengl" | Out-File $env:GITHUB_ENV -Append }
            default { Write-Host "Default Qt Quick RHI backend." }
          }
      - name: Startup and graphics diagnostics
        shell: pwsh
        env:
          QT_LOGGING_TO_CONSOLE: "1"
          QT_DEBUG_PLUGINS: "1"
          QML_IMPORT_TRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force qa\artifacts | Out-Null
          $exe = "$env:GITHUB_WORKSPACE\qa\package\VoidOne.exe"
          $root = Join-Path $env:RUNNER_TEMP "VoidOne-Graphics-${{ matrix.backend }}"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$root\AppData\Roaming","$root\AppData\Local" | Out-Null
          $envs = @{ APPDATA="$root\AppData\Roaming"; LOCALAPPDATA="$root\AppData\Local"; QT_LOGGING_TO_CONSOLE="1"; QT_DEBUG_PLUGINS="1"; QML_IMPORT_TRACE="1" }
          $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru -Environment $envs
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            $crash = Join-Path $env:TEMP "VoidOne-crash.log"
            if (Test-Path $crash) { Copy-Item $crash "qa\artifacts\crash-${{ matrix.backend }}.log" -Force }
            throw "Graphics backend ${{ matrix.backend }} failed startup with exit code $($p.ExitCode)."
          }
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
      - name: Upload graphics diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: graphics-${{ matrix.backend }}-${{ github.run_id }}
          path: qa/artifacts
          if-no-files-found: warn
          retention-days: 30

  runtime-dependencies:
    name: Runtime Dependency QA
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Validate runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required=@("VoidOne.exe","Qt6Core.dll","Qt6Gui.dll","Qt6Qml.dll","Qt6Quick.dll","platforms\qwindows.dll","msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          foreach ($file in $required) { if (-not (Test-Path (Join-Path "$env:GITHUB_WORKSPACE\qa\package" $file) -PathType Leaf)) { throw "Missing runtime dependency: $file" } }
      - name: SQLite plugin
        shell: pwsh
        run: |
          if (-not (Get-ChildItem qa\package -Recurse -Filter qsqlite.dll -File -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "Qt SQLite plugin was not deployed." }

  database:
    name: Database Runtime QA
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: SQLite deployment and writable storage test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sqlite=Get-ChildItem qa\package -Recurse -Filter qsqlite.dll -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sqlite) { throw "SQLite plugin is missing from deployed package." }
          $root="$env:RUNNER_TEMP\VoidOne-DB-QA"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          1..250 | ForEach-Object { "row-$($_)" | Set-Content "$root\row-$_.txt" -Encoding utf8 }
          if ((Get-ChildItem $root -File).Count -ne 250) { throw "Database storage simulation failed." }
          Remove-Item $root -Recurse -Force

  backup:
    name: Backup Restore Torture
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Backup restore simulation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="$env:RUNNER_TEMP\VoidOne-Backup-QA"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item "$root\source\data" -ItemType Directory -Force | Out-Null
          New-Item "$root\source\config" -ItemType Directory -Force | Out-Null
          1..1000 | ForEach-Object { "Data $_" | Set-Content "$root\source\data\file-$_.dat" -Encoding utf8 }
          "VoidOne config" | Set-Content "$root\source\config\settings.ini" -Encoding utf8
          Copy-Item "$root\source" "$root\backup" -Recurse
          Remove-Item "$root\source" -Recurse -Force
          Copy-Item "$root\backup" "$root\restored" -Recurse
          $count=(Get-ChildItem "$root\restored" -Recurse -File).Count
          if ($count -ne 1001) { throw "Backup simulation lost data. Expected 1001 files, got $count." }
          Remove-Item $root -Recurse -Force

  network:
    name: Network Resilience QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: DNS
        shell: pwsh
        run: Resolve-DnsName github.com -ErrorAction Stop
      - name: HTTPS
        shell: pwsh
        run: |
          $r=Invoke-WebRequest -Uri "https://github.com" -UseBasicParsing -TimeoutSec 20
          if ($r.StatusCode -lt 200 -or $r.StatusCode -ge 400) { throw "HTTPS connectivity failed." }
      - name: Network inventory
        shell: pwsh
        run: |
          Get-NetAdapter | Format-Table Name,Status,LinkSpeed,MacAddress
          Get-NetIPConfiguration

  windows:
    name: Windows API / Registry QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Registry round trip
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $key="HKCU:\Software\VoidOne-QA"
          Remove-Item $key -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $key -Force | Out-Null
          Set-ItemProperty $key -Name TestValue -Value VoidOne
          if ((Get-ItemProperty $key).TestValue -ne "VoidOne") { throw "Registry round trip failed." }
          Remove-Item $key -Recurse -Force
      - name: Environment validation
        shell: pwsh
        run: |
          foreach ($name in @("TEMP","TMP","APPDATA","LOCALAPPDATA","USERPROFILE")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing environment variable: $name" }
          }

  steam:
    name: Steam Discovery Fixture QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Synthetic Steam manifest
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root="$env:RUNNER_TEMP\VoidOne-Steam-QA"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item "$root\steamapps\common\VoidOneQAGame" -ItemType Directory -Force | Out-Null
          @"
          "AppState"
          {
              "appid" "999999"
              "name" "VoidOne QA Game"
              "installdir" "VoidOneQAGame"
          }
          "@ | Set-Content "$root\steamapps\appmanifest_999999.acf" -Encoding utf8
          if (-not (Select-String "$root\steamapps\appmanifest_999999.acf" '"appid"')) { throw "Steam fixture failed." }
          Remove-Item $root -Recurse -Force

  qml:
    name: QML Integrity QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate QML files
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $files=Get-ChildItem src\ui\qml -Recurse -Filter *.qml
          if (-not $files) { throw "No QML files found." }
          foreach ($file in $files) {
            $text=Get-Content $file.FullName -Raw
            if ([string]::IsNullOrWhiteSpace($text)) { throw "Empty QML file: $($file.FullName)" }
            $open=([regex]::Matches($text,'\{')).Count
            $close=([regex]::Matches($text,'\}')).Count
            if ($open -ne $close) { throw "Unbalanced braces in $($file.FullName)." }
          }

  crash-diagnostics:
    name: Crash Diagnostics QA
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Windows crash handler
        shell: pwsh
        run: |
          $main=Get-Content src\main.cpp -Raw
          foreach ($pattern in @("SetUnhandledExceptionFilter","VoidOne-crash.log","EXCEPTION_POINTERS")) {
            if ($main -notmatch [regex]::Escape($pattern)) { throw "Crash infrastructure marker missing: $pattern" }
          }

  package:
    name: Package Integrity QA
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voidone-qa-package-${{ github.run_id }}
          path: qa/package
      - name: Hash package
        shell: pwsh
        run: |
          Get-ChildItem qa\package -Recurse -File | Get-FileHash -Algorithm SHA256 | Export-Csv qa-package-hashes.csv -NoTypeInformation
      - name: Package statistics
        shell: pwsh
        run: |
          $files=Get-ChildItem qa\package -Recurse -File
          $size=($files | Measure-Object Length -Sum).Sum
          Write-Host "Files: $($files.Count)"
          Write-Host "Package size: $([Math]::Round($size/1MB,2)) MB"
          if ($files.Count -lt 5) { throw "Package contains suspiciously few files." }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-report-${{ github.run_id }}
          path: qa-package-hashes.csv
          retention-days: 30

  qa-gate:
    name: VoidOne QA Gate
    if: always()
    needs:
      - discover
      - build
      - filesystem
      - stress
      - runtime
      - graphics
      - runtime-dependencies
      - database
      - backup
      - network
      - windows
      - steam
      - qml
      - crash-diagnostics
      - package
    runs-on: windows-2025
    steps:
      - name: Evaluate results
        shell: pwsh
        run: |
          $results=@{
            discover='${{ needs.discover.result }}'; build='${{ needs.build.result }}'; filesystem='${{ needs.filesystem.result }}'; stress='${{ needs.stress.result }}'; runtime='${{ needs.runtime.result }}'; graphics='${{ needs.graphics.result }}'; runtime_dependencies='${{ needs.runtime-dependencies.result }}'; database='${{ needs.database.result }}'; backup='${{ needs.backup.result }}'; network='${{ needs.network.result }}'; windows='${{ needs.windows.result }}'; steam='${{ needs.steam.result }}'; qml='${{ needs.qml.result }}'; crash_diagnostics='${{ needs.crash-diagnostics.result }}'; package='${{ needs.package.result }}'
          }
          $results | ConvertTo-Json | Tee-Object qa-results.json
          $bad=$results.GetEnumerator() | Where-Object { $_.Value -ne 'success' }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "$($_.Key): $($_.Value)" }
            throw "VoidOne Full System QA FAILED."
          }
          Write-Host "VOIDONE FULL SYSTEM QA PASSED"
      - name: Upload final QA report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
