name: "🛡️ VoidOne — Enterprise Hardening Gate"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.*"
  QT_ARCH: win64_msvc2022_64

jobs:
  debug-asan-tests:
    name: "Debug + MSVC ASan + CTest"
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false

      - name: Configure ASan build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build-asan -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DVOIDONE_ENABLE_SANITIZERS=ON `
            -DVOIDONE_BUILD_TESTS=ON `
            -DVOIDONE_GENERATE_INSTALLER=OFF `
            -DVOIDONE_ENABLE_CODE_SIGNING=OFF

      - name: Build ASan targets
        shell: pwsh
        run: cmake --build build-asan --config Debug --parallel

      - name: Run CTest under ASan
        shell: pwsh
        run: ctest --test-dir build-asan -C Debug --output-on-failure --timeout 120

  release-tests:
    name: "Release Build + CTest"
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false

      - name: Configure Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVOIDONE_VERSION_OVERRIDE=0.0.1 `
            -DVOIDONE_BUILD_TESTS=ON `
            -DVOIDONE_GENERATE_INSTALLER=OFF `
            -DVOIDONE_ENABLE_CODE_SIGNING=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build build-release --config Release --parallel

      - name: Run Release tests
        shell: pwsh
        run: ctest --test-dir build-release -C Release --output-on-failure --timeout 120

      - name: Verify executable and deployment metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build-release -Recurse -Filter VoidOne.exe | Select-Object -First 1
          if (-not $exe) { throw "VoidOne.exe was not produced." }
          Write-Host "Executable: $($exe.FullName)"

  installer-syntax:
    name: "Installer Source Validation"
    needs: release-tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install NSIS and WiX
        shell: pwsh
        run: |
          choco install nsis dotnet-8.0-sdk -y --no-progress
          dotnet tool install --global wix --ignore-failed-sources || dotnet tool update --global wix
          $wixMajor = ((wix --version).Trim()).Split('.')[0]
          wix eula accept "wix$wixMajor"
          wix extension add -g WixToolset.UI.wixext

      - name: Validate installer sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path installer.nsi)) { throw "installer.nsi missing" }
          if (-not (Test-Path installer.wxs)) { throw "installer.wxs missing" }
          makensis /V2 /DVERSION=0.0.1 installer.nsi
          if (-not (Test-Path "dist\VoidOne-Setup-0.0.1-x64.exe")) { throw "NSIS did not produce an installer." }
          wix build installer.wxs -dProductVersion=0.0.1 -ext WixToolset.UI.wixext -o dist\VoidOne-0.0.1-x64.msi
          if (-not (Test-Path "dist\VoidOne-0.0.1-x64.msi")) { throw "WiX did not produce an MSI." }

      - name: Validate installer payload paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Select-String -Path installer.nsi -Pattern 'SetOutPath "\$INSTDIR\\bin"').Count -eq 0) {
            throw "NSIS installer no longer installs the payload into the declared bin directory."
          }
          if ((Select-String -Path installer.wxs -Pattern 'Include="package\\\\\*\*"').Count -eq 0) {
            throw "WiX payload layout is inconsistent with CI staging."
          }
