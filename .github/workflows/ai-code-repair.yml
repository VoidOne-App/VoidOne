name: VoidOne AI Code Repair

on:
  workflow_run:
    workflows:
      - VoidOne CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID to diagnose"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ai-repair-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    name: Diagnose CI failure and create repair PR

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false


      - name: Resolve target run
        id: run
        shell: bash
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}

        run: |
          set -euo pipefail

          RUN_ID="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"

          if [[ -z "$RUN_ID" ]]; then
            echo "Missing workflow run id"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"


      - name: Resolve failed revision
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}

        run: |
          set -euo pipefail

          SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          BRANCH=$(gh run view "$RUN_ID" --json headBranch --jq '.headBranch')

          test -n "$SHA"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"


      - name: Prepare workspace
        id: workspace
        shell: bash

        run: |
          set -euo pipefail

          DIR="${RUNNER_TEMP}/voidone-ai"

          mkdir -p "$DIR"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"


      - name: Download CI logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          DIR: ${{ steps.workspace.outputs.dir }}

        run: |
          set -euo pipefail

          gh run view "$RUN_ID" \
            --log-failed \
            > "$DIR/ci-failure.log"

          test -s "$DIR/ci-failure.log"


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ai-repair.txt


      - name: Install dependencies
        run: |
          python -m pip install \
            -r scripts/requirements-ai-repair.txt


      - name: Generate repair
        id: repair
        continue-on-error: true

        env:
          AI_REPAIR_PROVIDER: experiential-labs
          AI_REPAIR_MAX_ATTEMPTS: "2"

          EXPLABS_API_KEY:
            ${{ secrets.EXPLABS_API_KEY }}

          EXPLABS_BASE_URL:
            https://api.experientiallabs.ai/v1

          AI_REPAIR_TEMP_DIR:
            ${{ steps.workspace.outputs.dir }}

        shell: bash

        run: |
          set -euo pipefail

          python scripts/ai/dispatcher.py \
            --repo . \
            --log-file \
            "${AI_REPAIR_TEMP_DIR}/ci-failure.log"


      - name: Upload repair artifacts
        if: always()

        uses: actions/upload-artifact@v7

        with:

          name:
            VoidOne-AI-Repair-${{ steps.run.outputs.run_id }}

          path: |
            ${{ steps.workspace.outputs.dir }}/repair-report.json
            ${{ steps.workspace.outputs.dir }}/repair-candidate.patch
            ${{ steps.workspace.outputs.dir }}/ci-failure.log

          if-no-files-found: warn
          retention-days: 14


      - name: Stop if repair failed
        if: steps.repair.outcome == 'failure'

        run: |
          echo "No validated repair produced."
          exit 1


      - name: Apply repair patch
        id: patch
        shell: bash

        env:
          SHA: ${{ steps.target.outputs.sha }}
          DIR: ${{ steps.workspace.outputs.dir }}

        run: |

          set -euo pipefail

          git fetch origin "$SHA" --depth=1

          TREE="${RUNNER_TEMP}/repair-tree"

          git worktree add \
            "$TREE" \
            "$SHA"


          PATCH="$DIR/repair-candidate.patch"


          test -s "$PATCH"


          git -C "$TREE" apply \
            --check \
            --whitespace=error-all \
            "$PATCH"


          git -C "$TREE" apply \
            --whitespace=error-all \
            "$PATCH"


          git -C "$TREE" diff --check



      - name: Create repair branch and PR
        shell: bash

        env:

          GH_TOKEN:
            ${{ github.token }}

          RUN_ID:
            ${{ steps.run.outputs.run_id }}

          SHA:
            ${{ steps.target.outputs.sha }}

        run: |

          set -euo pipefail


          BRANCH="ai/repair/${RUN_ID}"


          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')


          if [[ -n "$EXISTING" ]]; then
            echo "PR already exists #$EXISTING"
            exit 0
          fi


          BODY=$(cat <<EOF
## AI validated repair

Generated from failed CI run:

${RUN_ID}

Revision:

${SHA}


Automated merge: disabled

Human review required.
EOF
)


          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title \
            "fix: AI repair for CI ${RUN_ID}" \
            --body "$BODY"
