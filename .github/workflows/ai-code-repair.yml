name: VoidOne AI Code Repair

on:
  workflow_run:
    workflows: ["VoidOne CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID to diagnose (optional for manual runs)"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  repair:
    name: Diagnose failed CI and generate validated repair
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted repair engine
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target run
        id: run
        shell: bash
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [[ -z "$run_id" ]]; then
            echo "run_id is required for manual runs"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Repair target run: $run_id"

      - name: Prepare AI repair workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          repair_dir="${RUNNER_TEMP}/voidone-ai"
          mkdir -p "$repair_dir"
          echo "repair_dir=$repair_dir" >> "$GITHUB_OUTPUT"
          echo "AI repair workspace: $repair_dir"

      - name: Download failed CI logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          REPAIR_DIR: ${{ steps.workspace.outputs.repair_dir }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > "$REPAIR_DIR/ci-failure.log"
          if [[ ! -s "$REPAIR_DIR/ci-failure.log" ]]; then
            echo "GitHub Actions returned no failed-step log output." >&2
            exit 1
          fi
          wc -c "$REPAIR_DIR/ci-failure.log"

      - name: Verify repair repository is clean
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Repair engine checkout is not clean." >&2
            git status --short
            exit 1
          fi
          echo "Repair engine checkout is clean."

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ai-repair.txt

      - name: Install repair dependencies
        shell: bash
        run: python -m pip install -r scripts/requirements-ai-repair.txt

      - name: Generate and validate repair candidate
        id: repair
        continue-on-error: true
        env:
          AI_REPAIR_PROVIDER: experiential-labs
          AI_REPAIR_MAX_ATTEMPTS: "2"
          EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
          EXPLABS_BASE_URL: https://api.experientiallabs.ai/v1
          EXPLABS_DIAGNOSIS_MODEL: ${{ vars.EXPLABS_DIAGNOSIS_MODEL || 'deepseek-v4-flash' }}
          EXPLABS_SECOND_OPINION_MODEL: ${{ vars.EXPLABS_SECOND_OPINION_MODEL || 'qwen3.8-27b' }}
          EXPLABS_REPAIR_MODEL: ${{ vars.EXPLABS_REPAIR_MODEL || 'claude-fable-5.1' }}
          EXPLABS_REVIEW_MODEL: ${{ vars.EXPLABS_REVIEW_MODEL || 'gpt-5.6-luna' }}
          AI_REPAIR_TEMP_DIR: ${{ steps.workspace.outputs.repair_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ai/dispatcher.py \
            --repo . \
            --log-file "${AI_REPAIR_TEMP_DIR}/ci-failure.log"

      - name: Verify validated patch is present
        if: steps.repair.outcome == 'success'
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "AI reported success but produced no repository changes." >&2
            exit 1
          fi
          git diff --check
          git diff --stat
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Publish repair artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VoidOne-AI-Repair-${{ steps.run.outputs.run_id }}
          path: |
            ${{ steps.workspace.outputs.repair_dir }}/repair-report.json
            ${{ steps.workspace.outputs.repair_dir }}/repair-candidate.patch
            ${{ steps.workspace.outputs.repair_dir }}/ci-failure.log
          if-no-files-found: warn
          retention-days: 14

      - name: Create reviewable repair branch
        if: steps.repair.outcome == 'success' && steps.patch.outputs.has_changes == 'true'
        id: branch
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          branch="ai/repair/run-${RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq 'length' | grep -qv '^0$'; then
            echo "A PR already exists for $branch; refusing to create a duplicate."
            exit 1
          fi
          git config user.name "VoidOne AI Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "fix: apply validated AI repair for CI run ${RUN_ID}"
          git push --set-upstream origin "$branch"

      - name: Open repair pull request
        if: steps.repair.outcome == 'success' && steps.patch.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "fix: AI-validated repair for CI run ${RUN_ID}" \
            --body "Automated repair candidate generated and validated by VoidOne's AI repair pipeline.\n\nSource CI run: ${run_url}\n\nValidation completed by the trusted repair engine before this PR was opened.\n\nThe patch remains subject to normal CI and human review; this workflow does not merge it automatically."

      - name: Fail when no validated repair was produced
        if: steps.repair.outcome == 'failure'
        shell: bash
        run: |
          echo "No validated AI repair candidate was produced."
          exit 1
