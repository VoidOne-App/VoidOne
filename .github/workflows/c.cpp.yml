name: VoidOne CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.11.2'
  QT_ARCH: win64_msvc2022_64
  CMAKE_VERSION: '4.4.3'
  APP_NAME: VoidOne
  BUILD_TYPE: Release

jobs:
  build:
    name: Windows Build / Test / Package
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      # ---------------------------------------------------------------------
      # Stage 1: deterministic toolchain
      # ---------------------------------------------------------------------
      - name: Install Visual Studio 2026 Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://aka.ms/vs/stable/vs_buildtools.exe' -OutFile $installer
          $args = @('--quiet','--wait','--norestart','--nocache','--add','Microsoft.VisualStudio.Workload.VCTools','--includeRecommended')
          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "Visual Studio installation failed: $($p.ExitCode)" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw 'MSVC Build Tools installation was not found.' }
          "VOIDONE_VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize MSVC x64 environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsDevCmd = Join-Path $env:VOIDONE_VS_PATH 'Common7\Tools\VsDevCmd.bat'
          $output = & cmd.exe /d /s /c "`"$vsDevCmd`" -arch=amd64 && set" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed: $LASTEXITCODE" }

          $persist = @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCToolsVersion','VCToolsRedistDir','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion','VSCMD_ARG_TGT_ARCH')
          foreach ($line in $output) {
            $text = [string]$line
            $i = $text.IndexOf('=')
            if ($i -le 0) { continue }
            $name = $text.Substring(0,$i)
            if ($persist -contains $name) {
              "$name=$($text.Substring($i + 1))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $pathLine = $output | Where-Object { $_ -like 'PATH=*' } | Select-Object -First 1
          if ($pathLine) { ($pathLine -replace '^PATH=','') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cl = (& cl 2>&1) -join "`n"
          $cl | Write-Host
          if ($cl -notmatch 'Version 19\.51\.') { throw "Expected MSVC 14.51 / compiler 19.51.x, found: $cl" }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "Expected x64 MSVC environment, found '$env:VSCMD_ARG_TGT_ARCH'." }
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) { throw 'VCToolsRedistDir is unavailable.' }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'

      - name: Install exact CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CMAKE_VERSION
          $archive = "cmake-$version-windows-x86_64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Kitware/CMake/releases/download/v$version/$archive" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "cmake-$version-windows-x86_64\bin"
          if (-not (Test-Path (Join-Path $bin 'cmake.exe'))) { throw 'Pinned CMake installation failed.' }
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Ninja and NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nsis -y --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS installation failed.' }
          $nsis | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify deterministic toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = (& cmake --version 2>&1) -join "`n"
          $cmake | Write-Host
          if ($cmake -notmatch 'cmake version 4\.4\.3') { throw "Expected CMake 4.4.3, found: $cmake" }
          Write-Host "Ninja: $(& ninja --version)"
          Write-Host "NSIS: $(& makensis /VERSION)"

      # ---------------------------------------------------------------------
      # Stage 2: metadata
      # ---------------------------------------------------------------------
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -eq 'tag') { $version = $env:REF_NAME -replace '^v','' }
          else { $version = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))" }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $base = $version -replace '-.*$',''
          $parts = $base.Split('.')
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "windows_value=$($parts[0]).$($parts[1]).$($parts[2]).0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------------------------------------------------------------------
      # Stage 3: configure -> build -> test in one canonical build tree
      # ---------------------------------------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE -DVOIDONE_BUILD_TESTS=ON -DVOIDONE_GENERATE_INSTALLER=OFF '-DVOIDONE_VERSION_OVERRIDE:STRING=${{ steps.version.outputs.value }}'
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Build application and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config $env:BUILD_TYPE --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Deploy Qt runtime for test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = Get-ChildItem build -Recurse -Filter 'voidone_*_tests.exe' -File | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' }
          if (-not $tests) { throw 'No VoidOne test executables were produced.' }
          foreach ($test in $tests) {
            windeployqt --release --no-translations --no-compiler-runtime $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $($test.Name)." }
          }
          if (-not (Get-ChildItem build -Recurse -Filter qsqlite.dll -File | Select-Object -First 1)) { throw 'Qt SQLite plugin was not deployed for tests.' }

      - name: Run CTest and database tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_PLUGIN_PATH = "$env:GITHUB_WORKSPACE\build;$env:QT_ROOT_DIR\plugins"
          ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure --timeout 300 --verbose
          if ($LASTEXITCODE -ne 0) { throw "CTest failed: $LASTEXITCODE" }

      # ---------------------------------------------------------------------
      # Stage 4: one canonical runtime payload for every distribution format
      # ---------------------------------------------------------------------
      - name: Stage canonical Windows payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item package, dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item package, dist -ItemType Directory -Force | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter VoidOne.exe -File | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Select-Object -First 1
          if (-not $exe) { throw 'VoidOne.exe was not produced.' }
          Copy-Item $exe.FullName package\VoidOne.exe
          $qml = Join-Path $env:GITHUB_WORKSPACE 'src\ui\qml'
          if (Test-Path $qml) { windeployqt --release --compiler-runtime --no-translations --qmldir $qml package\VoidOne.exe }
          else { windeployqt --release --compiler-runtime --no-translations package\VoidOne.exe }
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          if (-not (Test-Path package\platforms\qwindows.dll)) { throw 'Qt Windows platform plugin is missing.' }

      - name: Force bundle x64 MSVC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-ChildItem $env:VCToolsRedistDir -Recurse -Filter msvcp140.dll -File |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC[^\\]*\.CRT\\msvcp140\.dll$' } |
            Select-Object -First 1
          if (-not $runtime) { throw "Could not locate x64 MSVC runtime below $env:VCToolsRedistDir" }
          $runtimeDir = $runtime.Directory.FullName
          Get-ChildItem $runtimeDir -Filter '*.dll' -File | ForEach-Object { Copy-Item $_.FullName package\ -Force }
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            if (-not (Test-Path "package\$dll")) { throw "Required VC++ runtime DLL missing: $dll" }
          }

      - name: Validate canonical payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('VoidOne.exe','Qt6Core.dll','Qt6Gui.dll','Qt6Qml.dll','Qt6Quick.dll','platforms\qwindows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')
          foreach ($file in $required) {
            if (-not (Test-Path "package\$file" -PathType Leaf)) { throw "Canonical payload is missing: $file" }
          }
          Get-ChildItem package -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 | Export-Csv package\SHA256SUMS.csv -NoTypeInformation

      # ---------------------------------------------------------------------
      # Stage 5: package from the same canonical payload
      # ---------------------------------------------------------------------
      - name: Download Microsoft VC++ Redistributable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $source
          if (-not (Test-Path $source -PathType Leaf)) { throw 'VC++ Redistributable download failed.' }
          if ((Get-Item $source).Length -lt 1000000) { throw 'VC++ Redistributable payload is unexpectedly small.' }
          "VOIDONE_VC_REDIST_SOURCE=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('packaging\windows\installer.nsi','assets\app-icon.ico','LICENSE')) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installer input is missing: $path" }
          }
          makensis /V2 /DVERSION='${{ steps.version.outputs.value }}' /DWINDOWS_VERSION='${{ steps.version.outputs.windows_value }}' "/DVC_REDIST_SOURCE=$env:VOIDONE_VC_REDIST_SOURCE" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed: $LASTEXITCODE" }
          if (-not (Test-Path dist\VoidOne-Setup-x64.exe -PathType Leaf)) { throw 'NSIS installer was not produced.' }

      - name: Build portable ZIP from canonical payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path package\* -DestinationPath dist\VoidOne-Portable-x64.zip -CompressionLevel Optimal -Force
          if (-not (Test-Path dist\VoidOne-Portable-x64.zip -PathType Leaf)) { throw 'Portable ZIP was not produced.' }

      - name: Upload canonical payload and packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VoidOne-${{ steps.version.outputs.value }}
          path: |
            package
            dist\VoidOne-Setup-x64.exe
            dist\VoidOne-Portable-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Portable-x64.zip
