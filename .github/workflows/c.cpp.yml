name: Voidone CI/CD

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 2 * * 0'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Emergency Mode: Skip Test Suite"
        type: boolean
        default: false
      enable_lto:
        description: "Enable Link-Time Optimization"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: voidone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.0"
  QT_ARCH: win64_msvc2022_64
  APP_NAME: Voidone

jobs:

  # ----------------------------------------------------------
  # 1. SemVer Validation
  # ----------------------------------------------------------
  governance:
    name: Tag Validation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate SemVer Tag Standard
        run: |
          TAG="${{ github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$TAG' fails SemVer compliance."
            exit 1
          fi
          echo "### 🏷️ Verified Release Version: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # 2. Security Audit & SARIF Reporting
  # ----------------------------------------------------------
  security-audit:
    name: Security & SARIF Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  # ----------------------------------------------------------
  # 3. Static Code Analysis (CodeQL)
  # ----------------------------------------------------------
  codeql-analysis:
    name: Static Code Analysis (CodeQL)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Tools (Ninja)
        shell: pwsh
        run: choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Build CodeQL Target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir build-codeql -ErrorAction SilentlyContinue
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-codeql --config Release --parallel

      - uses: github/codeql-action/analyze@v3

  # ----------------------------------------------------------
  # 4. Windows Build & Dependency Bundling
  # ----------------------------------------------------------
  build-production:
    name: Build Binaries & Installers
    needs: [security-audit, codeql-analysis]
    if: always() && needs.security-audit.result == 'success' && needs.codeql-analysis.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      build-version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Versioning Strategy
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: voidone-msvc-${{ github.sha }}
          restore-keys: voidone-msvc-
          variant: ccache
          max-size: 1000M

      - name: Setup Toolchain (NSIS, WiX v4)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nsis dotnet-8.0-sdk -y --no-progress
          dotnet tool install --global wix --ignore-failed-sources || dotnet tool update --global wix
          wix eula accept "wix4" -ErrorAction SilentlyContinue
          wix extension add -g WixToolset.UI.wixext

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir build -ErrorAction SilentlyContinue
          
          $ltoFlag = if ("${{ inputs.enable_lto }}" -eq "false") { "OFF" } else { "ON" }
          
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=$ltoFlag `
            -DVOIDONE_VERSION_OVERRIDE="${{ steps.version.outputs.value }}" `
            -DVOIDONE_BUILD_TESTS=${{ inputs.skip_tests && 'OFF' || 'ON' }} `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_EXE_LINKER_FLAGS="/NXCOMPAT /DYNAMICBASE /GUARD:CF /HIGHENTROPYVA /CETCOMPAT /DEBUG /OPT:REF /OPT:ICF"

      - name: Compile Optimized C++ Engine
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Execute CTest Unit Suite
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          if (Test-Path "tests\CMakeLists.txt") {
            ctest --test-dir build -C Release --output-on-failure --timeout 120
          }

      - name: Deployment Staging, MSVC Redist & Qt Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Path package, pdb-symbols -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package, pdb-symbols | Out-Null
          
          $exe = Get-ChildItem -Path build -Filter "$env:APP_NAME.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Error "CRITICAL: $env:APP_NAME.exe Build Failed!"; exit 1 }
          
          Copy-Item -Path $exe.FullName -Destination "package\$env:APP_NAME.exe" -Force
          
          Write-Host "Downloading Visual C++ Redistributable..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "package\VC_redist.x64.exe"

          Get-ChildItem -Path build -Filter "*.pdb" -Recurse | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "pdb-symbols\" -Force
          }

          windeployqt --release `
            --compiler-runtime `
            --no-translations `
            --qmldir "$env:GITHUB_WORKSPACE\ui" `
            --qmldir "$env:GITHUB_WORKSPACE\src" `
            "package\$env:APP_NAME.exe"

      - name: Code Signing (Optional Hook)
        if: env.CODE_SIGNING_PFX != ''
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $certPath = "$env:TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f $certPath /p $env:CODE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 "package\$env:APP_NAME.exe"
          Remove-Item -Path $certPath -Force

      - name: Build Installers (NSIS EXE + WiX MSI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          if (Test-Path "installer.nsi") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" /DREDIST_PATH="package\VC_redist.x64.exe" installer.nsi
            if (Test-Path "dist\Voidone-Setup-x64.exe") {
              Move-Item -Path "dist\Voidone-Setup-x64.exe" -Destination "dist\Voidone-Setup-x64-${{ steps.version.outputs.value }}.exe" -Force
            }
          }

          if (Test-Path "installer.wxs") {
            wix build installer.wxs -ext WixToolset.UI.wixext -o "dist\Voidone-Setup-x64-${{ steps.version.outputs.value }}.msi"
          }

      - name: Generate Compress Archives & SHA-256 Hashes
        shell: pwsh
        run: |
          $zipName = "Voidone-Windows-x64-Portable-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path package\* -DestinationPath $zipName -CompressionLevel Optimal
          
          $pdbZip = "Voidone-Windows-x64-Symbols-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path pdb-symbols\* -DestinationPath $pdbZip -CompressionLevel Optimal

          Get-ChildItem -Path . -Filter "*.zip" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem -Path dist -Filter "*.*" -Include "*.exe","*.msi" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: package/
          format: 'spdx-json'
          output-file: 'Voidone-SBOM-${{ steps.version.outputs.value }}.spdx.json'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voidone-Windows-Release
          path: |
            Voidone-Windows-x64-*.zip*
            Voidone-SBOM-*.spdx.json
            dist/*.*
          retention-days: 30

  # ----------------------------------------------------------
  # 5. Publishing & SLSA Attestation
  # ----------------------------------------------------------
  publish-release:
    name: Publish Release & Generate Attestation
    needs: [governance, build-production]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Voidone-Windows-Release
          path: release-files

      - name: Build Provenance Attestation (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-files/*'

      - name: Determine Release Channel & Changelog
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="${{ github.ref_name }}" 2>/devnull || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"• %s (%h)" | head -n 15)
          else
            LOG="• Initial Release Build"
          fi

          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Voidone ${{ github.ref_name }}"
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/**

      - name: Discord Webhook Notification
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGELOG: ${{ steps.meta.outputs.log }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          PAYLOAD=$(jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg avatar "${{ github.event.sender.avatar_url }}" \
            --arg changelog "$CHANGELOG" \
            --arg url "https://github.com/${{ github.repository }}/releases" \
            '{
              username: "Voidone CI",
              embeds: [{
                title: ("🚀 Voidone " + $tag + " is Live!"),
                url: $url,
                description: "Artifacts, SBOM specs, dependencies, and SLSA attestations have been published.",
                color: 5814783,
                author: { name: $actor, icon_url: $avatar },
                fields: [
                  { name: "🏷️ Tag", value: $tag, inline: true },
                  { name: "🛡️ Attestation", value: "SLSA Level 2 Verified", inline: true },
                  { name: "📦 SBOM", value: "SPDX Standard Included", inline: true },
                  { name: "📝 Changelog", value: $changelog }
                ]
              }]
            }')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
