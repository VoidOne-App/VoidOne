name: Voidone CI/CD 

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 2 * * 0'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Emergency Mode: Skip Test Suite"
        type: boolean
        default: false
      enable_lto:
        description: "Enable Link-Time Optimization"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: voidone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.0"
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne
  COMPANY_NAME: VoidOne_app

jobs:

  # ----------------------------------------------------------
  # 1. SemVer Validation
  # ----------------------------------------------------------
  governance:
    name: Tag Validation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Tag Standard
        run: |
          TAG="${{ github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$TAG' fails SemVer compliance."
            exit 1
          fi
          echo "### 🏷️ Verified Version: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # 2. Security Audit
  # ----------------------------------------------------------
  security-audit:
    name: Security & SARIF Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  # ----------------------------------------------------------
  # 3. Static Code Analysis
  # ----------------------------------------------------------
  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Tools
        shell: pwsh
        run: choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Build CodeQL Target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir build-codeql -ErrorAction SilentlyContinue
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-codeql --config Release --parallel

      - uses: github/codeql-action/analyze@v3

  # ----------------------------------------------------------
  # 4. Free Production Build & Self-Signed Protection
  # ----------------------------------------------------------
  build-production:
    name: Build & Free Code Signing
    needs: [security-audit, codeql-analysis]
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      build-version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Versioning Strategy
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: voidone-msvc-${{ github.sha }}
          restore-keys: voidone-msvc-
          variant: ccache
          max-size: 1000M

      - name: Setup Toolchain (NSIS, WiX v4 & Dotnet)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nsis dotnet-8.0-sdk -y --no-progress
          dotnet tool install --global wix --ignore-failed-sources || dotnet tool update --global wix
          wix eula accept "wix4" -ErrorAction SilentlyContinue
          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.Firewall.wixext

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir build -ErrorAction SilentlyContinue
          
          $ltoFlag = if ("${{ inputs.enable_lto }}" -eq "false") { "OFF" } else { "ON" }
          
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=$ltoFlag `
            -DVOIDONE_VERSION_OVERRIDE="${{ steps.version.outputs.value }}" `
            -DVOIDONE_BUILD_TESTS=${{ inputs.skip_tests && 'OFF' || 'ON' }} `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_EXE_LINKER_FLAGS="/NXCOMPAT /DYNAMICBASE /GUARD:CF /HIGHENTROPYVA /CETCOMPAT /DEBUG /OPT:REF /OPT:ICF"

      - name: Compile Optimized Engine
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Execute CTest Suite
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          if (Test-Path "tests\CMakeLists.txt") {
            ctest --test-dir build -C Release --output-on-failure --timeout 120
          }

      - name: Deployment Staging & Dynamic Qt Assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Path package, pdb-symbols -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package, pdb-symbols | Out-Null
          
          $exe = Get-ChildItem -Path build -Filter "$env:APP_NAME.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Error "CRITICAL: $env:APP_NAME.exe Build Failed!"; exit 1 }
          
          Copy-Item -Path $exe.FullName -Destination "package\$env:APP_NAME.exe" -Force
          
          Write-Host "Downloading Visual C++ Redistributable..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "package\VC_redist.x64.exe"

          Get-ChildItem -Path build -Filter "*.pdb" -Recurse | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "pdb-symbols\" -Force
          }

          windeployqt --release `
            --compiler-runtime `
            --no-translations `
            --qmldir "$($env:GITHUB_WORKSPACE)/ui" `
            --qmldir "$($env:GITHUB_WORKSPACE)/src" `
            "package\$env:APP_NAME.exe"

      # 🔑 امضای رایگان فایل اجرایی برنامه با نام شرکت VoidOne_app
      - name: Apply Free Self-Signed Certificate (Main App)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\CurrentUser\My -Subject "CN=$env:COMPANY_NAME" -Type CodeSigningCert
          Set-AuthenticodeSignature -FilePath "package\$env:APP_NAME.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"

      - name: Build Installers (NSIS EXE + WiX v4 MSI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # NSIS Packaging
          if (Test-Path "installer.nsi") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" /DREDIST_PATH="package\VC_redist.x64.exe" installer.nsi
            if (Test-Path "dist\VoidOne-Setup-x64.exe") {
              Move-Item -Path "dist\VoidOne-Setup-x64.exe" -Destination "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe" -Force
            }
          }

          # WiX v4 Packaging
          if (Test-Path "installer.wxs") {
            wix build installer.wxs `
              -ext WixToolset.UI.wixext `
              -ext WixToolset.Util.wixext `
              -ext WixToolset.Firewall.wixext `
              -o "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.msi"
          }

      # 🔑 امضای رایگان فایل‌های اینستالر
      - name: Apply Free Self-Signed Certificate (Installers)
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse | ForEach-Object {
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          }

      - name: Compress Archives, Free Auto-Update Manifest & Hashes
        shell: pwsh
        run: |
          $zipName = "VoidOne-Windows-x64-Portable-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path package\* -DestinationPath $zipName -CompressionLevel Optimal
          
          $pdbZip = "VoidOne-Windows-x64-Symbols-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path pdb-symbols\* -DestinationPath $pdbZip -CompressionLevel Optimal

          # چک‌سام‌ها
          Get-ChildItem -Path . -Filter "*.zip" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem -Path dist -Filter "*.*" -Include "*.exe","*.msi" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

          # سیستم آپدیت رایگان (لینک به GitHub Releases)
          $updateManifest = @{
            version = "${{ steps.version.outputs.value }}"
            releaseDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe"
            sha256 = (Get-FileHash "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe" -Algorithm SHA256).Hash
          } | ConvertTo-Json
          $updateManifest | Out-File -FilePath "dist\appcast.json" -Encoding utf8

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: package/
          format: 'spdx-json'
          output-file: 'VoidOne-SBOM-${{ steps.version.outputs.value }}.spdx.json'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-Windows-Release
          path: |
            VoidOne-Windows-x64-*.zip*
            VoidOne-SBOM-*.spdx.json
            dist/*.*
          retention-days: 30

  # ----------------------------------------------------------
  # 5. Publishing & SLSA Attestation
  # ----------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: [build-production]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: VoidOne-Windows-Release
          path: release-files

      - name: Generate SLSA Provenance Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-files/*'

      - name: Determine Changelog
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="${{ github.ref_name }}" 2>/devnull || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"• %s (%h)" | head -n 15)
          else
            LOG="• Initial Release Build"
          fi

          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VoidOne ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/**

      - name: Discord Webhook Notification
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGELOG: ${{ steps.meta.outputs.log }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          PAYLOAD=$(jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg avatar "${{ github.event.sender.avatar_url }}" \
            --arg changelog "$CHANGELOG" \
            --arg url "https://github.com/${{ github.repository }}/releases" \
            '{
              username: "VoidOne CI Engine",
              embeds: [{
                title: ("🚀 VoidOne " + $tag + " Released!"),
                url: $url,
                description: "Built, Self-Signed, and Hosted Free via GitHub Infrastructure.",
                color: 5814783,
                author: { name: $actor, icon_url: $avatar },
                fields: [
                  { name: "🏷️ Tag", value: $tag, inline: true },
                  { name: "🔑 Code Signing", value: "Self-Signed Cert Included", inline: true },
                  { name: "📝 Changelog", value: $changelog }
                ]
              }]
            }')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
