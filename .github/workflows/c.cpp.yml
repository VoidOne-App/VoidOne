name: VoidOne CI/CD

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Emergency-only: skip CTest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voidone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  QT_VERSION: '6.8.3'
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  workflow-validation:
    name: Contract Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Python tooling
        run: python -m compileall -q scripts
      - name: Validate workflow contract
        run: python -c "from pathlib import Path; from scripts.validation.workflow_validator import validate_workflow; ok,msg=validate_workflow(Path('.')); print(msg); raise SystemExit(0 if ok else 1)"
      - name: Validate package / installer contract
        run: python -c "from pathlib import Path; from scripts.validation.package_validator import validate_package; ok,msg=validate_package(Path('.')); print(msg); raise SystemExit(0 if ok else 1)"
      - name: Validate release identity
        shell: bash
        run: |
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            [[ '${{ github.ref_name }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo 'Release tag is not valid semantic-version form: ${{ github.ref_name }}'
              exit 1
            }
          fi
          echo '## Contract Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Workflow: **validated**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Packaging contracts: **validated**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Release identity: **validated**' >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: Security + Static Analysis
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
      - name: Install analysis tools
        shell: pwsh
        run: choco install ninja cppcheck -y --no-progress
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Configure analysis build
        shell: pwsh
        run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOIDONE_BUILD_TESTS=ON
      - name: Build analysis target
        shell: pwsh
        run: cmake --build build-codeql --config Release --parallel
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp
      - name: Run Cppcheck
        shell: pwsh
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --xml --xml-version=2 src/ 2> cppcheck-report.xml
      - name: Upload static-analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report-${{ github.run_id }}
          path: cppcheck-report.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Write security summary
        if: always()
        shell: pwsh
        run: |
          "## Security & Static Analysis" >> $env:GITHUB_STEP_SUMMARY
          "- CodeQL: **completed**" >> $env:GITHUB_STEP_SUMMARY
          "- Cppcheck: **$('${{ job.status }}')**" >> $env:GITHUB_STEP_SUMMARY

  build-package:
    name: Windows Build + Test + Release Artifacts
    needs: [workflow-validation, static-analysis]
    if: needs.workflow-validation.result == 'success' && needs.static-analysis.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      tests: ${{ steps.test-mode.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^v','' }
          else { $v = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))" }
          "value=$v" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "## Build Identity" >> $env:GITHUB_STEP_SUMMARY
          "- Version: **$v**" >> $env:GITHUB_STEP_SUMMARY
          "- Ref: **${{ github.ref_name }}**" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: `${{ github.sha }}`" >> $env:GITHUB_STEP_SUMMARY
          "- Runner: `${{ runner.os }} / ${{ runner.arch }}`" >> $env:GITHUB_STEP_SUMMARY
          "- Qt: `${{ env.QT_VERSION }}`" >> $env:GITHUB_STEP_SUMMARY
      - name: Resolve test policy
        id: test-mode
        shell: pwsh
        run: |
          $mode = if ('${{ inputs.skip_tests }}' -eq 'true') { 'SKIPPED_EMERGENCY' } else { 'ENABLED' }
          "value=$mode" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "- Test policy: **$mode**" >> $env:GITHUB_STEP_SUMMARY
      - name: Install build and packaging tools
        shell: pwsh
        run: choco install ninja nsis dotnet-8.0-sdk -y --no-progress
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0 --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix --version 7.0.0 }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          "${env:USERPROFILE}\.dotnet\tools" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g WixToolset.UI.wixext/7.0.0
          wix extension add -g WixToolset.Util.wixext/7.0.0
          wix eula accept wix7
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
      - name: Configure C++/Qt
        shell: pwsh
        run: |
          $tests = if ('${{ inputs.skip_tests }}' -eq 'true') { 'OFF' } else { 'ON' }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DVOIDONE_VERSION_OVERRIDE='${{ steps.version.outputs.value }}' `
            -DVOIDONE_BUILD_TESTS=$tests
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'VoidOne C++ build failed.' }
      - name: Test
        if: ${{ inputs.skip_tests != true }}
        shell: pwsh
        run: |
          if (Test-Path 'tests\CMakeLists.txt') {
            ctest --test-dir build -C Release --output-on-failure --timeout 120 --output-junit test-results.xml
          } else {
            Write-Host 'No tests/CMakeLists.txt; compile validation completed.'
          }
      - name: Upload test results
        if: always() && hashFiles('build/test-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Stage Qt runtime
        shell: pwsh
        run: |
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item package -ItemType Directory -Force | Out-Null
          $exe = Get-ChildItem build -Filter "$env:APP_NAME.exe" -Recurse | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Select-Object -First 1
          if (-not $exe) { throw 'VoidOne.exe was not produced by CMake.' }
          Copy-Item $exe.FullName "package\$env:APP_NAME.exe"
          $qmlDir = Join-Path $env:GITHUB_WORKSPACE 'src\ui\qml'
          if (Test-Path $qmlDir) {
            windeployqt --release --compiler-runtime --no-translations --qmldir $qmlDir "package\$env:APP_NAME.exe"
          } else {
            windeployqt --release --compiler-runtime --no-translations "package\$env:APP_NAME.exe"
          }
          if (-not (Test-Path 'package\platforms\qwindows.dll')) { throw 'windeployqt did not produce qwindows.dll.' }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          makensis /V2 /DVERSION='${{ steps.version.outputs.value }}' installer.nsi
          if (-not (Test-Path 'dist\VoidOne-Setup-x64.exe')) { throw 'NSIS installer was not produced.' }
      - name: Build WiX MSI
        shell: pwsh
        run: |
          wix build installer.wxs -dProductVersion='${{ steps.version.outputs.value }}' -o 'dist\VoidOne-Setup-x64.msi' -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -acceptEula wix7
          if (-not (Test-Path 'dist\VoidOne-Setup-x64.msi')) { throw 'WiX MSI was not produced.' }
      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'package\*' -DestinationPath 'dist\VoidOne-Portable-x64.zip' -CompressionLevel Optimal
          if (-not (Test-Path 'dist\VoidOne-Portable-x64.zip')) { throw 'Portable ZIP was not produced.' }
      - name: Validate generated artifacts
        shell: pwsh
        run: |
          $items = @('dist\VoidOne-Setup-x64.exe','dist\VoidOne-Setup-x64.msi','dist\VoidOne-Portable-x64.zip')
          foreach ($item in $items) {
            if (-not (Test-Path $item)) { throw "Missing artifact: $item" }
            if ((Get-Item $item).Length -le 0) { throw "Empty artifact: $item" }
          }
          Expand-Archive -Path 'dist\VoidOne-Portable-x64.zip' -DestinationPath 'zip-check' -Force
          if (-not (Test-Path 'zip-check\VoidOne.exe')) { throw 'Portable ZIP does not contain VoidOne.exe at its root.' }
          if (-not (Test-Path 'package\platforms\qwindows.dll')) { throw 'Portable package is missing Qt Windows platform plugin.' }
          "## Artifact Verification" >> $env:GITHUB_STEP_SUMMARY
          foreach ($item in Get-Item dist\*) {
            "- **$($item.Name)** — $([math]::Round($item.Length / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
          }
          "- Portable root: **VoidOne.exe present**" >> $env:GITHUB_STEP_SUMMARY
          "- Qt platform plugin: **qwindows.dll present**" >> $env:GITHUB_STEP_SUMMARY
      - name: Generate deterministic SHA256 manifest
        shell: pwsh
        run: |
          $files = @(
            'dist\VoidOne-Setup-x64.exe',
            'dist\VoidOne-Setup-x64.msi',
            'dist\VoidOne-Portable-x64.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Sort-Object | Set-Content dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt
      - name: Generate CI release manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            product = $env:APP_NAME
            version = '${{ steps.version.outputs.value }}'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref_name }}'
            qt = $env:QT_VERSION
            runner = '${{ runner.os }}-${{ runner.arch }}'
            test_policy = '${{ steps.test-mode.outputs.value }}'
            artifacts = @(
              'VoidOne-Setup-x64.exe',
              'VoidOne-Setup-x64.msi',
              'VoidOne-Portable-x64.zip'
            )
            generated_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist\release-manifest.json -Encoding utf8
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-windows-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Setup-x64.msi
            dist/VoidOne-Portable-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-release-metadata-${{ github.run_id }}
          path: |
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Setup-x64.msi
            dist/VoidOne-Portable-x64.zip
      - name: Final build summary
        if: always()
        shell: pwsh
        run: |
          "## VoidOne Release Engineering" >> $env:GITHUB_STEP_SUMMARY
          "- Job status: **${{ job.status }}**" >> $env:GITHUB_STEP_SUMMARY
          "- Version: **${{ steps.version.outputs.value }}**" >> $env:GITHUB_STEP_SUMMARY
          "- Tests: **${{ steps.test-mode.outputs.value }}**" >> $env:GITHUB_STEP_SUMMARY
          "- Provenance: **$([bool]('${{ github.event_name != 'pull_request' }}'))**" >> $env:GITHUB_STEP_SUMMARY
          "- Artifacts: **EXE + MSI + Portable ZIP**" >> $env:GITHUB_STEP_SUMMARY

  release-gate:
    name: Release Readiness Gate
    needs: [workflow-validation, static-analysis, build-package]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate release gates
        shell: bash
        run: |
          echo '## Release Readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '| Gate | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo '| Contract validation | **${{ needs.workflow-validation.result }}** |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Security/static analysis | **${{ needs.static-analysis.result }}** |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Windows build/package | **${{ needs.build-package.result }}** |' >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ needs.workflow-validation.result }}' != 'success' || '${{ needs.static-analysis.result }}' != 'success' || '${{ needs.build-package.result }}' != 'success' ]]; then
            echo 'Release gate blocked: one or more mandatory gates failed.'
            exit 1
          fi
          echo 'Release gate: READY.'

  discord-notification:
    name: Discord CI Status
    needs: [workflow-validation, static-analysis, build-package, release-gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish CI result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VALIDATION_RESULT: ${{ needs.workflow-validation.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          BUILD_RESULT: ${{ needs.build-package.result }}
          RELEASE_RESULT: ${{ needs.release-gate.result }}
          TEST_POLICY: ${{ needs.build-package.outputs.tests }}
          VERSION: ${{ needs.build-package.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          webhook = os.environ.get('DISCORD_WEBHOOK_URL', '').strip()
          if not webhook:
              print('DISCORD_WEBHOOK_URL is not configured; skipping Discord notification.')
              raise SystemExit(0)

          results = {
              'Contracts': os.environ.get('VALIDATION_RESULT', 'unknown'),
              'Security / static': os.environ.get('STATIC_RESULT', 'unknown'),
              'Windows build/package': os.environ.get('BUILD_RESULT', 'unknown'),
              'Release gate': os.environ.get('RELEASE_RESULT', 'not-applicable'),
          }

          values = list(results.values())
          if all(v in ('success', 'skipped', 'not-applicable') for v in values) and 'failure' not in values:
              status = 'SUCCESS'
              title = '🟢 VoidOne CI/CD — Pipeline Healthy'
              color = 0x2ECC71
          elif 'cancelled' in values:
              status = 'CANCELLED'
              title = '🟡 VoidOne CI/CD — Pipeline Cancelled'
              color = 0xF1C40F
          else:
              status = 'FAILED'
              title = '🔴 VoidOne CI/CD — Pipeline Failed'
              color = 0xE74C3C

          def fmt(value):
              return f'`{value}`'

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          server = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          run_url = f"{server}/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          ref = os.environ.get('GITHUB_REF_NAME', '')
          sha = os.environ.get('GITHUB_SHA', '')[:7]
          version = os.environ.get('VERSION', '') or 'n/a'
          test_policy = os.environ.get('TEST_POLICY', '') or 'unknown'

          fields = [
              {'name': name, 'value': fmt(value), 'inline': True}
              for name, value in results.items()
          ]
          fields.extend([
              {'name': 'Version', 'value': fmt(version), 'inline': True},
              {'name': 'Ref', 'value': fmt(ref), 'inline': True},
              {'name': 'Commit', 'value': fmt(sha), 'inline': True},
              {'name': 'Tests', 'value': fmt(test_policy), 'inline': True},
              {'name': 'Run', 'value': f"[#{os.environ.get('GITHUB_RUN_NUMBER', '')}]({run_url})", 'inline': True},
          ])

          payload = {
              'username': 'VoidOne CI',
              'allowed_mentions': {'parse': []},
              'embeds': [{
                  'title': title,
                  'description': f'**{status}** — Enterprise Windows Release Pipeline',
                  'color': color,
                  'fields': fields,
                  'url': run_url,
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'footer': {'text': 'VoidOne • GitHub Actions • No telemetry'},
              }],
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'VoidOne-CI/1.0'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status >= 300:
                      raise RuntimeError(f'Discord returned HTTP {response.status}')
              print(f'Discord notification sent: {status}')
          except (urllib.error.URLError, RuntimeError) as exc:
              print(f'Discord notification failed but CI status will remain authoritative: {exc}')
          PY
