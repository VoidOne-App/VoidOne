name: VoidOne CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.2'
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne

jobs:
  build:
    name: Windows Build + Test + Package
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'

      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nsis -y --no-progress

          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsisDir 'makensis.exe'

          if (-not (Test-Path $makensis -PathType Leaf)) {
            throw "NSIS compiler was not found at: $makensis"
          }

          # Chocolatey may update PATH after the current PowerShell process starts.
          # Update this process and persist the directory for all later GitHub Actions steps.
          $env:Path = "$nsisDir;$env:Path"
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "NSIS directory: $nsisDir"
          Write-Host "NSIS compiler: $makensis"
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS version check failed: $LASTEXITCODE" }

          ninja --version
          cmake --version

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}' -replace '^v',''
          } else {
            $version = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid version: $version"
          }
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "## Build" >> $env:GITHUB_STEP_SUMMARY
          "- Version: **$version**" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @(
            '-S', '.', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DVOIDONE_BUILD_TESTS=ON',
            '-DVOIDONE_GENERATE_INSTALLER=OFF',
            '-DVOIDONE_VERSION_OVERRIDE:STRING=${{ steps.version.outputs.value }}'
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Deploy Qt runtime for tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testBinaries = Get-ChildItem 'build' -Recurse -Filter 'voidone_*_tests.exe' -File |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' }
          if (-not $testBinaries) {
            Write-Host 'Built files matching voidone_*_tests.exe:'
            Get-ChildItem 'build' -Recurse -Filter '*.exe' -File |
              Select-Object -ExpandProperty FullName
            throw 'No test executables were produced.'
          }
          foreach ($test in $testBinaries) {
            Write-Host "Deploying Qt runtime for $($test.FullName)"
            & windeployqt --release --no-translations --no-compiler-runtime $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $($test.Name): $LASTEXITCODE" }
          }
          $sqlitePlugin = Get-ChildItem 'build' -Recurse -Filter 'qsqlite.dll' -File |
            Select-Object -First 1
          if (-not $sqlitePlugin) { throw 'Qt QSQLITE plugin was not deployed for the database tests.' }

      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_PLUGIN_PATH = "$env:GITHUB_WORKSPACE\build;$env:QT_ROOT_DIR\plugins"
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_LOGGING_RULES = 'qt.sql.*=true'

          Write-Host "QT_PLUGIN_PATH=$env:QT_PLUGIN_PATH"
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host 'Checking deployed SQLite plugin:'
          Get-Item (Join-Path $env:GITHUB_WORKSPACE 'build\sqldrivers\qsqlite.dll') | Select-Object FullName,Length,LastWriteTime

          Write-Host 'Running database tests with QTest file logging.'
          $databaseTests = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build\voidone_database_tests.exe'),
            (Join-Path $env:GITHUB_WORKSPACE 'build\voidone_database_lifecycle_tests.exe')
          )
          foreach ($test in $databaseTests) {
            Write-Host "===== $test ====="
            $log = Join-Path $env:RUNNER_TEMP ((Split-Path $test -Leaf) + '.qtest.log')
            Remove-Item $log -Force -ErrorAction SilentlyContinue

            & $test '-v2' '-o' "$log,txt"
            $exitCode = $LASTEXITCODE

            Write-Host "Exit code: $exitCode"
            Write-Host '----- QTest log -----'
            if (Test-Path $log) {
              Get-Content $log
            } else {
              Write-Host 'QTest did not create a log file.'
            }

            if ($exitCode -ne 0) {
              Write-Host '----- Executable diagnostics -----'
              Get-Item $test | Select-Object FullName,Length,LastWriteTime
              throw "Database test failed: $test (exit code $exitCode)"
            }
          }

          Write-Host 'Running full CTest suite.'
          & ctest --test-dir build -C Release --output-on-failure --timeout 120 --verbose
          if ($LASTEXITCODE -ne 0) { throw "CTest failed: $LASTEXITCODE" }

      - name: Stage application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item package, dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item package, dist -ItemType Directory -Force | Out-Null
          $exe = Get-ChildItem build -Filter 'VoidOne.exe' -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
            Select-Object -First 1
          if (-not $exe) { throw 'VoidOne.exe was not produced.' }
          Copy-Item $exe.FullName 'package\VoidOne.exe'
          $qml = Join-Path $env:GITHUB_WORKSPACE 'src\ui\qml'
          if (Test-Path $qml) {
            & windeployqt --release --compiler-runtime --no-translations --qmldir $qml 'package\VoidOne.exe'
          } else {
            & windeployqt --release --compiler-runtime --no-translations 'package\VoidOne.exe'
          }
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          if (-not (Test-Path 'package\platforms\qwindows.dll')) { throw 'Qt Windows platform plugin is missing.' }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & makensis /V2 /DVERSION='${{ steps.version.outputs.value }}' installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed: $LASTEXITCODE" }
          if (-not (Test-Path 'dist\VoidOne-Setup-x64.exe')) { throw 'Installer was not produced.' }

      - name: Sign release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Host 'Signing secrets are not configured. Skipping code signing.'
            exit 0
          }
          $timestamp = $env:SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) { $timestamp = 'http://timestamp.digicert.com' }
          $pfx = Join-Path $env:RUNNER_TEMP 'voidone-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
          if (-not $cert) { throw 'Failed to import signing certificate.' }
          foreach ($target in @('package\VoidOne.exe', 'dist\VoidOne-Setup-x64.exe')) {
            & signtool sign /sha1 $cert.Thumbprint /fd SHA256 /tr $timestamp /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target: $LASTEXITCODE" }
            & signtool verify /pa /all $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $target: $LASTEXITCODE" }
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'package\*' -DestinationPath 'dist\VoidOne-Portable-x64.zip' -CompressionLevel Optimal
          if ($LASTEXITCODE -ne 0) { throw "ZIP creation failed: $LASTEXITCODE" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VoidOne-${{ steps.version.outputs.value }}
          path: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Portable-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Discord notification
        if: always() && (job.status != 'success' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK)) { exit 0 }
          $status = '${{ job.status }}'
          $event = '${{ github.event_name }}'
          $ref = '${{ github.ref_name }}'
          $sha = '${{ github.sha }}'.Substring(0,7)
          $repo = '${{ github.repository }}'
          $runUrl = "https://github.com/$repo/actions/runs/${{ github.run_id }}"
          switch ($status) {
            'success' { $title = '✅ VoidOne CI — Build Successful'; $description = 'Windows build, tests, and packaging completed successfully.' }
            'failure' { $title = '❌ VoidOne CI — Build Failed'; $description = 'The CI pipeline failed. Check the workflow logs for details.' }
            'cancelled' { $title = '⚠️ VoidOne CI — Build Cancelled'; $description = 'The CI run was cancelled before completion.' }
            default { $title = 'ℹ️ VoidOne CI — Build Update'; $description = "CI finished with status: $status" }
          }
          $payload = @{
            username = 'VoidOne CI'
            embeds = @(@{
              title = $title
              description = $description
              fields = @(
                @{ name = 'Branch / Tag'; value = ('`' + $ref + '`'); inline = $true }
                @{ name = 'Commit'; value = ('`' + $sha + '`'); inline = $true }
                @{ name = 'Event'; value = ('`' + $event + '`'); inline = $true }
              )
              url = $runUrl
              footer = @{ text = 'VoidOne • GitHub Actions' }
              timestamp = [DateTime]::UtcNow.ToString('o')
            })
          } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
