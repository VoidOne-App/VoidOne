name: VoidOne CI/CD

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Emergency-only: skip CTest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voidone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.0'
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne

jobs:
  workflow-validation:
    name: Validate CI / Package Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Python tooling
        run: python -m compileall -q scripts
      - name: Validate workflow contract
        run: python -c "from pathlib import Path; from scripts.validation.workflow_validator import validate_workflow; ok,msg=validate_workflow(Path('.')); print(msg); raise SystemExit(0 if ok else 1)"
      - name: Validate package / installer contract
        run: python -c "from pathlib import Path; from scripts.validation.package_validator import validate_package; ok,msg=validate_package(Path('.')); print(msg); raise SystemExit(0 if ok else 1)"

  static-analysis:
    name: CodeQL + Cppcheck
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
      - name: Install analysis tools
        shell: pwsh
        run: choco install ninja cppcheck -y --no-progress
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOIDONE_BUILD_TESTS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build-codeql --config Release --parallel
      - uses: github/codeql-action/analyze@v3
      - name: Cppcheck
        shell: pwsh
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --xml --xml-version=2 src/ 2> cppcheck-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report-${{ github.run_id }}
          path: cppcheck-report.xml
          if-no-files-found: ignore
          retention-days: 14

  build-package:
    name: Build + Test + EXE/MSI/ZIP
    needs: [workflow-validation, static-analysis]
    if: needs.workflow-validation.result == 'success' && needs.static-analysis.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^v','' }
          else { $v = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))" }
          "value=$v" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install build and packaging tools
        shell: pwsh
        run: choco install ninja nsis dotnet-8.0-sdk -y --no-progress
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix }
          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Util.wixext
          wix eula accept wix
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false
      - name: Configure C++/Qt
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DVOIDONE_VERSION_OVERRIDE='${{ steps.version.outputs.value }}' `
            -DVOIDONE_BUILD_TESTS=${{ inputs.skip_tests && 'OFF' || 'ON' }}
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          if (Test-Path 'tests\CMakeLists.txt') { ctest --test-dir build -C Release --output-on-failure --timeout 120 }
          else { Write-Host 'No tests/CMakeLists.txt; compile validation completed.' }
      - name: Stage Qt runtime
        shell: pwsh
        run: |
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item package -ItemType Directory -Force | Out-Null
          $exe = Get-ChildItem build -Filter "$env:APP_NAME.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'VoidOne.exe was not produced by CMake.' }
          Copy-Item $exe.FullName "package\$env:APP_NAME.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir "$env:GITHUB_WORKSPACE\src" "package\$env:APP_NAME.exe"
          if (-not (Test-Path "package\platforms\qwindows.dll")) { throw 'windeployqt did not produce qwindows.dll.' }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          makensis /V2 /DVERSION='${{ steps.version.outputs.value }}' installer.nsi
          if (-not (Test-Path 'dist\VoidOne-Setup-x64.exe')) { throw 'NSIS installer was not produced.' }
      - name: Build WiX MSI
        shell: pwsh
        run: |
          wix build installer.wxs -dProductVersion='${{ steps.version.outputs.value }}' -o 'dist\VoidOne-Setup-x64.msi' -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext
          if (-not (Test-Path 'dist\VoidOne-Setup-x64.msi')) { throw 'WiX MSI was not produced.' }
      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'package\*' -DestinationPath 'dist\VoidOne-Portable-x64.zip' -CompressionLevel Optimal
          if (-not (Test-Path 'dist\VoidOne-Portable-x64.zip')) { throw 'Portable ZIP was not produced.' }
      - name: Validate generated artifacts
        shell: pwsh
        run: |
          $items = @('dist\VoidOne-Setup-x64.exe','dist\VoidOne-Setup-x64.msi','dist\VoidOne-Portable-x64.zip')
          foreach ($item in $items) { if (-not (Test-Path $item)) { throw "Missing artifact: $item" }; if ((Get-Item $item).Length -le 0) { throw "Empty artifact: $item" } }
          Expand-Archive -Path 'dist\VoidOne-Portable-x64.zip' -DestinationPath 'zip-check' -Force
          if (-not (Test-Path 'zip-check\VoidOne.exe')) { throw 'Portable ZIP does not contain VoidOne.exe at its root.' }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-windows-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Setup-x64.msi
            dist/VoidOne-Portable-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          Get-FileHash dist\* -Algorithm SHA256 | Format-Table -AutoSize | Out-File dist\SHA256SUMS.txt
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-checksums-${{ github.run_id }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/VoidOne-Setup-x64.exe
            dist/VoidOne-Setup-x64.msi
            dist/VoidOne-Portable-x64.zip
