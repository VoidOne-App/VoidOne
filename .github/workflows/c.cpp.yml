name: VoidOne CI/CD

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "⚡ Emergency Mode: Skip CTest Suite"
        type: boolean
        default: false
      enable_lto:
        description: "🔥 Enable Link-Time Optimization (LTO/LTCG)"
        type: boolean
        default: true
      build_docs:
        description: "📚 Generate & Deploy Doxygen API Docs"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  security-events: write
  attestations: write

concurrency:
  group: voidone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.0"
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne
  COMPANY_NAME: VoidOne_app

jobs:

  governance:
    name: 🛡️ Enterprise Governance & SemVer Check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Validate Semantic Versioning
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$TAG' violates SemVer compliance rules!"
            exit 1
          fi

          echo "### 🏷️ Verified Enterprise Release Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"


  code-quality:
    name: 🔬 Deep C++ Static Analysis (Cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Cppcheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Execute Cppcheck Audit
        shell: bash
        run: |
          set -o pipefail

          TARGETS=()

          for DIR in src ui include; do
            if [ -d "$DIR" ]; then
              TARGETS+=("$DIR")
            fi
          done

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "No C++ source directories found. Skipping Cppcheck."
            printf "No source directories found.\n" > cppcheck_report.txt
            exit 0
          fi

          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --error-exitcode=0 \
            --template='[{severity}][{id}] {message} {callstack} (at {file}:{line})' \
            "${TARGETS[@]}" 2>&1 | tee cppcheck_report.txt

      - name: Upload Quality Report
        uses: actions/upload-artifact@v4
        with:
          name: Cppcheck-Quality-Report
          path: cppcheck_report.txt


  security-audit:
    name: 🔒 Zero-Trust Security Audit (CodeQL)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Compile Target for Security Scan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build-codeql") {
            Remove-Item "build-codeql" -Recurse -Force
          }

          cmake -S . -B build-codeql -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-codeql `
            --config Release `
            --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  build-production:
    name: ⚙️ Build Engine, Packaging & Sign (MSVC 2022)
    needs:
      - code-quality
      - security-audit

    runs-on: windows-2025
    timeout-minutes: 50

    outputs:
      build-version: ${{ steps.version.outputs.value }}
      build-duration: ${{ steps.telemetry.outputs.duration }}
      sha256-exe: ${{ steps.hashes.outputs.exe_sha256 }}

    steps:

      - name: Start Telemetry Clock
        id: telemetry_start
        shell: pwsh
        run: |
          $startTime = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "start_time=$startTime" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Calculate Versioning
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace "^v", ""
          }
          else {
            $ver = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }

          "value=$ver" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: voidone-msvc-${{ github.sha }}
          restore-keys: voidone-msvc-
          variant: ccache
          max-size: 2000M

      - name: Setup Full Enterprise Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja nsis dotnet-8.0-sdk doxygen.install `
            -y `
            --no-progress

          dotnet tool install --global wix --ignore-failed-sources

          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global wix
          }

          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          wix --version

          # WiX v7 requires explicit EULA acceptance.
          # The environment variable WIX_ACCEPT_OSMF_EULA
          # does NOT satisfy WIX7015.
          wix eula accept wix7

          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.Firewall.wixext

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Configure CMake Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          $ltoFlag = "ON"

          if ("${{ inputs.enable_lto }}" -eq "false") {
            $ltoFlag = "OFF"
          }

          $buildTests = "ON"

          if ("${{ inputs.skip_tests }}" -eq "true") {
            $buildTests = "OFF"
          }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=$ltoFlag `
            -DVOIDONE_VERSION_OVERRIDE="${{ steps.version.outputs.value }}" `
            -DVOIDONE_BUILD_TESTS=$buildTests `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_EXE_LINKER_FLAGS="/NXCOMPAT /DYNAMICBASE /GUARD:CF /HIGHENTROPYVA /CETCOMPAT /DEBUG /OPT:REF /OPT:ICF"

      - name: Build C++ Binary Outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build `
            --config Release `
            --parallel

      - name: Run Test Suite (CTest)
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests\CMakeLists.txt") {
            ctest `
              --test-dir build `
              -C Release `
              --output-on-failure `
              --timeout 120
          }
          else {
            Write-Host "No tests/CMakeLists.txt found. Skipping CTest."
          }

      - name: Deploy Dependencies & PDB Symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            -Path "package", "pdb-symbols" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "package", "pdb-symbols" | Out-Null

          $exe = Get-ChildItem `
            -Path "build" `
            -Filter "$env:APP_NAME.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find $env:APP_NAME.exe in build output."
          }

          Copy-Item `
            -Path $exe.FullName `
            -Destination "package\$env:APP_NAME.exe" `
            -Force

          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "package\VC_redist.x64.exe"

          Get-ChildItem `
            -Path "build" `
            -Filter "*.pdb" `
            -Recurse |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "pdb-symbols\" `
                -Force
            }

          $qmlArgs = @()

          foreach ($dir in @("ui", "src")) {
            $fullPath = Join-Path $env:GITHUB_WORKSPACE $dir

            if (Test-Path $fullPath) {
              $qmlArgs += @("--qmldir", $fullPath)
            }
          }

          & windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            @qmlArgs `
            "package\$env:APP_NAME.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE."
          }

      - name: Apply Self-Signed Code Certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cert = New-SelfSignedCertificate `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Subject "CN=$env:COMPANY_NAME" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
            )

          $signature = Set-AuthenticodeSignature `
            -FilePath "package\$env:APP_NAME.exe" `
            -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com"

          Write-Host "Signature status: $($signature.Status)"

      - name: Create Multi-Format Installers (EXE & MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist" | Out-Null

          if (Test-Path "installer.nsi") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" `
              /DREDIST_PATH="package\VC_redist.x64.exe" `
              "installer.nsi"

            if ($LASTEXITCODE -ne 0) {
              throw "NSIS installer build failed with exit code $LASTEXITCODE."
            }

            if (Test-Path "dist\VoidOne-Setup-x64.exe") {
              Move-Item `
                -Path "dist\VoidOne-Setup-x64.exe" `
                -Destination "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe" `
                -Force
            }
          }

          if (Test-Path "Package.wxs") {
            wix build `
              -acceptEula wix7 `
              "Package.wxs" `
              -d ProductVersion=${{ steps.version.outputs.value }}.0 `
              -ext WixToolset.UI.wixext `
              -ext WixToolset.Util.wixext `
              -ext WixToolset.Firewall.wixext `
              -o "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.msi"

            if ($LASTEXITCODE -ne 0) {
              throw "WiX installer build failed with exit code $LASTEXITCODE."
            }
          }

      - name: Sign Installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cert = Get-ChildItem `
            -Path "Cert:\CurrentUser\My" `
            -CodeSigningCert |
            Select-Object -First 1

          if (-not $cert) {
            throw "Code-signing certificate was not found."
          }

          Get-ChildItem `
            -Path "dist" `
            -Include "*.exe", "*.msi" `
            -Recurse |
            ForEach-Object {

              $signature = Set-AuthenticodeSignature `
                -FilePath $_.FullName `
                -Certificate $cert `
                -TimestampServer "http://timestamp.digicert.com"

              Write-Host "$($_.Name): $($signature.Status)"
            }

      - name: Generate Multi-Package Manager Manifests
        id: hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exePath = "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe"

          if (Test-Path $exePath) {
            $hash = (
              Get-FileHash `
                -Path $exePath `
                -Algorithm SHA256
            ).Hash
          }
          else {
            $hash = "HASH_PLACEHOLDER"
          }

          "exe_sha256=$hash" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

          $winget = @"
PackageIdentifier: VoidOneApp.VoidOne
PackageVersion: ${{ steps.version.outputs.value }}
PackageName: VoidOne Engine
Publisher: VoidOne_app
License: MIT
ShortDescription: High-Performance Enterprise VoidOne Engine
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe
    InstallerSha256: $hash
    InstallerType: nullsoft
ManifestType: singleton
ManifestVersion: 1.4.0
"@

          $winget | Out-File `
            -FilePath "dist\VoidOne.winget.yaml" `
            -Encoding utf8

          $scoop = @{
            version = "${{ steps.version.outputs.value }}"
            architecture = @{
              "64bit" = @{
                url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/VoidOne-Windows-x64-Portable-${{ steps.version.outputs.value }}.zip"
                hash = $hash
              }
            }
            bin = "VoidOne.exe"
            shortcuts = @(
              @("VoidOne.exe", "VoidOne Engine")
            )
          } | ConvertTo-Json -Depth 4

          $scoop | Out-File `
            -FilePath "dist\VoidOne.scoop.json" `
            -Encoding utf8

          $appcast = @{
            version = "${{ steps.version.outputs.value }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe"
            signature = $hash
          } | ConvertTo-Json

          $appcast | Out-File `
            -FilePath "dist\appcast.json" `
            -Encoding utf8

      - name: Compress Portables & Generate Hash Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "VoidOne-Windows-x64-Portable-${{ steps.version.outputs.value }}.zip" `
            -CompressionLevel Optimal `
            -Force

          Compress-Archive `
            -Path "pdb-symbols\*" `
            -DestinationPath "VoidOne-Windows-x64-Symbols-${{ steps.version.outputs.value }}.zip" `
            -CompressionLevel Optimal `
            -Force

          Get-ChildItem `
            -Path "." `
            -Filter "*.zip" |
            ForEach-Object {

              $h = (
                Get-FileHash `
                  -Path $_.FullName `
                  -Algorithm SHA256
              ).Hash

              "$h  $($_.Name)" | Out-File `
                -FilePath "$($_.FullName).sha256" `
                -Encoding ascii
            }

          Get-ChildItem `
            -Path "dist" `
            -Include "*.exe", "*.msi" `
            -Recurse |
            ForEach-Object {

              $h = (
                Get-FileHash `
                  -Path $_.FullName `
                  -Algorithm SHA256
              ).Hash

              "$h  $($_.Name)" | Out-File `
                -FilePath "$($_.FullName).sha256" `
                -Encoding ascii
            }

      - name: Generate CycloneDX / SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: package/
          format: spdx-json
          output-file: VoidOne-SBOM-${{ steps.version.outputs.value }}.spdx.json

      - name: Stop Telemetry Clock
        id: telemetry
        shell: pwsh
        run: |
          $endTime = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $startTime = [int64]$env:start_time

          $duration = $endTime - $startTime
          $min = [math]::Floor($duration / 60)
          $sec = $duration % 60

          "duration=${min}m ${sec}s" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      - name: Generate GitHub Step Summary Dashboard
        shell: pwsh
        run: |
          $summary = @"
# 🚀 VoidOne Supreme Build Dashboard

| Metric | Status / Value |
| :--- | :--- |
| ⏱️ **Build Duration** | `${{ steps.telemetry.outputs.duration }}` |
| 🏷️ **Engine Version** | `${{ steps.version.outputs.value }}` |
| 🔑 **Code Signing** | `Self-Signed RSA Code Signing Certificate` |
| 🛡️ **Security Audit** | `CodeQL + Cppcheck` |
| 📄 **Manifests Built** | `Winget, Scoop, WinUpdater (AppCast), SPDX SBOM` |

### 📦 Generated Release Artifacts & Hashes

```text
EXE SHA256 : ${{ steps.hashes.outputs.exe_sha256 }}