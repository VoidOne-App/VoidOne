name: VoidOne CI/CD

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "⚡ Emergency Mode: Skip CTest Suite"
        type: boolean
        default: false

      enable_lto:
        description: "🔥 Enable Link-Time Optimization (LTO/LTCG)"
        type: boolean
        default: true

      build_docs:
        description: "📚 Generate & Deploy Doxygen API Docs"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  security-events: write
  attestations: write

concurrency:
  group: voidone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.0"
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne
  COMPANY_NAME: VoidOne_app

jobs:

  # ============================================================
  # GOVERNANCE
  # ============================================================

  governance:
    name: 🛡️ Enterprise Governance & SemVer Check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Validate Semantic Versioning
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$TAG' violates SemVer compliance rules!"
            exit 1
          fi

          echo "### 🏷️ Verified Release Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # STATIC ANALYSIS
  # ============================================================

  code-quality:
    name: 🔬 Deep C++ Static Analysis (Cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Cppcheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Execute Cppcheck Audit
        shell: bash
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --error-exitcode=0 \
            --template='[{severity}][{id}] {message} {callstack} (at {file}:{line})' \
            src/ ui/ include/ 2>&1 | tee cppcheck_report.txt

      - name: Upload Quality Report
        uses: actions/upload-artifact@v4
        with:
          name: Cppcheck-Quality-Report
          path: cppcheck_report.txt


  # ============================================================
  # CODEQL SECURITY AUDIT
  # ============================================================

  security-audit:
    name: 🔒 Zero-Trust Security Audit (CodeQL)
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build-codeql -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Target for CodeQL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build-codeql `
            --config Release `
            --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # PRODUCTION BUILD
  # ============================================================

  build-production:
    name: ⚙️ Build Engine, Packaging & Sign (MSVC 2022)

    needs:
      - code-quality
      - security-audit

    runs-on: windows-2025
    timeout-minutes: 50

    outputs:
      build-version: ${{ steps.version.outputs.value }}
      build-duration: ${{ steps.telemetry.outputs.duration }}
      sha256-exe: ${{ steps.hashes.outputs.exe_sha256 }}

    steps:

      # ----------------------------------------------------------
      # TELEMETRY CLOCK
      # ----------------------------------------------------------

      - name: Start Build Clock
        id: telemetry_start
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "start_time=$start" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ----------------------------------------------------------
      # VERSION
      # ----------------------------------------------------------

      - name: Calculate Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          else {
            $version = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }

          "value=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append


      # ----------------------------------------------------------
      # CCACHE
      # ----------------------------------------------------------

      - name: Configure Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: voidone-msvc-${{ github.sha }}
          restore-keys: voidone-msvc-
          variant: ccache
          max-size: 2000M


      # ----------------------------------------------------------
      # TOOLCHAIN
      # ----------------------------------------------------------

      - name: Install Build & Packaging Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install `
            ninja `
            nsis `
            dotnet-8.0-sdk `
            doxygen.install `
            -y `
            --no-progress

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet tool install --global wix --ignore-failed-sources

          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global wix
          }

          wix --version

          # WiX v7 requires explicit OSMF EULA acceptance.
          wix eula accept wix7

          wix eula show

          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.Firewall.wixext


      # ----------------------------------------------------------
      # MSVC
      # ----------------------------------------------------------

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ----------------------------------------------------------
      # QT
      # ----------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt


      # ----------------------------------------------------------
      # CMAKE CONFIGURATION
      # ----------------------------------------------------------

      - name: Configure CMake Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $lto = "ON"

          if ("${{ inputs.enable_lto }}" -eq "false") {
            $lto = "OFF"
          }

          $buildTests = "ON"

          if ("${{ inputs.skip_tests }}" -eq "true") {
            $buildTests = "OFF"
          }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=$lto `
            -DVOIDONE_VERSION_OVERRIDE="${{ steps.version.outputs.value }}" `
            -DVOIDONE_BUILD_TESTS=$buildTests `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_EXE_LINKER_FLAGS="/NXCOMPAT /DYNAMICBASE /GUARD:CF /HIGHENTROPYVA /CETCOMPAT /DEBUG /OPT:REF /OPT:ICF"


      # ----------------------------------------------------------
      # BUILD
      # ----------------------------------------------------------

      - name: Build C++ Binary Outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build `
            --config Release `
            --parallel


      # ----------------------------------------------------------
      # TESTS
      # ----------------------------------------------------------

      - name: Run CTest Suite
        if: ${{ inputs.skip_tests != true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests\CMakeLists.txt") {
            ctest `
              --test-dir build `
              -C Release `
              --output-on-failure `
              --timeout 120
          }
          else {
            Write-Host "No tests/CMakeLists.txt found. Skipping CTest."
          }


      # ----------------------------------------------------------
      # DEPLOY QT + VC RUNTIME
      # ----------------------------------------------------------

      - name: Deploy Dependencies & PDB Symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            -Path package, pdb-symbols `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path package, pdb-symbols | Out-Null

          $exe = Get-ChildItem `
            -Path build `
            -Filter "$env:APP_NAME.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "VoidOne.exe was not found in the build output."
          }

          Copy-Item `
            -Path $exe.FullName `
            -Destination "package\$env:APP_NAME.exe" `
            -Force

          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "package\VC_redist.x64.exe"

          Get-ChildItem `
            -Path build `
            -Filter "*.pdb" `
            -Recurse |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "pdb-symbols\" `
                -Force
            }

          # 🔍 پیدا کردن خودکار تمام پوشه‌های حاوی فایل‌های QML
          $qmlDirs = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.qml" -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(build|package|dist|pdb-symbols|\.git)\\' } |
            Select-Object -ExpandProperty DirectoryName -Unique

          $qmlArgs = @()
          foreach ($dir in $qmlDirs) {
            $qmlArgs += "--qmldir"
            $qmlArgs += $dir
          }

          Write-Host "Detected QML Directories:"
          $qmlDirs | ForEach-Object { Write-Host " - $_" }

          windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            $qmlArgs `
            "package\$env:APP_NAME.exe"


      # ----------------------------------------------------------
      # CODE SIGNING
      # ----------------------------------------------------------

      - name: Apply Self-Signed Code Certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cert = New-SelfSignedCertificate `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Subject "CN=$env:COMPANY_NAME" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
            )

          Set-AuthenticodeSignature `
            -FilePath "package\$env:APP_NAME.exe" `
            -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com"


      # ----------------------------------------------------------
      # INSTALLERS
      # ----------------------------------------------------------

      - name: Create Multi-Format Installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist | Out-Null

          # NSIS
          if (Test-Path "installer.nsi") {

            & "C:\Program Files (x86)\NSIS\makensis.exe" `
              "/DREDIST_PATH=package\VC_redist.x64.exe" `
              installer.nsi

            if ($LASTEXITCODE -ne 0) {
              throw "NSIS installer build failed."
            }

            if (Test-Path "dist\VoidOne-Setup-x64.exe") {

              Move-Item `
                -Path "dist\VoidOne-Setup-x64.exe" `
                -Destination "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe" `
                -Force
            }
          }

          # WiX
          if (Test-Path "Package.wxs") {

            wix build `
              Package.wxs `
              -d ProductVersion=${{ steps.version.outputs.value }} `
              -ext WixToolset.UI.wixext `
              -ext WixToolset.Util.wixext `
              -ext WixToolset.Firewall.wixext `
              -o "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.msi"

            if ($LASTEXITCODE -ne 0) {
              throw "WiX MSI build failed."
            }
          }


      # ----------------------------------------------------------
      # SIGN INSTALLERS
      # ----------------------------------------------------------

      - name: Sign Installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cert = Get-ChildItem `
            Cert:\CurrentUser\My `
            -CodeSigningCert |
            Select-Object -First 1

          if (-not $cert) {
            throw "Code-signing certificate was not found."
          }

          Get-ChildItem `
            -Path dist `
            -Include *.exe,*.msi `
            -Recurse |
            ForEach-Object {

              Set-AuthenticodeSignature `
                -FilePath $_.FullName `
                -Certificate $cert `
                -TimestampServer "http://timestamp.digicert.com"
            }


      # ----------------------------------------------------------
      # PACKAGE MANIFESTS + HASHES
      # ----------------------------------------------------------

      - name: Generate Package Manifests
        id: hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.version.outputs.value }}"

          # Installer SHA256
          $exePath = "dist\VoidOne-Setup-x64-$version.exe"

          if (-not (Test-Path $exePath)) {
            throw "NSIS installer not found: $exePath"
          }

          $exeHash = (
            Get-FileHash `
              -Path $exePath `
              -Algorithm SHA256
          ).Hash

          "exe_sha256=$exeHash" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append


      # ----------------------------------------------------------
      # PORTABLE PACKAGES
      # ----------------------------------------------------------

      - name: Compress Portable Packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.version.outputs.value }}"

          Compress-Archive `
            -Path package\* `
            -DestinationPath "VoidOne-Windows-x64-Portable-$version.zip" `
            -CompressionLevel Optimal

          Compress-Archive `
            -Path pdb-symbols\* `
            -DestinationPath "VoidOne-Windows-x64-Symbols-$version.zip" `
            -CompressionLevel Optimal


      # ----------------------------------------------------------
      # PACKAGE HASHES
      # ----------------------------------------------------------

      - name: Generate SHA256 Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem `
            -Path . `
            -Filter "*.zip" |
            ForEach-Object {

              $hash = (
                Get-FileHash `
                  -Path $_.FullName `
                  -Algorithm SHA256
              ).Hash

              "$hash  $($_.Name)" |
                Out-File `
                  -FilePath "$($_.FullName).sha256" `
                  -Encoding ascii
            }

          Get-ChildItem `
            -Path dist `
            -Include *.exe,*.msi `
            -Recurse |
            ForEach-Object {

              $hash = (
                Get-FileHash `
                  -Path $_.FullName `
                  -Algorithm SHA256
              ).Hash

              "$hash  $($_.Name)" |
                Out-File `
                  -FilePath "$($_.FullName).sha256" `
                  -Encoding ascii
            }


      # ----------------------------------------------------------
      # PACKAGE MANIFESTS
      # ----------------------------------------------------------

      - name: Generate Winget Manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"

          $installer = "dist\VoidOne-Setup-x64-$version.exe"

          $hash = (
            Get-FileHash `
              -Path $installer `
              -Algorithm SHA256
          ).Hash

          $manifest = @"
          PackageIdentifier: VoidOneApp.VoidOne
          PackageVersion: $version
          PackageName: VoidOne
          Publisher: VoidOne_app
          License: MIT
          ShortDescription: Open-source high-performance PC game launcher
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/${{ github.repository }}/releases/download/v$version/VoidOne-Setup-x64-$version.exe
              InstallerSha256: $hash
              InstallerType: nullsoft
          ManifestType: singleton
          ManifestVersion: 1.4.0
          "@

          $manifest |
            Out-File `
              -FilePath "dist\VoidOne.winget.yaml" `
              -Encoding utf8


      - name: Generate Scoop Manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"

          $portable = "VoidOne-Windows-x64-Portable-$version.zip"

          $hash = (
            Get-FileHash `
              -Path $portable `
              -Algorithm SHA256
          ).Hash

          $manifest = @{
            version = $version
            architecture = @{
              "64bit" = @{
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/$portable"
                hash = $hash
              }
            }
            bin = "VoidOne.exe"
            shortcuts = @(
              @("VoidOne.exe", "VoidOne")
            )
          } | ConvertTo-Json -Depth 5

          $manifest |
            Out-File `
              -FilePath "dist\VoidOne.scoop.json" `
              -Encoding utf8


      - name: Generate AppCast
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"

          $installer = "dist\VoidOne-Setup-x64-$version.exe"

          $hash = (
            Get-FileHash `
              -Path $installer `
              -Algorithm SHA256
          ).Hash

          $appcast = @{
            version = $version
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            url = "https://github.com/${{ github.repository }}/releases/download/v$version/VoidOne-Setup-x64-$version.exe"
            sha256 = $hash
          } | ConvertTo-Json

          $appcast |
            Out-File `
              -FilePath "dist\appcast.json" `
              -Encoding utf8


      # ----------------------------------------------------------
      # SBOM
      # ----------------------------------------------------------

      - name: Generate CycloneDX / SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: package/
          format: spdx-json
          output-file: VoidOne-SBOM-${{ steps.version.outputs.value }}.spdx.json


      # ----------------------------------------------------------
      # BUILD DURATION
      # ----------------------------------------------------------

      - name: Stop Build Clock
        id: telemetry
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $start = [int64]$env:start_time

          $duration = $end -$start

          $minutes = [math]::Floor($duration / 60)
          $seconds =$duration % 60

          "duration=${minutes}m${seconds}s" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append


      # ----------------------------------------------------------
      # SUMMARY
      # ----------------------------------------------------------

      - name: Generate Build Summary
        shell: pwsh
        run: |
          $summary = @"
          # 🚀 VoidOne Build Dashboard

          | Metric | Status / Value |
          | :--- | :--- |
          | ⏱️ **Build Duration** | `${{ steps.telemetry.outputs.duration }}` |
          | 🏷️ **Engine Version** | `${{ steps.version.outputs.value }}` |
          | 🔑 **Code Signing** | `Self-Signed Code-Signing Certificate` |
          | 🛡️ **Security Analysis** | `CodeQL + Cppcheck` |
          | 📦 **Packaging** | `NSIS + WiX MSI + Portable ZIP` |
          | 📄 **SBOM** | `SPDX JSON` |

          ### SHA256

          ```text
          EXE SHA256:
          ${{ steps.hashes.outputs.exe_sha256 }}
          ```
          "@

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append


      # ----------------------------------------------------------
      # ARTIFACTS
      # ----------------------------------------------------------

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-Windows-GodTier-Release
          path: |
            VoidOne-Windows-x64-*.zip
            VoidOne-Windows-x64-*.zip.sha256
            VoidOne-SBOM-*.spdx.json
            dist/*
          retention-days: 30


  # ============================================================
  # DOCUMENTATION
  # ============================================================

  generate-docs:
    name: 📚 Build API Documentation

    if: ${{ inputs.build_docs == true || startsWith(github.ref, 'refs/tags/v') }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        shell: bash
        run: |
          if [ -f "Doxyfile" ]; then
            doxygen Doxyfile
          else
            echo "No Doxyfile found. Skipping documentation generation."
            exit 0
          fi

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-Documentation
          path: html/
          if-no-files-found: ignore


  # ============================================================
  # RELEASE
  # ============================================================

  publish-release:
    name: 🌐 Global Release & Notifications

    needs:
      - build-production

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoidOne-Windows-GodTier-Release
          path: release-files


      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "release-files/**"


      - name: Determine Release Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG=$(git describe \
            --tags \
            --abbrev=0 \
            --exclude="$TAG" \
            2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log \
              "$PREV_TAG"..HEAD \
              --pretty=format:"• %s (%h)" |
              head -n 15)
          else
            LOG="• Initial Release Build"
          fi

          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VoidOne Engine ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/**


      # ----------------------------------------------------------
      # DISCORD / TELEGRAM
      # ----------------------------------------------------------

      - name: Send Release Notifications
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANGELOG: ${{ steps.meta.outputs.log }}
          BUILD_TIME: ${{ needs.build-production.outputs.build-duration }}
          SHA_EXE: ${{ needs.build-production.outputs.sha256-exe }}

        run: |
          set -euo pipefail

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then

            PAYLOAD=$(jq -n \
              --arg tag "${GITHUB_REF_NAME}" \
              --arg actor "${GITHUB_ACTOR}" \
              --arg avatar "${{ github.event.sender.avatar_url }}" \
              --arg changelog "$CHANGELOG" \
              --arg time "$BUILD_TIME" \
              --arg sha "$SHA_EXE" \
              --arg url "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
              '{
                username: "VoidOne CI/CD",
                avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                embeds: [{
                  title: ("🚀 VoidOne Engine " + $tag + " Released"),
                  url: $url,
                  description: "Automated VoidOne CI/CD pipeline completed successfully.",
                  color: 9442815,
                  author: {
                    name: $actor,
                    icon_url: $avatar
                  },
                  fields: [
                    {
                      name: "⏱️ Build Duration",
                      value: $time,
                      inline: true
                    },
                    {
                      name: "📦 Packaging",
                      value: "NSIS + WiX + Portable",
                      inline: true
                    },
                    {
                      name: "🔒 Provenance",
                      value: "Attested",
                      inline: true
                    },
                    {
                      name: "🔑 Installer SHA256",
                      value: ("`" + $sha + "`"),
                      inline: false
                    },
                    {
                      name: "📝 Changes",
                      value: ("```text\n" + $changelog + "\n```"),
                      inline: false
                    }
                  ],
                  footer: {
                    text: "VoidOne CI/CD • Built with GitHub Actions"
                  }
                }]
              }')

            curl \
              -sf \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$DISCORD_WEBHOOK"
          fi


          if [ -n "${TELEGRAM_TOKEN:-}" ] &&
             [ -n "${TELEGRAM_CHAT_ID:-}" ]; then

            TG_TEXT="🚀 VoidOne Engine ${GITHUB_REF_NAME} Released!

          ⏱️ Build Duration: ${BUILD_TIME}
          👤 Built by: ${GITHUB_ACTOR}
          🔑 SHA256: ${SHA_EXE}

          🔗 https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"

            curl \
              -sf \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TG_TEXT}" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
          fi
