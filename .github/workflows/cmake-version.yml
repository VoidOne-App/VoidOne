name: VoidOne CMake Version Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cmake:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify CMake compatibility
        shell: pwsh
        run: |
          $version = cmake --version | Select-Object -First 1
          Write-Host $version
          if ($version -notmatch 'cmake version 4\.4\.[2-9]') {
            throw "VoidOne requires CMake 4.4.2 or newer. Found: $version"
          }
