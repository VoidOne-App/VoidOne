name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '31 15 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Auto Stale Cleanup
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Timing configuration (days)
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 45
          days-before-pr-close: 7

          # Labels
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,in-progress,keep-open'
          exempt-pr-labels: 'work-in-progress,security,keep-open'

          # Automated English Messages
          stale-issue-message: |
            👋 This issue has been automatically marked as **stale** because it has not had recent activity for 60 days.
            It will be closed in 7 days if no further activity occurs. Thank you for your contributions!

          stale-pr-message: |
            👋 This Pull Request has been automatically marked as **stale** because it has not had recent activity for 45 days.
            It will be closed in 7 days if no further activity occurs.

          close-issue-message: 'This issue was closed due to inactivity.'
          close-pr-message: 'This PR was closed due to inactivity.'

          operations-per-run: 100
