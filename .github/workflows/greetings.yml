name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            👋 **Welcome to the VoidOne community!**

            Thanks for opening your first issue! ❤️

            To help us investigate it faster, please make sure you've included:

            - [ ] A clear description of the problem
            - [ ] Steps to reproduce the issue
            - [ ] Your system environment (OS / Qt version)
            - [ ] Relevant terminal logs or screenshots

            We appreciate your help in improving **VoidOne**! 🚀

          pr-message: |
            🎉 **Welcome to VoidOne!**

            Thanks for opening your first Pull Request! ❤️

            Before requesting a review, please make sure:

            - [ ] The changes are clearly described
            - [ ] The relevant code has been tested
            - [ ] Existing functionality has not been unnecessarily affected
            - [ ] The changes follow the project's coding style

            A maintainer will review your contribution when possible.

            Thanks for helping make **VoidOne** better! ⚡
