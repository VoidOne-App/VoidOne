name: "🛡️ VoidOne — Dependency Security"

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "20 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # On PRs, compare the proposed dependency graph against the base.
      # On push/scheduled runs, the workflow still validates the repository
      # dependency manifests without granting write access to source files.
      - name: 🛡️ Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: false

      - name: 🔍 Dependency manifest inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 🛡️ VoidOne Dependency Security"
            echo
            echo "Dependency manifests found in this revision:"
            find . -maxdepth 5 -type f \( \
              -name 'CMakeLists.txt' -o \
              -name '*.cmake' -o \
              -name 'vcpkg.json' -o \
              -name 'conanfile.*' -o \
              -name 'package.json' -o \
              -name 'requirements*.txt' \
            \) -not -path './.git/*' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
