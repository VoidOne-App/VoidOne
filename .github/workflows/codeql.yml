name: "🔐 VoidOne — Enterprise CodeQL"

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "35 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.*"
  QT_ARCH: win64_msvc2022_64
  BUILD_DIR: build-codeql

jobs:
  analyze:
    name: "CodeQL — C++/Qt6/MSVC"
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          setup-python: false

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cl.exe
          cmake --version
          ninja --version
          qmake --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          trap-caching: false
          ram: 5500
          threads: 2

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "${{ env.BUILD_DIR }}" -Recurse -Force -ErrorAction SilentlyContinue
          $cmakeArgs = @(
            '-S', '.',
            '-B', "${{ env.BUILD_DIR }}",
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DVOIDONE_VERSION_OVERRIDE:STRING=0.0.1',
            '-DVOIDONE_BUILD_TESTS=ON',
            '-DVOIDONE_GENERATE_INSTALLER=OFF'
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE." }

      - name: Build — CodeQL traced
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CodeQL traced build failed with exit code $LASTEXITCODE." }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ctest --test-dir "${{ env.BUILD_DIR }}" -C Release --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { throw "CTest failed with exit code $LASTEXITCODE." }

      - name: Verify native artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Get-ChildItem "${{ env.BUILD_DIR }}" -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll', '.lib') }
          if (-not $artifacts) { throw "No native artifacts were produced." }
          $artifacts | ForEach-Object { Write-Host "FOUND: $($_.FullName)" }

      - name: Analyze and upload SARIF
        if: always()
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          upload: always
