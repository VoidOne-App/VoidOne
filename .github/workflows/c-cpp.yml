name: NeonLauncher CI/CD

on:
  push:
    branches:
      - main
      - Feature-add
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - Feature-add

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# Windows Release
# ============================================================

jobs:

  windows-release:
    name: Windows x64 • Release
    runs-on: windows-2025
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true
          cache: pip
          cache-dependency-path: ""

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          python -m aqt version

      # --------------------------------------------------------
      # Qt 6.11
      # --------------------------------------------------------

      - name: Install Qt 6.11
        shell: pwsh
        run: |
          python -m aqt install-qt `
            windows `
            desktop `
            6.11.0 `
            win64_msvc2022_64 `
            --outputdir "$env:GITHUB_WORKSPACE\Qt" `
            --autodesktop

      - name: Set Qt environment
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE "Qt\6.11.0\msvc2022_64"

          if (-not (Test-Path $qtRoot)) {
            Write-Error "Qt installation directory was not found: $qtRoot"
            exit 1
          }

          $qtBin = Join-Path $qtRoot "bin"

          "Qt6_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Qt root: $qtRoot"
          Write-Host "Qt bin:  $qtBin"

      - name: Verify Qt
        shell: pwsh
        run: |
          Write-Host "Qt6_DIR=$env:Qt6_DIR"

          if (-not (Test-Path "$env:Qt6_DIR\bin\qmake.exe")) {
            Write-Error "Qt installation is incomplete."
            exit 1
          }

          qmake --version

      # --------------------------------------------------------
      # MSVC
      # --------------------------------------------------------

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC
        shell: pwsh
        run: |
          where.exe cl
          cl

      # --------------------------------------------------------
      # CMake
      # --------------------------------------------------------

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Verify CMake
        shell: pwsh
        run: |
          cmake --version

      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------

      - name: Configure Release
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build Release
        shell: pwsh
        run: |
          cmake `
            --build build `
            --parallel

      # --------------------------------------------------------
      # Locate executable
      # --------------------------------------------------------

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter NeonLauncherApp.exe `
            -Recurse `
            -ErrorAction SilentlyContinue `
            | Select-Object -First 1

          if (-not $exe) {
            Write-Error "NeonLauncherApp.exe was not found."
            exit 1
          }

          Write-Host "Executable:"
          Write-Host $exe.FullName

      # --------------------------------------------------------
      # Deploy Qt
      # --------------------------------------------------------

      - name: Deploy Qt
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter NeonLauncherApp.exe `
            -Recurse `
            | Select-Object -First 1

          if (-not $exe) {
            Write-Error "NeonLauncherApp.exe was not found."
            exit 1
          }

          windeployqt `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE\src\ui\qml" `
            $exe.FullName

      # --------------------------------------------------------
      # Prepare package
      # --------------------------------------------------------

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter NeonLauncherApp.exe `
            -Recurse `
            | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Release executable was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path package `
            | Out-Null

          Copy-Item `
            -Path (Join-Path $exe.Directory.FullName "*") `
            -Destination package `
            -Recurse `
            -Force

      # --------------------------------------------------------
      # Verify package
      # --------------------------------------------------------

      - name: Verify Windows package
        shell: pwsh
        run: |
          $exe = "package\NeonLauncherApp.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Packaged executable is missing."
            exit 1
          }

          Write-Host "Windows package:"
          Get-ChildItem package -Recurse

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\* `
            -DestinationPath NeonLauncher-Windows-x64.zip `
            -CompressionLevel Optimal

      # --------------------------------------------------------
      # Checksum
      # --------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          (Get-FileHash `
            NeonLauncher-Windows-x64.zip `
            -Algorithm SHA256).Hash `
            | Out-File `
              NeonLauncher-Windows-x64.zip.sha256 `
              -Encoding ascii

      # --------------------------------------------------------
      # Upload artifact
      # --------------------------------------------------------

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          retention-days: 30


# ============================================================
# Linux Release
# ============================================================

  linux-release:
    name: Linux x64 • Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      # --------------------------------------------------------
      # Qt
      # --------------------------------------------------------

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          target: desktop
          arch: linux_gcc_64
          cache: true

      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------

      - name: Configure Release
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build Release
        run: |
          cmake \
            --build build \
            --parallel

      # --------------------------------------------------------
      # Install
      # --------------------------------------------------------

      - name: Install
        run: |
          rm -rf package
          cmake \
            --install build \
            --prefix package

      # --------------------------------------------------------
      # Verify
      # --------------------------------------------------------

      - name: Verify executable
        run: |
          test -f package/bin/NeonLauncherApp
          file package/bin/NeonLauncherApp

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package Linux
        run: |
          mkdir -p dist

          tar \
            -C package \
            -czf dist/NeonLauncher-Linux-x64.tar.gz \
            .

      # --------------------------------------------------------
      # Checksum
      # --------------------------------------------------------

      - name: Generate Linux SHA256
        run: |
          sha256sum \
            dist/NeonLauncher-Linux-x64.tar.gz \
            > dist/NeonLauncher-Linux-x64.tar.gz.sha256

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: |
            dist/NeonLauncher-Linux-x64.tar.gz
            dist/NeonLauncher-Linux-x64.tar.gz.sha256
          retention-days: 30


# ============================================================
# Linux Debug
# ============================================================

  linux-debug:
    name: Linux x64 • Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure Debug
        run: |
          cmake \
            -S . \
            -B build-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=23

      - name: Build Debug
        run: |
          cmake \
            --build build-debug \
            --parallel


# ============================================================
# Windows Debug
# ============================================================

  windows-debug:
    name: Windows x64 • Debug
    runs-on: windows-2025
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt 6.11
        shell: pwsh
        run: |
          python -m aqt install-qt `
            windows `
            desktop `
            6.11.0 `
            win64_msvc2022_64 `
            --outputdir "$env:GITHUB_WORKSPACE\Qt" `
            --autodesktop

      - name: Set Qt environment
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE "Qt\6.11.0\msvc2022_64"
          $qtBin = Join-Path $qtRoot "bin"

          "Qt6_DIR=$qtRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $qtBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure Debug
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build-debug `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake `
            --build build-debug `
            --parallel


# ============================================================
# Unit Tests
# ============================================================

  tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure tests
        run: |
          cmake \
            -S . \
            -B build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=23 \
            -DNEONLAUNCHER_BUILD_TESTS=ON

      - name: Build tests
        run: |
          cmake \
            --build build-tests \
            --parallel

      - name: Run tests
        run: |
          ctest \
            --test-dir build-tests \
            --output-on-failure \
            --parallel 2


# ============================================================
# Sanitizers
# ============================================================

  sanitizers:
    name: Linux • Address/UB Sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure Sanitizers
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          cmake \
            -S . \
            -B build-sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=23

      - name: Build Sanitized
        run: |
          cmake \
            --build build-sanitize \
            --parallel


# ============================================================
# Static Analysis
# ============================================================

  static-analysis:
    name: Linux • Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev \
            libxkbcommon-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure Static Analysis
        run: |
          cmake \
            -S . \
            -B build-analysis \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build Static Analysis
        run: |
          cmake \
            --build build-analysis \
            --parallel


# ============================================================
# GitHub Release
# ============================================================

  release:
    name: GitHub Release
    needs:
      - windows-release
      - linux-release
      - windows-debug
      - linux-debug
      - tests
      - sanitizers
      - static-analysis

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/NeonLauncher-Windows-x64/*
            artifacts/NeonLauncher-Linux-x64/*
