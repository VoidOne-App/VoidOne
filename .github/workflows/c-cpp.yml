name: NeonLauncher Stable Multi-Platform Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1'
  BUILD_TYPE: Release
  APP_NAME: NeonLauncherApp
  APP_VERSION: '1.0.2'

jobs:

  # ==========================================================================
  # LINUX BUILD
  # ==========================================================================

  build-linux:
    name: Build Linux x64

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # ----------------------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------------------

      - name: Install Linux Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libpulse-dev \
            ccache \
            zip \
            unzip

      # ----------------------------------------------------------------------
      # Compiler Cache
      # ----------------------------------------------------------------------

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neonlauncher-linux-qt-${{ env.QT_VERSION }}

      # ----------------------------------------------------------------------
      # Configure
      # ----------------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ----------------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------------

      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config "${BUILD_TYPE}" \
            --parallel

      # ----------------------------------------------------------------------
      # Verify
      # ----------------------------------------------------------------------

      - name: Verify Linux Executable
        shell: bash
        run: |
          set -euo pipefail

          EXECUTABLE="build/bin/${APP_NAME}"

          if [[ ! -f "$EXECUTABLE" ]]; then
            echo "ERROR: Linux executable was not created."
            echo "Expected: $EXECUTABLE"
            exit 1
          fi

          if [[ ! -x "$EXECUTABLE" ]]; then
            echo "ERROR: Linux executable is not executable."
            exit 1
          fi

          echo "Linux executable:"
          ls -lh "$EXECUTABLE"

          echo
          echo "File information:"
          file "$EXECUTABLE"

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp \
            "build/bin/${APP_NAME}" \
            dist/

          cd dist

          zip \
            -9 \
            -r \
            "../NeonLauncher-Linux-x64.zip" \
            .

      # ----------------------------------------------------------------------
      # Validate ZIP
      # ----------------------------------------------------------------------

      - name: Validate Linux Archive
        shell: bash
        run: |
          set -euo pipefail

          unzip -t NeonLauncher-Linux-x64.zip

      # ----------------------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------------------

      - name: Generate Linux SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            NeonLauncher-Linux-x64.zip \
            > NeonLauncher-Linux-x64.zip.sha256

          echo "SHA256:"
          cat NeonLauncher-Linux-x64.zip.sha256

      # ----------------------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------------------

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: |
            NeonLauncher-Linux-x64.zip
            NeonLauncher-Linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ==========================================================================
  # WINDOWS BUILD
  # ==========================================================================

  build-windows:
    name: Build Windows x64

    runs-on: windows-2025

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      # ----------------------------------------------------------------------
      # Configure
      # ----------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE

      # ----------------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------------

      - name: Build Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config $env:BUILD_TYPE `
            --parallel

      # ----------------------------------------------------------------------
      # Verify EXE
      # ----------------------------------------------------------------------

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/${env:APP_NAME}.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Windows executable was not created."
            Write-Error "Expected: $exe"
            exit 1
          }

          Write-Host "Windows executable found:"
          Get-Item $exe |
            Format-List Name, Length, FullName

      # ----------------------------------------------------------------------
      # Qt Deployment
      # ----------------------------------------------------------------------

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/${env:APP_NAME}.exe"

          windeployqt `
            --release `
            --compiler-runtime `
            --qmldir "src/ui/qml" `
            --qmlimport "src/ui/qml" `
            $exe

      # ----------------------------------------------------------------------
      # QML
      # ----------------------------------------------------------------------

      - name: Deploy QML Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $qmlTarget = "build/bin/Release/qml/NeonLauncher"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $qmlTarget

          Copy-Item `
            -Recurse `
            -Force `
            "src/ui/qml/*" `
            $qmlTarget

      # ----------------------------------------------------------------------
      # Validate Deployment
      # ----------------------------------------------------------------------

      - name: Validate Windows Deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "build/bin/Release"

          $required = @(
            "${env:APP_NAME}.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Qml.dll",
            "Qt6Quick.dll",
            "Qt6Sql.dll"
          )

          foreach ($file in $required) {

            $path = Join-Path $root $file

            if (!(Test-Path $path)) {
              Write-Error "Missing required file: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Qt deployment validation passed."

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -CompressionLevel Optimal

      # ----------------------------------------------------------------------
      # Validate ZIP
      # ----------------------------------------------------------------------

      - name: Validate Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "NeonLauncher-Windows-x64.zip"

          if (!(Test-Path $archive)) {
            Write-Error "Windows archive was not created."
            exit 1
          }

          $size = (Get-Item $archive).Length

          if ($size -le 0) {
            Write-Error "Windows archive is empty."
            exit 1
          }

          Write-Host "Archive:"
          Get-Item $archive |
            Format-List Name, Length, FullName

      # ----------------------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  NeonLauncher-Windows-x64.zip" |
            Out-File `
              "NeonLauncher-Windows-x64.zip.sha256" `
              -Encoding ascii

          Write-Host "SHA256:"
          Get-Content NeonLauncher-Windows-x64.zip.sha256

      # ----------------------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------------------

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ==========================================================================
  # RELEASE
  # ==========================================================================

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-windows

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------------------
      # Download Artifacts
      # ----------------------------------------------------------------------

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      # ----------------------------------------------------------------------
      # Generate Combined Checksums
      # ----------------------------------------------------------------------

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          cat \
            NeonLauncher-Linux-x64.zip.sha256 \
            NeonLauncher-Windows-x64.zip.sha256 \
            > SHA256SUMS.txt

          echo "========================================"
          echo "NeonLauncher SHA256 Checksums"
          echo "========================================"

          cat SHA256SUMS.txt

      # ----------------------------------------------------------------------
      # Release
      # ----------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true

          files: |
            release/NeonLauncher-Linux-x64.zip
            release/NeonLauncher-Windows-x64.zip
            release/SHA256SUMS.txt
