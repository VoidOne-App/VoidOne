name: NeonLauncher CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL SETTINGS
# ============================================================

permissions:
  contents: read

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: NeonLauncher
  EXECUTABLE_NAME: NeonLauncherApp

  QT_VERSION: "6.11.1"
  CMAKE_VERSION: "3.31.8"

  BUILD_TYPE: Release

# ============================================================
# JOB 1 — LINUX RELEASE BUILD
# ============================================================

jobs:

  linux-release:
    name: Linux x64 • Release

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install Linux Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            ccache \
            zip \
            unzip \
            libgl1-mesa-dev \
            libpulse-dev

      # --------------------------------------------------------
      # Qt
      # --------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: neonlauncher-qt-linux

      # --------------------------------------------------------
      # CMake
      # --------------------------------------------------------

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # --------------------------------------------------------
      # ccache
      # --------------------------------------------------------

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neonlauncher-linux-${{ env.QT_VERSION }}

      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --parallel

      # --------------------------------------------------------
      # Binary validation
      # --------------------------------------------------------

      - name: Validate Linux Binary
        shell: bash
        run: |
          set -euo pipefail

          EXE="build/bin/${EXECUTABLE_NAME}"

          if [[ ! -f "$EXE" ]]; then
            echo "::error::Linux executable was not created."
            exit 1
          fi

          if [[ ! -x "$EXE" ]]; then
            echo "::error::Linux executable is not executable."
            exit 1
          fi

          SIZE=$(stat -c%s "$EXE")

          if [[ "$SIZE" -le 0 ]]; then
            echo "::error::Linux executable is empty."
            exit 1
          fi

          file "$EXE"

          echo "Linux executable:"
          ls -lh "$EXE"

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist/NeonLauncher

          cp \
            "build/bin/${EXECUTABLE_NAME}" \
            "dist/NeonLauncher/"

          cp -r \
            assets \
            "dist/NeonLauncher/" \
            2>/dev/null || true

          cd dist

          zip -9 -r \
            "../NeonLauncher-Linux-x64.zip" \
            NeonLauncher

      # --------------------------------------------------------
      # Package validation
      # --------------------------------------------------------

      - name: Validate Linux Package
        shell: bash
        run: |
          set -euo pipefail

          unzip -t NeonLauncher-Linux-x64.zip

          unzip -l NeonLauncher-Linux-x64.zip

      # --------------------------------------------------------
      # SHA256
      # --------------------------------------------------------

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            NeonLauncher-Linux-x64.zip \
            > NeonLauncher-Linux-x64.zip.sha256

          cat NeonLauncher-Linux-x64.zip.sha256

      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: |
            NeonLauncher-Linux-x64.zip
            NeonLauncher-Linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # JOB 2 — WINDOWS RELEASE BUILD
  # ============================================================

  windows-release:
    name: Windows x64 • Release

    # Explicitly pin VS2022.
    # windows-latest moved toward VS2026 in 2026.
    runs-on: windows-2022

    timeout-minutes: 35

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Qt
      # --------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: neonlauncher-qt-windows

      # --------------------------------------------------------
      # CMake
      # --------------------------------------------------------

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # --------------------------------------------------------
      # Verify Toolchain
      # --------------------------------------------------------

      - name: Verify Build Environment
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "NeonLauncher Build Environment"
          Write-Host "========================================"

          cmake --version

          Write-Host ""
          Write-Host "Qt:"
          if ($env:Qt6_DIR) {
              Write-Host $env:Qt6_DIR
          }

          Write-Host ""
          Write-Host "Compiler:"
          where.exe cl.exe

      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

      # --------------------------------------------------------
      # Validate executable
      # --------------------------------------------------------

      - name: Validate Windows Binary
        shell: pwsh
        run: |

          $exe = "build/bin/Release/${env:EXECUTABLE_NAME}.exe"

          if (!(Test-Path $exe)) {
              Write-Error "Windows executable was not created: $exe"
              exit 1
          }

          $file = Get-Item $exe

          if ($file.Length -le 0) {
              Write-Error "Windows executable is empty."
              exit 1
          }

          Write-Host "Executable:"
          $file | Format-List Name,Length,FullName

      # --------------------------------------------------------
      # Deploy Qt Runtime
      # --------------------------------------------------------

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |

          $exe = "build/bin/Release/${env:EXECUTABLE_NAME}.exe"

          windeployqt `
            --release `
            --compiler-runtime `
            --qmldir "src/ui/qml" `
            --verbose 1 `
            "$exe"

      # --------------------------------------------------------
      # Validate Qt deployment
      # --------------------------------------------------------

      - name: Validate Qt Deployment
        shell: pwsh
        run: |

          $root = "build/bin/Release"

          $required = @(
              "Qt6Core.dll",
              "Qt6Gui.dll",
              "Qt6Qml.dll",
              "Qt6Quick.dll",
              "Qt6Sql.dll"
          )

          foreach ($file in $required) {

              $path = Join-Path $root $file

              if (!(Test-Path $path)) {
                  Write-Error "Missing Qt runtime file: $file"
                  exit 1
              }

              Write-Host "OK: $file"
          }

      # --------------------------------------------------------
      # QML module
      # --------------------------------------------------------

      - name: Validate QML Module
        shell: pwsh
        run: |

          $qmlModule = "build/bin/Release/qml/NeonLauncher"

          if (!(Test-Path $qmlModule)) {
              Write-Error "QML module directory missing: $qmlModule"
              exit 1
          }

          Write-Host "QML module found."

          Get-ChildItem `
            $qmlModule `
            -Recurse |
            Select-Object FullName

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |

          if (Test-Path "NeonLauncher-Windows-x64.zip") {
              Remove-Item "NeonLauncher-Windows-x64.zip" -Force
          }

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -CompressionLevel Optimal

      # --------------------------------------------------------
      # Validate archive
      # --------------------------------------------------------

      - name: Validate Windows Package
        shell: pwsh
        run: |

          if (!(Test-Path "NeonLauncher-Windows-x64.zip")) {
              Write-Error "Windows package was not created."
              exit 1
          }

          $archive = Get-Item "NeonLauncher-Windows-x64.zip"

          if ($archive.Length -le 0) {
              Write-Error "Windows package is empty."
              exit 1
          }

          Write-Host "Package size:"
          Write-Host "$($archive.Length) bytes"

          Expand-Archive `
            -Path $archive.FullName `
            -DestinationPath package-test `
            -Force

          if (!(Test-Path "package-test/${env:EXECUTABLE_NAME}.exe")) {
              Write-Error "Executable missing from final archive."
              exit 1
          }

      # --------------------------------------------------------
      # SHA256
      # --------------------------------------------------------

      - name: Generate SHA256
        shell: pwsh
        run: |

          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  NeonLauncher-Windows-x64.zip" |
            Out-File `
              "NeonLauncher-Windows-x64.zip.sha256" `
              -Encoding ascii

          Write-Host $hash

      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # JOB 3 — LINUX SANITIZER
  # ============================================================

  linux-sanitizer:
    name: Linux • Address/UB Sanitizer

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: neonlauncher-qt-sanitizer

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure Sanitizer Build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-sanitizer \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build Sanitizer
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-sanitizer \
            --parallel


  # ============================================================
  # JOB 4 — STATIC ANALYSIS
  # ============================================================

  static-analysis:
    name: Static Analysis

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            clang-tidy \
            ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: neonlauncher-qt-analysis

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-analysis \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build with clang-tidy
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-analysis \
            --parallel


  # ============================================================
  # JOB 5 — UNIT TESTS
  # ============================================================

  tests:
    name: Unit Tests

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: neonlauncher-qt-tests

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure Tests
        run: |
          cmake \
            -S . \
            -B build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEONLAUNCHER_BUILD_TESTS=ON

      - name: Build Tests
        run: |
          cmake \
            --build build-tests \
            --parallel

      - name: Run CTest
        run: |
          ctest \
            --test-dir build-tests \
            --output-on-failure


  # ============================================================
  # JOB 6 — NIGHTLY
  # ============================================================

  nightly:
    name: Nightly Release

    needs:
      - linux-release
      - windows-release
      - tests
      - linux-sanitizer
      - static-analysis

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      - name: Create Manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > release/manifest.json <<EOF
          {
            "application": "NeonLauncher",
            "channel": "nightly",
            "commit": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_NUMBER}",
            "qt": "${QT_VERSION}"
          }
          EOF

      - name: Create SHA256 Manifest
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            *.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: NeonLauncher Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt
            release/manifest.json


  # ============================================================
  # JOB 7 — OFFICIAL RELEASE
  # ============================================================

  release:
    name: Official Release

    needs:
      - linux-release
      - windows-release
      - tests
      - linux-sanitizer
      - static-analysis

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      - name: Create Release Manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          cat > release/manifest.json <<EOF
          {
            "application": "NeonLauncher",
            "version": "${VERSION}",
            "channel": "stable",
            "commit": "${GITHUB_SHA}",
            "qt": "${QT_VERSION}"
          }
          EOF

      - name: Generate Combined Checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            *.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt
            release/manifest.json
