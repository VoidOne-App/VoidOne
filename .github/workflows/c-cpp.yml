name: VoidOne Ultimate Enterprise CI/CD

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (emergency builds only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: voidone-prod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.0"
  QT_ARCH: win64_msvc2022_64
  APP_NAME: VoidOne

jobs:

  # ----------------------------------------------------------
  # 1. Validate SemVer Tag
  # ----------------------------------------------------------

  validate-version:
    name: Validate Release Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Enforce SemVer format
        run: |
          TAG="${{ github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$TAG' does not follow the supported SemVer format."
            exit 1
          fi
          echo "Tag $TAG is valid SemVer."

  # ----------------------------------------------------------
  # 2. Static Security Analysis
  # ----------------------------------------------------------

  static-analysis:
    name: CodeQL Security Analysis
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        shell: pwsh
        run: choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Configure & Build
        shell: pwsh
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - uses: github/codeql-action/analyze@v3

  # ----------------------------------------------------------
  # 3. Build, Optimize & Package Dual Installers (EXE & MSI)
  # ----------------------------------------------------------

  build-windows:
    name: Build & Package (EXE, MSI & ZIP)
    needs: static-analysis
    if: always() && needs.static-analysis.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 45

    outputs:
      build-version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Build Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: voidone-msvc-release-${{ github.sha }}
          restore-keys: voidone-msvc-release-
          variant: ccache
          max-size: 500M

      - name: Install Build Tools & Packaging Suites (NSIS + WiX)
        shell: pwsh
        run: |
          choco install ninja upx nsis dotnet-8.0-sdk -y --no-progress
          dotnet tool install --global wix

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}
          cache: true
          cache-key-prefix: voidone-qt

      - name: Configure & Compile Executable
        shell: pwsh
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION="${{ steps.version.outputs.value }}" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release --parallel

      - name: Prepare Staging Folder & Deploy Qt Binaries
        shell: pwsh
        run: |
          Remove-Item -Path package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $exe = Get-ChildItem -Path build -Filter "$env:APP_NAME.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $exe.FullName -Destination "package\$env:APP_NAME.exe" -Force
          windeployqt --release --compiler-runtime --no-translations --qmldir "$env:GITHUB_WORKSPACE\src" "package\$env:APP_NAME.exe"

      - name: Compress Executable with UPX
        shell: pwsh
        run: upx --best package\$env:APP_NAME.exe

      - name: Build Dual Installers (NSIS EXE + WiX MSI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. ساخت نسخه EXE با NSIS
          if (Test-Path "installer.nsi") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
            Move-Item -Path "dist\VoidOne-Setup-x64.exe" -Destination "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.exe" -Force
          }

          # 2. تایید لایسنس WiX v7 و ساخت نسخه MSI
          if (Test-Path "installer.wxs") {
            wix eula accept wix7
            wix build installer.wxs -o "dist\VoidOne-Setup-x64-${{ steps.version.outputs.value }}.msi"
          }

      - name: Create ZIP Archive (Portable) & Checksums
        shell: pwsh
        run: |
          $zipName = "VoidOne-Windows-x64-Portable-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path package\* -DestinationPath $zipName -CompressionLevel Optimal

          Get-ChildItem -Path . -Filter "*.zip" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem -Path dist -Filter "*.*" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidOne-Windows-x64-Release
          path: |
            VoidOne-Windows-x64-Portable-*.zip*
            dist/*.*
          retention-days: 30

  # ----------------------------------------------------------
  # 4. Publish Release to GitHub
  # ----------------------------------------------------------

  publish-release:
    name: Publish Official Release
    needs: [validate-version, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VoidOne-Windows-x64-Release
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VoidOne ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-files/**
