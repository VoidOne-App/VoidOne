name: NeonLauncher CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ================================================================
# GLOBAL SETTINGS
# ================================================================

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.11.1"
  BUILD_TYPE: Release
  APP_NAME: NeonLauncher
  EXECUTABLE_NAME: NeonLauncherApp

# ================================================================
# JOBS
# ================================================================

jobs:

  # ==============================================================
  # LINUX X64
  # ==============================================================

  build-linux:
    name: Build Linux x64

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Install Dependencies
      # ----------------------------------------------------------

      - name: Install Linux Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            zip \
            unzip \
            libgl1-mesa-dev \
            libpulse-dev

      # ----------------------------------------------------------
      # Install Qt
      # ----------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      # ----------------------------------------------------------
      # Configure ccache
      # ----------------------------------------------------------

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neonlauncher-linux-x64

      # ----------------------------------------------------------
      # Configure CMake
      # ----------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --parallel

      # ----------------------------------------------------------
      # Verify executable
      # ----------------------------------------------------------

      - name: Verify Linux Build
        shell: bash
        run: |
          set -euo pipefail

          APP="build/bin/${EXECUTABLE_NAME}"

          if [[ ! -f "$APP" ]]; then
            echo "::error::Linux executable not found: $APP"
            exit 1
          fi

          if [[ ! -x "$APP" ]]; then
            echo "::error::Linux executable is not executable."
            exit 1
          fi

          echo "========================================"
          echo "Linux Build"
          echo "========================================"

          ls -lh "$APP"

          file "$APP"

      # ----------------------------------------------------------
      # Package
      # ----------------------------------------------------------

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package

          mkdir -p package

          cp \
            "build/bin/${EXECUTABLE_NAME}" \
            package/

          cd package

          zip \
            -9 \
            -r \
            "../NeonLauncher-Linux-x64.zip" \
            .

      # ----------------------------------------------------------
      # Validate ZIP
      # ----------------------------------------------------------

      - name: Validate Linux Archive
        shell: bash
        run: |
          set -euo pipefail

          test -s NeonLauncher-Linux-x64.zip

          unzip -t NeonLauncher-Linux-x64.zip

      # ----------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------

      - name: Generate Linux SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            NeonLauncher-Linux-x64.zip \
            > NeonLauncher-Linux-x64.zip.sha256

          echo "========================================"
          echo "Linux SHA256"
          echo "========================================"

          cat NeonLauncher-Linux-x64.zip.sha256

      # ----------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: |
            NeonLauncher-Linux-x64.zip
            NeonLauncher-Linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ==============================================================
  # WINDOWS X64
  # ==============================================================

  build-windows:
    name: Build Windows x64

    runs-on: windows-2025

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Install Qt
      # ----------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # ----------------------------------------------------------
      # Verify Qt
      # ----------------------------------------------------------

      - name: Verify Qt Installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Qt Environment"
          Write-Host "========================================"

          Write-Host "Qt6_DIR:"
          Write-Host $env:Qt6_DIR

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "qmake:"
          Get-Command qmake -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "windeployqt:"
          Get-Command windeployqt -ErrorAction SilentlyContinue

      # ----------------------------------------------------------
      # Configure CMake
      # ----------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      # ----------------------------------------------------------
      # Verify executable
      # ----------------------------------------------------------

      - name: Verify Windows Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/NeonLauncherApp.exe"

          if (-not (Test-Path $exe)) {

            Write-Host "Expected executable was not found."

            Write-Host ""
            Write-Host "Searching build directory..."

            Get-ChildItem `
              -Path build `
              -Filter "NeonLauncherApp.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue

            throw "NeonLauncherApp.exe was not produced."
          }

          $file = Get-Item $exe

          Write-Host "========================================"
          Write-Host "Windows Build"
          Write-Host "========================================"

          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      # ----------------------------------------------------------
      # Deploy Qt Runtime
      # ----------------------------------------------------------

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Resolve-Path `
            "build/bin/Release/NeonLauncherApp.exe"

          Write-Host "========================================"
          Write-Host "Deploying Qt Runtime"
          Write-Host "========================================"

          windeployqt `
            --release `
            --compiler-runtime `
            --qmldir "src/ui/qml" `
            "$exe"

      # ----------------------------------------------------------
      # Verify Qt Deployment
      # ----------------------------------------------------------

      - name: Verify Windows Deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "build/bin/Release"

          $required = @(
            "NeonLauncherApp.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Quick.dll",
            "Qt6Sql.dll"
          )

          Write-Host "========================================"
          Write-Host "Qt Deployment Validation"
          Write-Host "========================================"

          foreach ($file in $required) {

            $path = Join-Path $root $file

            if (-not (Test-Path $path)) {
              throw "Required deployment file is missing: $path"
            }

            Write-Host "OK: $file"
          }

      # ----------------------------------------------------------
      # Verify QML Module
      # ----------------------------------------------------------

      - name: Prepare QML Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $qmlRoot = "build/bin/Release/qml/NeonLauncher"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $qmlRoot | Out-Null

          Copy-Item `
            -Recurse `
            -Force `
            "src/ui/qml/*" `
            $qmlRoot

          Write-Host "========================================"
          Write-Host "QML Files"
          Write-Host "========================================"

          Get-ChildItem `
            $qmlRoot `
            -Recurse `
            -File

      # ----------------------------------------------------------
      # Package
      # ----------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "NeonLauncher-Windows-x64.zip") {
            Remove-Item `
              "NeonLauncher-Windows-x64.zip" `
              -Force
          }

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -CompressionLevel Optimal

      # ----------------------------------------------------------
      # Validate ZIP
      # ----------------------------------------------------------

      - name: Validate Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Get-Item `
            "NeonLauncher-Windows-x64.zip"

          if ($archive.Length -le 0) {
            throw "Windows archive is empty."
          }

          Write-Host "========================================"
          Write-Host "Windows Archive"
          Write-Host "========================================"

          Write-Host "Path: $($archive.FullName)"
          Write-Host "Size: $($archive.Length) bytes"

      # ----------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  NeonLauncher-Windows-x64.zip" |
            Set-Content `
              "NeonLauncher-Windows-x64.zip.sha256" `
              -Encoding ascii

          Write-Host "========================================"
          Write-Host "Windows SHA256"
          Write-Host "========================================"

          Get-Content `
            "NeonLauncher-Windows-x64.zip.sha256"

      # ----------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ==============================================================
  # GITHUB RELEASE
  # ==============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-windows

    # Release فقط برای tagهای v*
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # Download Linux
      # ----------------------------------------------------------

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      # ----------------------------------------------------------
      # Download Windows
      # ----------------------------------------------------------

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      # ----------------------------------------------------------
      # Generate Combined Checksums
      # ----------------------------------------------------------

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          cat \
            NeonLauncher-Linux-x64.zip.sha256 \
            NeonLauncher-Windows-x64.zip.sha256 \
            > SHA256SUMS.txt

          echo "========================================"
          echo "NeonLauncher SHA256"
          echo "========================================"

          cat SHA256SUMS.txt

      # ----------------------------------------------------------
      # Verify Release Files
      # ----------------------------------------------------------

      - name: Verify Release Files
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          test -s NeonLauncher-Linux-x64.zip
          test -s NeonLauncher-Windows-x64.zip

          test -s NeonLauncher-Linux-x64.zip.sha256
          test -s NeonLauncher-Windows-x64.zip.sha256

          test -s SHA256SUMS.txt

      # ----------------------------------------------------------
      # Create Release
      # ----------------------------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

          files: |
            release/NeonLauncher-Linux-x64.zip
            release/NeonLauncher-Windows-x64.zip
            release/NeonLauncher-Linux-x64.zip.sha256
            release/NeonLauncher-Windows-x64.zip.sha256
            release/SHA256SUMS.txt
