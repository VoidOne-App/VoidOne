name: NeonLauncher CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Prevent duplicate builds for the same ref.
concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: CI only needs to read the repository.
permissions:
  contents: read

env:
  QT_VERSION: "6.11.1"
  BUILD_TYPE: Release
  APP_NAME: NeonLauncher
  EXECUTABLE_NAME: NeonLauncherApp

jobs:

  # ================================================================
  # LINUX
  # ================================================================

  build-linux:
    name: Build Linux x64

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Install Qt
      # ------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install Linux Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            zip \
            unzip \
            libgl1-mesa-dev \
            libpulse-dev

      # ------------------------------------------------------------
      # Configure ccache
      # ------------------------------------------------------------

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neonlauncher-linux-x64

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --parallel

      # ------------------------------------------------------------
      # Verify executable
      # ------------------------------------------------------------

      - name: Verify Linux Build
        shell: bash
        run: |
          set -euo pipefail

          APP="build/bin/${EXECUTABLE_NAME}"

          if [[ ! -f "$APP" ]]; then
            echo "::error::Linux executable was not found: $APP"
            exit 1
          fi

          if [[ ! -x "$APP" ]]; then
            echo "::error::Linux executable is not executable."
            exit 1
          fi

          echo "Linux executable:"
          ls -lh "$APP"

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package

          cp \
            "build/bin/${EXECUTABLE_NAME}" \
            package/

          cd package

          zip \
            -9 \
            -r \
            "../NeonLauncher-Linux-x64.zip" \
            .

      # ------------------------------------------------------------
      # Validate archive
      # ------------------------------------------------------------

      - name: Validate Linux Archive
        shell: bash
        run: |
          set -euo pipefail

          unzip -t NeonLauncher-Linux-x64.zip

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------

      - name: Generate Linux SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            NeonLauncher-Linux-x64.zip \
            > NeonLauncher-Linux-x64.zip.sha256

          cat NeonLauncher-Linux-x64.zip.sha256

      # ------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: |
            NeonLauncher-Linux-x64.zip
            NeonLauncher-Linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ================================================================
  # WINDOWS
  # ================================================================

  build-windows:
    name: Build Windows x64

    runs-on: windows-2025

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Install Qt
      # ------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # ------------------------------------------------------------
      # Verify Qt
      # ------------------------------------------------------------

      - name: Verify Qt Installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Qt installation:"
          Write-Host $env:Qt6_DIR

          if (-not $env:Qt6_DIR) {
            Write-Warning "Qt6_DIR is not set. Searching PATH..."
          }

          Write-Host ""
          Write-Host "qmake:"
          Get-Command qmake -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      # ------------------------------------------------------------
      # Locate executable
      # ------------------------------------------------------------

      - name: Verify Windows Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/NeonLauncherApp.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "Expected executable not found."

            Write-Host ""
            Write-Host "Searching build directory..."

            Get-ChildItem `
              -Path build `
              -Filter "NeonLauncherApp.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue

            throw "NeonLauncherApp.exe was not produced."
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "Windows executable:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"

      # ------------------------------------------------------------
      # Deploy Qt
      # ------------------------------------------------------------

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Resolve-Path `
            "build/bin/Release/NeonLauncherApp.exe"

          Write-Host "Deploying Qt runtime..."

          windeployqt `
            --release `
            --compiler-runtime `
            --qmldir "src/ui/qml" `
            "$exe"

      # ------------------------------------------------------------
      # Verify Qt deployment
      # ------------------------------------------------------------

      - name: Verify Windows Deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "build/bin/Release"

          $required = @(
            "NeonLauncherApp.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Quick.dll",
            "Qt6Sql.dll"
          )

          foreach ($file in $required) {

            $path = Join-Path $root $file

            if (-not (Test-Path $path)) {
              throw "Required deployment file is missing: $path"
            }

            Write-Host "OK: $file"
          }

      # ------------------------------------------------------------
      # QML
      # ------------------------------------------------------------

      - name: Verify QML Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $qmlRoot = "build/bin/Release/qml/NeonLauncher"

          if (-not (Test-Path $qmlRoot)) {
            Write-Host "Creating QML module directory..."
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $qmlRoot | Out-Null
          }

          Copy-Item `
            -Recurse `
            -Force `
            "src/ui/qml/*" `
            $qmlRoot

          Write-Host ""
          Write-Host "QML files deployed:"
          Get-ChildItem `
            $qmlRoot `
            -Recurse `
            -File

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "NeonLauncher-Windows-x64.zip") {
            Remove-Item `
              "NeonLauncher-Windows-x64.zip" `
              -Force
          }

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -CompressionLevel Optimal

      # ------------------------------------------------------------
      # Validate archive
      # ------------------------------------------------------------

      - name: Validate Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Get-Item "NeonLauncher-Windows-x64.zip"

          if ($archive.Length -le 0) {
            throw "Windows archive is empty."
          }

          Write-Host "Archive:"
          Write-Host $archive.FullName
          Write-Host "Size: $($archive.Length) bytes"

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  NeonLauncher-Windows-x64.zip" |
            Set-Content `
              "NeonLauncher-Windows-x64.zip.sha256" `
              -Encoding ascii

          Get-Content `
            "NeonLauncher-Windows-x64.zip.sha256"

      # ------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ================================================================
  # RELEASE
  # ================================================================

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-windows

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ------------------------------------------------------------
      # Download artifacts
      # ------------------------------------------------------------

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      # ------------------------------------------------------------
      # Generate combined checksums
      # ------------------------------------------------------------

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          cat \
            NeonLauncher-Linux-x64.zip.sha256 \
            NeonLauncher-Windows-x64.zip.sha256 \
            > SHA256SUMS.txt

          echo "========================================"
          echo "NeonLauncher SHA256"
          echo "========================================"

          cat SHA256SUMS.txt

      # ------------------------------------------------------------
      # Verify release files
      # ------------------------------------------------------------

      - name: Verify Release Files
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          test -s NeonLauncher-Linux-x64.zip
          test -s NeonLauncher-Windows-x64.zip
          test -s NeonLauncher-Linux-x64.zip.sha256
          test -s NeonLauncher-Windows-x64.zip.sha256
          test -s SHA256SUMS.txt

      # ------------------------------------------------------------
      # Create release
      # ------------------------------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/NeonLauncher-Linux-x64.zip
            release/NeonLauncher-Windows-x64.zip
            release/NeonLauncher-Linux-x64.zip.sha256
            release/NeonLauncher-Windows-x64.zip.sha256
            release/SHA256SUMS.txt-----------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -CompressionLevel Optimal

      # ----------------------------------------------------------------------
      # Validate ZIP
      # ----------------------------------------------------------------------

      - name: Validate Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "NeonLauncher-Windows-x64.zip"

          if (!(Test-Path $archive)) {
            Write-Error "Windows archive was not created."
            exit 1
          }

          $size = (Get-Item $archive).Length

          if ($size -le 0) {
            Write-Error "Windows archive is empty."
            exit 1
          }

          Write-Host "Archive:"
          Get-Item $archive |
            Format-List Name, Length, FullName

      # ----------------------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  NeonLauncher-Windows-x64.zip" |
            Out-File `
              "NeonLauncher-Windows-x64.zip.sha256" `
              -Encoding ascii

          Write-Host "SHA256:"
          Get-Content NeonLauncher-Windows-x64.zip.sha256

      # ----------------------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------------------

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


  # ==========================================================================
  # RELEASE
  # ==========================================================================

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-windows

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------------------
      # Download Artifacts
      # ----------------------------------------------------------------------

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: release

      # ----------------------------------------------------------------------
      # Generate Combined Checksums
      # ----------------------------------------------------------------------

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          cat \
            NeonLauncher-Linux-x64.zip.sha256 \
            NeonLauncher-Windows-x64.zip.sha256 \
            > SHA256SUMS.txt

          echo "========================================"
          echo "NeonLauncher SHA256 Checksums"
          echo "========================================"

          cat SHA256SUMS.txt

      # ----------------------------------------------------------------------
      # Release
      # ----------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true

          files: |
            release/NeonLauncher-Linux-x64.zip
            release/NeonLauncher-Windows-x64.zip
            release/SHA256SUMS.txt
