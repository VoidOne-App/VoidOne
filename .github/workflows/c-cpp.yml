name: NeonLauncher CI

on:
  push:
    branches:
      - main
      - feature/**
    paths-ignore:
      - "**.md"
      - ".gitignore"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:

  # ===========================================================================
  # Windows
  # ===========================================================================

  build-windows:
    name: Windows x64 • Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Qt
      # -----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.*"

          python -m aqt install-qt `
            windows desktop $env:QT_VERSION `
            win64_msvc2022_64 `
            --outputdir "$env:GITHUB_WORKSPACE\Qt"

      - name: Add Qt to PATH
        shell: pwsh
        run: |
          $qtBin = "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\msvc2022_64\bin"

          if (!(Test-Path $qtBin)) {
            Write-Error "Qt installation directory was not found: $qtBin"
          }

          Add-Content $env:GITHUB_PATH $qtBin

          Write-Host "Qt directory:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\msvc2022_64"

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\msvc2022_64"

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # -----------------------------------------------------------------------
      # Verify
      # -----------------------------------------------------------------------

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/bin/Release/NeonLauncherApp.exe"

          if (!(Test-Path $exe)) {
            Write-Error "NeonLauncherApp.exe was not found."
          }

          Write-Host "Build successful:"
          Get-Item $exe

      # -----------------------------------------------------------------------
      # Deploy Qt
      # -----------------------------------------------------------------------

      - name: Deploy Qt
        shell: pwsh
        run: |
          $exe = "build/bin/Release/NeonLauncherApp.exe"

          windeployqt `
            --release `
            --qmldir src/ui/qml `
            $exe

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath "NeonLauncher-Windows-x64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: NeonLauncher-Windows-x64.zip
          retention-days: 14


  # ===========================================================================
  # Linux
  # ===========================================================================

  build-linux:
    name: Linux x64 • Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # System dependencies
      # -----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev

      # -----------------------------------------------------------------------
      # Qt
      # -----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: gcc_64
          cache: true

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      # -----------------------------------------------------------------------
      # Verify
      # -----------------------------------------------------------------------

      - name: Verify executable
        run: |
          test -f build/bin/NeonLauncherApp

          echo "Build successful:"
          ls -lh build/bin/NeonLauncherApp

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------

      - name: Package Linux
        run: |
          mkdir -p dist

          cp build/bin/NeonLauncherApp dist/

          tar -czf \
            NeonLauncher-Linux-x64.tar.gz \
            -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: NeonLauncher-Linux-x64.tar.gz
          retention-days: 14


  # ===========================================================================
  # Final status
  # ===========================================================================

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux

    if: always()

    steps:

      - name: Check builds
        run: |
          if [ "${{ needs.build-windows.result }}" != "success" ]; then
            echo "Windows build failed."
            exit 1
          fi

          if [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "Linux build failed."
            exit 1
          fi

          echo "======================================"
          echo " NeonLauncher builds succeeded!"
          echo " Windows x64 : OK"
          echo " Linux x64   : OK"
          echo "======================================"
