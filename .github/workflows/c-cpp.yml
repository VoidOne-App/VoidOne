name: NeonLauncher CI/CD

on:
  push:
    branches:
      - main
      - Feature-add
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - Feature-add

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXX_STANDARD: "23"

jobs:

  windows-release:
    name: Windows x64 • Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # ========================================================
      # MSVC
      # ========================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ========================================================
      # Python
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade aqtinstall

      - name: Verify aqtinstall
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          python -m aqt version

      # ========================================================
      # Detect latest available Qt
      # ========================================================

      - name: Detect latest Qt version
        shell: pwsh
        run: |
          Write-Host "Querying available Qt versions..."

          $versions = python -m aqt list-qt windows desktop |
            Select-String -Pattern '^\s*6\.[0-9]+\.[0-9]+'

          if (-not $versions) {
            Write-Error "No Qt 6 versions were found."
            exit 1
          }

          $allVersions = @()

          foreach ($line in $versions) {
            $allVersions += ($line.ToString() -split '\s+')
          }

          $latest = $allVersions |
            Where-Object { $_ -match '^6\.[0-9]+\.[0-9]+$' } |
            Sort-Object {
              [version]$_
            } |
            Select-Object -Last 1

          if (-not $latest) {
            Write-Error "Could not determine latest Qt 6 version."
            exit 1
          }

          Write-Host "Latest available Qt 6 version: $latest"

          "QT_VERSION=$latest" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ========================================================
      # Detect architecture
      # ========================================================

      - name: Verify Qt architecture
        shell: pwsh
        run: |
          Write-Host "Checking MSVC 2022 x64 package..."

          python -m aqt list-qt windows desktop --arch "$env:QT_VERSION"

      # ========================================================
      # Install latest Qt
      # ========================================================

      - name: Install latest Qt
        shell: pwsh
        run: |
          Write-Host "Installing Qt $env:QT_VERSION..."

          python -m aqt install-qt `
            windows `
            desktop `
            "$env:QT_VERSION" `
            win64_msvc2022_64 `
            --outputdir "$env:GITHUB_WORKSPACE\Qt" `
            --autodesktop

      # ========================================================
      # Configure Qt environment
      # ========================================================

      - name: Configure Qt environment
        shell: pwsh
        run: |
          $qtRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Qt\$env:QT_VERSION\msvc2022_64"

          if (-not (Test-Path $qtRoot)) {
            Write-Error "Qt installation was not found: $qtRoot"
            exit 1
          }

          $qtBin = Join-Path $qtRoot "bin"

          "Qt6_DIR=$qtRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $qtBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "Qt root:"
          Write-Host $qtRoot

          Write-Host "Qt bin:"
          Write-Host $qtBin

      # ========================================================
      # Verify Qt
      # ========================================================

      - name: Verify Qt
        shell: pwsh
        run: |
          Write-Host "Qt version:"
          qmake --version

          Write-Host ""
          Write-Host "Qt directory:"
          Write-Host $env:Qt6_DIR

          if (-not (Test-Path "$env:Qt6_DIR\bin\windeployqt.exe")) {
            Write-Error "windeployqt.exe was not found."
            exit 1
          }

      # ========================================================
      # CMake
      # ========================================================

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Verify CMake
        shell: pwsh
        run: |
          cmake --version

      # ========================================================
      # Configure
      # ========================================================

      - name: Configure Release
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ========================================================
      # Build
      # ========================================================

      - name: Build Release
        shell: pwsh
        run: |
          cmake `
            --build build `
            --parallel

      # ========================================================
      # Locate executable
      # ========================================================

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Filter NeonLauncherApp.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "NeonLauncherApp.exe was not found."
            exit 1
          }

          "NEON_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Executable:"
          Write-Host $exe.FullName

      # ========================================================
      # Deploy Qt
      # ========================================================

      - name: Deploy Qt
        shell: pwsh
        run: |
          windeployqt `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE\src\ui\qml" `
            "$env:NEON_EXE"

      # ========================================================
      # Prepare package
      # ========================================================

      - name: Prepare Windows package
        shell: pwsh
        run: |
          Remove-Item `
            -Path package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path package `
            -Force |
            Out-Null

          $exe = Get-Item "$env:NEON_EXE"

          Copy-Item `
            -Path (Join-Path $exe.Directory.FullName "*") `
            -Destination package `
            -Recurse `
            -Force

      # ========================================================
      # Verify package
      # ========================================================

      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "package\NeonLauncherApp.exe")) {
            Write-Error "Packaged executable is missing."
            exit 1
          }

          Write-Host "Package contents:"
          Get-ChildItem package -Recurse

      # ========================================================
      # Smoke test
      # ========================================================

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath (Resolve-Path "package\NeonLauncherApp.exe") `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            Write-Error `
              "NeonLauncher exited immediately with code $($process.ExitCode)."
            exit 1
          }

          Write-Host "NeonLauncher started successfully."

          Stop-Process `
            -Id $process.Id `
            -Force `
            -ErrorAction SilentlyContinue

      # ========================================================
      # ZIP
      # ========================================================

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\* `
            -DestinationPath NeonLauncher-Windows-x64.zip `
            -CompressionLevel Optimal

      # ========================================================
      # SHA256
      # ========================================================

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          (Get-FileHash `
            NeonLauncher-Windows-x64.zip `
            -Algorithm SHA256).Hash |
            Out-File `
              NeonLauncher-Windows-x64.zip.sha256 `
              -Encoding ascii

      # ========================================================
      # Artifact
      # ========================================================

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          retention-days: 30
