Name: Stable Multi-Platform Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          cache: true

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libpulse-dev

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ github.job }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp build/NeonLauncherApp dist/
          cd dist && zip -r ../NeonLauncher-Linux-x64.zip .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: NeonLauncher-Linux-x64.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        run: windeployqt --release build/Release/NeonLauncherApp.exe --qmldir src/ui/qml

      - name: Copy QML files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/Release/qml
          Copy-Item -Recurse -Force src/ui/qml\* build/Release/qml\

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath NeonLauncher-Windows-x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: NeonLauncher-Windows-x64.zip
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NeonLauncher-Linux-x64/*.zip
            artifacts/NeonLauncher-Windows-x64/*.zip
          generate_release_notes: true
