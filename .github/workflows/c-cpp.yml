name: Multi-Platform Build & Automated Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          cache: true

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libpulse-dev ccache zip

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ github.job }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Package Linux
        run: |
          mkdir -p dist
          cp build/bin/NeonLauncherApp dist/
          cd dist && zip -r ../NeonLauncher-Linux-x64.zip .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Linux-x64
          path: NeonLauncher-Linux-x64.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        run: windeployqt --release --qmldir src/ui/qml build/bin/Release/NeonLauncherApp.exe

      - name: Copy QML files to NeonLauncher Module
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/bin/Release/qml/NeonLauncher"
          Copy-Item -Recurse -Force "src/ui/qml/*" "build/bin/Release/qml/NeonLauncher/"

      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path "build/bin/Release/*" -DestinationPath "NeonLauncher-Windows-x64.zip"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-Windows-x64
          path: NeonLauncher-Windows-x64.zip
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine Release Settings
        id: rel_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "TITLE=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=nightly-b${{ github.run_number }}.${{ github.run_attempt }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "TITLE=Nightly Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_info.outputs.TAG_NAME }}
          name: ${{ steps.rel_info.outputs.TITLE }}
          prerelease: ${{ steps.rel_info.outputs.IS_PRERELEASE }}
          files: |
            artifacts/NeonLauncher-Linux-x64/*.zip
            artifacts/NeonLauncher-Windows-x64/*.zip
          generate_release_notes: true
