name: NeonLauncher CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - ".gitignore"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"

  workflow_dispatch:

# Prevent duplicate runs for the same ref.
concurrency:
  group: neonlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions are intentionally minimal.
permissions:
  contents: read

env:
  QT_VERSION: "6.8.4"
  BUILD_TYPE: Release
  APP_NAME: NeonLauncherApp

# ============================================================================
# WINDOWS RELEASE
# ============================================================================

jobs:

  windows-release:

    name: Windows x64 • Release

    runs-on: windows-2025

    timeout-minutes: 40

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # Install Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: ""
          tools: "tools_cmake"

      # ----------------------------------------------------------------------
      # Verify Qt
      # ----------------------------------------------------------------------

      - name: Verify Qt Installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Qt Verification"
          Write-Host "========================================"

          Write-Host "Qt version requested: $env:QT_VERSION"
          Write-Host "Qt6_DIR: $env:Qt6_DIR"

          if (-not $env:Qt6_DIR) {
            Write-Error "Qt6_DIR is not defined."
            exit 1
          }

          if (-not (Test-Path $env:Qt6_DIR)) {
            Write-Error "Qt6_DIR does not exist: $env:Qt6_DIR"
            exit 1
          }

          $qmake = Get-Command qmake -ErrorAction SilentlyContinue

          if ($qmake) {
            Write-Host "qmake:"
            qmake --version
          }
          else {
            Write-Host "qmake not found in PATH."
            Write-Host "This is acceptable if CMake can locate Qt6."
          }

          Write-Host "Qt directory:"
          Get-ChildItem $env:Qt6_DIR | Select-Object Name

      # ----------------------------------------------------------------------
      # CMake
      # ----------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      # ----------------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------------

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      # ----------------------------------------------------------------------
      # Verify executable
      # ----------------------------------------------------------------------

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/NeonLauncherApp.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Windows executable was not found: $exe"
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "========================================"
          Write-Host "Windows executable found"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "========================================"

      # ----------------------------------------------------------------------
      # Deploy Qt Runtime
      # ----------------------------------------------------------------------

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/bin/Release/NeonLauncherApp.exe"

          $windeployqt = Get-Command windeployqt `
            -ErrorAction SilentlyContinue

          if (-not $windeployqt) {
            Write-Error "windeployqt was not found in PATH."
            exit 1
          }

          Write-Host "windeployqt:"
          windeployqt --version

          windeployqt `
            --release `
            --compiler-runtime `
            --qmldir "src/ui/qml" `
            "$exe"

      # ----------------------------------------------------------------------
      # Verify deployed runtime
      # ----------------------------------------------------------------------

      - name: Verify Windows Deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "build/bin/Release"

          $required = @(
            "NeonLauncherApp.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Qml.dll",
            "Qt6Quick.dll",
            "Qt6Sql.dll"
          )

          foreach ($file in $required) {

            $path = Join-Path $root $file

            if (-not (Test-Path $path)) {
              Write-Error "Required runtime file is missing: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "NeonLauncher-Windows-x64.zip"

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive `
            -Path "build/bin/Release/*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          if (-not (Test-Path $archive)) {
            Write-Error "Windows archive was not created."
            exit 1
          }

          $size = (Get-Item $archive).Length

          if ($size -le 0) {
            Write-Error "Windows archive is empty."
            exit 1
          }

          Write-Host "Windows archive size: $size bytes"

      # ----------------------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------------------

      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $hash = (
            Get-FileHash `
              "NeonLauncher-Windows-x64.zip" `
              -Algorithm SHA256
          ).Hash

          "$hash  NeonLauncher-Windows-x64.zip" |
            Out-File `
              -Encoding ascii `
              "NeonLauncher-Windows-x64.zip.sha256"

          Write-Host $hash

      # ----------------------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NeonLauncher-Windows-x64
          path: |
            NeonLauncher-Windows-x64.zip
            NeonLauncher-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


# ============================================================================
# LINUX RELEASE
# ============================================================================

  linux-release:

    name: Linux x64 • Release

    runs-on: ubuntu-24.04

    timeout-minutes: 40

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # Linux dependencies
      # ----------------------------------------------------------------------

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            zip \
            unzip \
            ccache \
            libgl1-mesa-dev \
            libpulse-dev

      # ----------------------------------------------------------------------
      # Qt
      # ----------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ""
          tools: "tools_cmake"

      # ----------------------------------------------------------------------
      # Verify Qt
      # ----------------------------------------------------------------------

      - name: Verify Qt Installation
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Qt Verification"
          echo "========================================"

          echo "Qt version: ${QT_VERSION}"
          echo "Qt6_DIR: ${Qt6_DIR:-NOT_SET}"

          if [ -z "${Qt6_DIR:-}" ]; then
            echo "ERROR: Qt6_DIR is not defined."
            exit 1
          fi

          if [ ! -d "$Qt6_DIR" ]; then
            echo "ERROR: Qt6_DIR does not exist."
            exit 1
          fi

          echo "Qt directory:"
          ls -la "$Qt6_DIR"

      # ----------------------------------------------------------------------
      # ccache
      # ----------------------------------------------------------------------

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neonlauncher-linux-${{ env.QT_VERSION }}

      # ----------------------------------------------------------------------
      # Configure
      # ----------------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ----------------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --parallel

      # ----------------------------------------------------------------------
      # Verify executable
      # ----------------------------------------------------------------------

      - name: Verify Linux Executable
        shell: bash
        run: |
          set -euo pipefail

          exe="build/bin/NeonLauncherApp"

          if [ ! -f "$exe" ]; then
            echo "ERROR: Linux executable not found: $exe"
            exit 1
          fi

          chmod +x "$exe"

          echo "Linux executable:"
          ls -lh "$exe"

          file "$exe"

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/linux

          cp \
            build/bin/NeonLauncherApp \
            dist/linux/

          cd dist/linux

          zip \
            -9 \
            -r \
            "../../NeonLauncher-Linux-x64.zip" \
            .

      # ----------------------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------------------

      - name: Generate Linux SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            NeonLauncher-Linux-x64.zip \
            > NeonLauncher-Linux-x64.zip.sha256

          cat NeonLauncher-Linux-x64.zip.sha256

      # ----------------------------------------------------------------------
      # Validate archive
      # ----------------------------------------------------------------------

      - name: Validate Linux Archive
        shell: bash
        run: |
          set -euo pipefail

          unzip -t \
            NeonLauncher-Linux-x64.zip

      # ----------------------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------------------

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NeonLauncher-Linux-x64
          path: |
            NeonLauncher-Linux-x64.zip
            NeonLauncher-Linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30


# ============================================================================
# LINUX SANITIZERS
# ============================================================================

  linux-sanitizers:

    name: Linux • ASan + UBSan

    runs-on: ubuntu-24.04

    timeout-minutes: 35

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ""
          tools: "tools_cmake"

      - name: Configure Sanitizers
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-sanitizers \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build Sanitized
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-sanitizers \
            --parallel


# ============================================================================
# UNIT TESTS / CMAKE VALIDATION
# ============================================================================

  unit-tests:

    name: CMake • Test Configuration

    runs-on: ubuntu-24.04

    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libpulse-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ""
          tools: "tools_cmake"

      - name: Configure Test Build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build Test Configuration
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-tests \
            --parallel

      - name: Run CTest
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "build-tests/CTestTestfile.cmake" ]; then
            ctest \
              --test-dir build-tests \
              --output-on-failure
          else
            echo "No CTest tests are registered."
            echo "Build validation completed successfully."
          fi


# ============================================================================
# RELEASE
# ============================================================================

  release:

    name: GitHub Release

    needs:
      - windows-release
      - linux-release
      - linux-sanitizers
      - unit-tests

    # Only create a release for version tags.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------------------
      # Download Windows artifact
      # ----------------------------------------------------------------------

      - name: Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: NeonLauncher-Windows-x64
          path: release/windows

      # ----------------------------------------------------------------------
      # Download Linux artifact
      # ----------------------------------------------------------------------

      - name: Download Linux Artifact
        uses: actions/download-artifact@v5
        with:
          name: NeonLauncher-Linux-x64
          path: release/linux

      # ----------------------------------------------------------------------
      # Generate combined checksum file
      # ----------------------------------------------------------------------

      - name: Generate Combined SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          cat \
            windows/NeonLauncher-Windows-x64.zip.sha256 \
            linux/NeonLauncher-Linux-x64.zip.sha256 \
            > SHA256SUMS.txt

          echo "========================================"
          echo "SHA256 CHECKSUMS"
          echo "========================================"

          cat SHA256SUMS.txt

      # ----------------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: NeonLauncher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/windows/NeonLauncher-Windows-x64.zip
            release/windows/NeonLauncher-Windows-x64.zip.sha256
            release/linux/NeonLauncher-Linux-x64.zip
            release/linux/NeonLauncher-Linux-x64.zip.sha256
            release/SHA256SUMS.txt
